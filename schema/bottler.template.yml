# =============================================================================
# BOTTLER SCHEMA TEMPLATE — v0.2
# =============================================================================
# Purpose: a bottler is a commercial entity that releases bottlings.
# This template covers both:
#   - Distillery-owned bottling operations (the Bruichladdich
#     bottling hall, for example) — though most OB releases don't
#     need a separate bottler entry because the distillery itself
#     stands in.
#   - Independent bottlers (Cadenhead's, Signatory, Gordon & MacPhail,
#     etc.) who source cask spirit from multiple distilleries.
#
# v0.1 → v0.2 changes (data-driven, from Signatory pressure-test):
#   - Series shape gains an OPTIONAL `parent: <series-id>` field for
#     parent/child relationships between series (e.g. Signatory's
#     Decanter Collection is a presentation variant of the Cask
#     Strength Collection).
#   - Series shape gains an OPTIONAL `presentation_defaults:` block
#     for series that enforce consistent presentation rules across
#     all bottlings (e.g. Signatory's Cask Strength Collection
#     always bottles single-cask at cask strength NCF natural-
#     colour; Un-Chillfiltered Collection always at 46% ABV vatted).
#     Bottling entries under such a series may omit the defaulted
#     fields; explicit bottling-level values override the series
#     default.
#
# Bottling entries reference bottlers via the `bottled_by` slug field
# in bottling.template.yml v0.2. Series references use the
# `bottler_series: <bottler-slug>/<series-id>` form on bottlings.
# See docs/handover.md section 7 for context.
# =============================================================================


# --- Identity ---------------------------------------------------------------
id: example-bottler                  # REQUIRED. Lowercase slug.
                                     # Convention: just the name
                                     # (cadenheads, gordon-macphail,
                                     # signatory-vintage).
name: null                           # REQUIRED. Display name.
also_known_as: []                    # Alternative names or historical
                                     # names (Wm. Cadenhead, etc.).
website: null


# --- Type -------------------------------------------------------------------
type: independent_bottler            # REQUIRED.
                                     # independent_bottler — sources from
                                     #   distilleries it does not own.
                                     # distillery_bottler — bottles releases
                                     #   from its parent distillery.


# --- Location ---------------------------------------------------------------
country: null
region: null
locality: null


# --- Status & Timeline ------------------------------------------------------
status: operating                    # operating | dormant | closed
founded: null                        # YYYY


# --- Ownership --------------------------------------------------------------
ownership:
  current: null                      # Current owning entity.
  parent: null                       # Parent company if applicable.
  history: []                        # List of past owners with from/to
                                     # years, same pattern as the
                                     # distillery template.


# --- Operations -------------------------------------------------------------
release_types: []                    # List of typical release formats:
                                     # single_cask | small_batch | vatting |
                                     # blended_malt | blended_whisky | other
                                     # Most IBs do single_cask predominantly;
                                     # some (Compass Box) do blended_malt.

sources_from: []                     # OPTIONAL. List of distillery slugs
                                     # the bottler regularly sources from,
                                     # where this is publicly known. Not
                                     # always disclosed — some IBs trade
                                     # casks under "Secret Highland Malt"
                                     # style framings when the source
                                     # distillery doesn't permit naming.


# --- Series -----------------------------------------------------------------
series: []                           # List of named release series the
                                     # bottler runs. Shape per entry
                                     # (v0.2):
                                     #
                                     #   - id: cask-strength-collection
                                     #     name: Cask Strength Collection
                                     #     description: |
                                     #       Brief description in reference
                                     #       register.
                                     #     first_released: null    # YYYY
                                     #     active: true            # boolean
                                     #
                                     #     # OPTIONAL: parent series for
                                     #     # hierarchical relationships.
                                     #     # Use when this series is a
                                     #     # presentation variant or
                                     #     # sub-batch of another.
                                     #     parent: null            # OR <series-id>
                                     #
                                     #     # OPTIONAL: presentation defaults
                                     #     # inherited by bottlings under
                                     #     # this series. Each field
                                     #     # individually optional; a
                                     #     # bottling may override any
                                     #     # field explicitly. Omit the
                                     #     # whole block (or set to null)
                                     #     # for series with no fixed
                                     #     # presentation rules.
                                     #     presentation_defaults:
                                     #       cask_strength: true
                                     #       non_chill_filtered: true
                                     #       natural_colour: true
                                     #       batch_or_cask_type: single_cask
                                     #                            # single_cask |
                                     #                            # small_batch |
                                     #                            # vatting |
                                     #                            # batch
                                     #       abv: null            # number when
                                     #                            # the series
                                     #                            # enforces a
                                     #                            # fixed ABV
                                     #                            # (e.g. 46.0
                                     #                            # for UCF,
                                     #                            # 57.1 for
                                     #                            # 100 Proof);
                                     #                            # null otherwise
                                     #
                                     # Bottling entries reference series
                                     # via `bottler_series: <bottler-slug>/<series-id>`
                                     # (e.g. signatory-vintage/cask-strength-collection).


# --- Description ------------------------------------------------------------
description: null                    # Strict reference register.
                                     # 2-4 sentences. What the bottler does,
                                     # who owns it, what distinguishes its
                                     # release approach. Not marketing.


# --- External Identifiers ---------------------------------------------------
external_ids:
  wikidata_qid: null
  whiskybase_id: null


# --- Sources ----------------------------------------------------------------
sources: []                          # Same numbered-list pattern as
                                     # elsewhere.


# --- Metadata ---------------------------------------------------------------
schema_version: 0.2
confidence: stub
last_reviewed: 2026-05-15
contributors: []
