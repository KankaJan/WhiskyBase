# =============================================================================
# WhiskyBase — GitHub Pages deploy (root hosting)
# =============================================================================
# Auto-deploys on push to master, and can also be run manually.
#
# HOSTING MODEL: ROOT. The site's internal links are root-absolute
# (href="/distilleries/", etc.), so the deployed site must be served from
# the domain root. That means one of:
#   - a custom domain (Settings -> Pages -> Custom domain), or
#   - a user/org Pages repo named <owner>.github.io.
# A bare project repo (this one, KankaJan/WhiskyBase) without a custom
# domain is served from a SUBPATH (https://kankajan.github.io/WhiskyBase/),
# where root-absolute links and assets would 404. To use the subpath
# instead, first make internal links base-aware (prefix with
# import.meta.env.BASE_URL) and run the manual trigger with base_path set.
#
# Set the deployed origin (for canonical / OG URLs) in
# Settings -> Secrets and variables -> Actions -> Variables as `SITE`,
# e.g. SITE = https://whiskybase.example. If unset, the build still
# succeeds; canonical/OG URLs are simply omitted.
#
# One-time: Settings -> Pages -> Build and deployment -> Source =
# "GitHub Actions".
# =============================================================================
name: deploy

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      base_path:
        description: >-
          Optional base path for a project-subpath deploy, e.g. /WhiskyBase.
          Leave blank for root hosting (the default). A non-blank value
          requires base-aware internal links first — see the header note.
        required: false
        default: ""

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    env:
      # Deployed origin for absolute URLs (sitemap, canonical, OG). Set the
      # `SITE` Actions variable to your root domain; empty is fine.
      SITE: ${{ vars.SITE }}
      # Empty on push (root). Only set via the manual trigger's input.
      BASE_PATH: ${{ github.event.inputs.base_path }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build site (Astro + Pagefind)
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
