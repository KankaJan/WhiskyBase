# =============================================================================
# WhiskyBase — GitHub Pages deploy (root hosting)
# =============================================================================
# Auto-deploys on push to master, and can also be run manually.
#
# HOSTING MODEL: SUBPATH. This bare project repo is served from
# https://kankajan.github.io/WhiskyBase/. Internal links are base-aware
# (prefixed with import.meta.env.BASE_URL), and the build supplies
# BASE_PATH=/WhiskyBase (see the env block below) so links and assets
# resolve under the subpath. To host at the domain ROOT instead (a custom
# domain, or a <owner>.github.io repo), run the manual trigger with
# base_path set to "/" and point a custom domain at the Pages site.
#
# Set the deployed origin (for canonical / OG URLs) in
# Settings -> Secrets and variables -> Actions -> Variables as `SITE`,
# e.g. SITE = https://whiskybase.example. If unset, the build still
# succeeds; canonical/OG URLs are simply omitted.
#
# One-time: Settings -> Pages -> Build and deployment -> Source =
# "GitHub Actions".
# =============================================================================
name: deploy

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      base_path:
        description: >-
          Base path for the deploy. Blank defaults to /WhiskyBase (the
          project-repo subpath). Set to "/" for root hosting (custom domain
          or <owner>.github.io repo).
        required: false
        default: ""

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # Latest push wins: cancel superseded in-progress/queued deploys so a
  # slower deploy of an older commit cannot finish last and overwrite a
  # newer one. (Fixes the multi-PR-merge deploy race seen 2026-06-15, where
  # an earlier commit's deploy completed after the tip's and reverted the
  # live site.)
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    env:
      # Deployed origin for absolute URLs (sitemap, canonical, OG).
      # Defaults to the github.io user origin; override by setting the
      # `SITE` Actions variable (e.g. a custom domain). Combined with
      # BASE_PATH, Astro builds canonical/OG as <SITE><BASE_PATH>/...
      SITE: ${{ vars.SITE || 'https://kankajan.github.io' }}
      # Project-repo subpath hosting: the site is served from
      # https://kankajan.github.io/WhiskyBase/. Defaults to /WhiskyBase on
      # both push and a blank manual run; pass a different base_path via the
      # manual trigger to override (use "/" for root, e.g. a custom domain).
      BASE_PATH: ${{ github.event.inputs.base_path || '/WhiskyBase' }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # Astro 6 requires Node >= 22.12.0
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build site (Astro + Pagefind)
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
