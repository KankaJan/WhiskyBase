# --- Status & Timeline ------------------------------------------------------
status: operating
founded: 1817                           # Informal founding year per
                                        # the producer: John Bulloch
                                        # established the Duntocher
                                        # distillery on the
                                        # Auchentoshan estate. The
                                        # site received its legal
                                        # licence in 1823 under the
                                        # post-Excise-Act regime [1].
first_spirit: 1817
mothballed_periods:
  - from: 1941                          # Distillery operations
    to: 1948                            # halted during World War II
                                        # following German bomb
                                        # damage to the warehouse
                                        # complex (the Clyde
                                        # shipyards were the primary
                                        # target; Auchentoshan sat
                                        # near them). Production
                                        # resumed in 1948 [1][2].
    note: |
      German air raid in 1941 destroyed a warehouse; whisky
      production stopped for the duration of the war and resumed
      1948. Wartime grain controls were the operative cause
      across the wider Scottish industry, but Auchentoshan's
      specific gap is anchored to the bomb-damage event [1].


# --- Ownership --------------------------------------------------------------
ownership:
  current: Suntory Global Spirits
  parent: Suntory Holdings Limited      # Japanese parent. The 2014
                                        # Beam-Suntory merger and the
                                        # 2024 rebrand from Beam
                                        # Suntory to Suntory Global
                                        # Spirits both happened
                                        # within the Suntory
                                        # Holdings ownership.
  history:
    - owner: John Bulloch
      from: 1817
      to: 1834
      notes: |
        Founding ownership as the Duntocher Distillery; site
        established initially as a tax-avoidance arrangement
        on the Auchentoshan estate, then licensed in 1823 [1].
    - owner: John Hart & Alexander Filshie
      from: 1834
      to: 1878
      notes: |
        Renamed Auchentoshan under the Hart & Filshie
        ownership after Bulloch's financial trouble [1].
    - owner: C.H. Curtis and Co Ltd. / John Hardie
      from: 1878
      to: 1903
      notes: |
        Curtis era; producer's history references an output of
        around 50,000 gallons a year by the end of the
        century [1].
    - owner: Maclachlan Brothers (George and John)
      from: 1903
      to: 1960
      notes: |
        Maclachlan period spans most of the early-to-mid
        twentieth century, including the 1941 bombing and
        the 1948 production restart [1].
    - owner: J&R Tennent Ltd.
      from: 1960
      to: 1969
      notes: |
        Tennent — the Glasgow-based brewer — owned the
        distillery briefly during the 1960s [1].
    - owner: Eddie Cairns Ltd.
      from: 1969
      to: 1984
      notes: |
        Brief independent-owner period under John Milne's
        leadership [1].
    - owner: Stanley P. Morrison / Morrison Bowmore
      from: 1984
      to: 1994
      notes: |
        Acquired in 1984 by Stanley P. Morrison; the
        Morrison family ownership through Morrison Bowmore
        Distillers Ltd. brought Auchentoshan into the same
        portfolio as Bowmore and Glen Garioch. Suntory took
        an initial stake in Morrison Bowmore in 1989 [1][3].
    - owner: Suntory Ltd.
      from: 1994
      to: 2014
      notes: |
        Suntory acquired 100% of Morrison Bowmore in 1994,
        bringing Auchentoshan under direct Japanese
        ownership [1][3].
    - owner: Beam Suntory / Suntory Global Spirits
      from: 2014
      to: null
      notes: |
        2014 Beam Inc. / Suntory Holdings merger formed
        Beam Suntory; the company rebranded as Suntory
        Global Spirits in 2024 [1].


