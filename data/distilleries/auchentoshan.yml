# Schema: distillery.template.yml v0.2
# Entry confidence: medium — site identity, ownership lineage, and
# triple-distillation regime are well-grounded against the producer
# source and standard trade references. Specific equipment capacities
# come from a trade database (whisky.com) and should be verified
# against The Malt Whisky Yearbook.
# =============================================================================
# Eleventh populated distillery. Second populated Lowland-region
# entry after Glenkinchie. **First populated triple-distilled
# default production** — direct contrast to Glenkinchie's double
# distillation under the same Lowlands regional designation. The
# Springbank-site triple-distilled Hazelburn production line is
# already in the data set but sits within a distillery whose
# default Springbank line is 2.5-times distilled; Auchentoshan is
# the only Scottish distillery where every drop of production is
# triple-distilled [1].
# =============================================================================


