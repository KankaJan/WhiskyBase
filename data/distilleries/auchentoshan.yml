# --- Description ------------------------------------------------------------
description: |
  Auchentoshan is a Lowland malt-whisky distillery at Dalmuir near
  Clydebank, on the north bank of the River Clyde just north-west
  of Glasgow [1][2]. Founded informally in 1817 by John Bulloch as
  the Duntocher Distillery on the Auchentoshan estate, the site
  was licensed in 1823 under the post-Excise-Act regime and renamed
  Auchentoshan in 1834 [1]. **Triple distillation has been the
  distillery's continuous production regime since the licensed
  start**: producer materials describe Auchentoshan as the only
  Scottish distillery where every drop of production is
  triple-distilled, the regime distinguishing it from the typical
  Scotch double-distillation pattern that the rest of the
  project's populated distilleries follow [1][3].
  Auchentoshan is the second populated Lowland distillery in the
  project after Glenkinchie; the two sit in the same SWA-Regulations
  regional designation but exercise opposite distillation regimes —
  Glenkinchie at the conventional double, Auchentoshan at the
  three-still triple. The site was bombed during World War II (1941)
  with operations halted until 1948; ownership has run through
  Bulloch → Hart & Filshie → Curtis → Maclachlan → Tennent → Cairns →
  Morrison → Suntory (1994) → Beam Suntory / Suntory Global
  Spirits (2014-) [1][3]. Triple distillation lifts the
  spirit-still output to approximately 81% ABV per producer
  disclosure (compared with the ~70% reached by typical double-
  distillation regimes), producing a lighter and structurally
  cleaner new make at the cost of some flavour-precursor retention
  [4]. The default production is unpeated; the core bottling
  range is ex-bourbon-led with sherry-cask secondary maturation in
  the 12 Year Old and Three Wood expressions.


