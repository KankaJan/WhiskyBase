equipment_changes:
  - year: 1840
    change: |
      Peat kilns constructed at the current site, overlooking
      the bay. The producer states that "Laphroaig's peat
      kilns" — the building used for cold-smoking the malted
      barley with peat reek before drying — date from this
      construction [1].
    notes: |
      Producer-disclosed installation date for the kiln
      complex. The on-site floor-malting and peat-kilning
      operation has been continuous since.
    source_id: 1


