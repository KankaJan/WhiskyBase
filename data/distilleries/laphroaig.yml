# --- Description ------------------------------------------------------------
description: |
  Laphroaig is a heavily-peated malt-whisky distillery on the south
  coast of Islay, roughly one mile east of Port Ellen village,
  adjacent to Lagavulin and Ardbeg in the "Kildalton" cluster of
  south-coast Islay producers [1][2]. Founded in 1815 by brothers
  Donald and Alexander Johnston, the distillery passed through
  the Johnston family for nearly 140 years before Bessie
  Williamson — the distillery's secretary since 1934 — took
  control on the death of the last direct Johnston descendant
  in 1954 [2]. Williamson's ownership through 1962 is widely
  cited as the founding of Laphroaig's modern marketing identity.
  The site has subsequently passed through Long John /
  Whitbread / Allied Distillers / Allied Domecq / Fortune Brands /
  Beam Inc. / Beam Suntory ownership, settling under Suntory
  Global Spirits since the 2024 rebrand [2].
  **Floor malting on-site covers approximately 20% of Laphroaig's
  malt demand**, peated to ~50-60 ppm using local Islay peat;
  the remaining ~80% is supplied by Simpsons Malt at the
  industry-standard ~45 ppm Islay-peat spec, and the two streams
  are blended into the distillery's mash [1][3]. The on-site
  floor-malting + kilning operation has run continuously since
  the 1840 kiln-house construction.
  The distillery runs an **asymmetric 3-wash + 4-spirit-still
  configuration** (most distilleries pair wash and spirit stills
  evenly), with **unusually tall ascending lyne arms** that
  promote heavy reflux and remove heavier flavour compounds —
  the producer cites this combined with a slow distillation rate
  as the equipment-level basis for Laphroaig's light-bodied,
  iodine-and-tar peat profile [1]. The spirit cut is taken
  unusually late: producer-disclosed first cut at 45 minutes
  into the second-distillation run (claimed as the latest cut in
  the industry) and second cut at 60 minutes, stripping out the
  sweeter heads while retaining the tarry / herbal / peaty middle
  cut. Distilling fill strength is 63.5% ABV per producer
  disclosure [1].
  Maturation is predominantly in ex-bourbon casks sourced from
  Maker's Mark in Kentucky — an internal-supply-chain relationship
  within the Suntory Global Spirits portfolio (Maker's Mark is a
  sister bourbon distillery) [1]. The on-site coastal warehouses
  contribute the producer-attributed "maritime character" through
  sea-spray-saturated air contact during maturation.
  Laphroaig has held a Royal Warrant from HRH The Prince of Wales
  (subsequently HM King Charles III after the 2022 accession)
  since 1994 [2].


