# --- Status & Timeline ------------------------------------------------------
status: operating
founded: 1815                           # Founded by brothers Donald
                                        # and Alexander Johnston,
                                        # Islay farmers who distilled
                                        # alongside their farming
                                        # operation [2].
first_spirit: 1815
mothballed_periods: []                  # No major modern mothballing
                                        # documented across the
                                        # surveyed sources.


# --- Ownership --------------------------------------------------------------
ownership:
  current: Suntory Global Spirits
  parent: Suntory Holdings Limited      # Japanese parent; the 2024
                                        # Beam-Suntory rebrand to
                                        # Suntory Global Spirits sits
                                        # within Suntory Holdings.
  history:
    - owner: Donald and Alexander Johnston
      from: 1815
      to: 1857
      notes: |
        Founding ownership. The Johnston brothers established
        Laphroaig as a sideline to their farming on the
        Laphroaig estate. Alexander Johnston operated the
        distillery after Donald's death [2].
    - owner: Johnston family
      from: 1857
      to: 1954
      notes: |
        The Johnston family retained ownership through several
        generations across the late 19th and early 20th
        centuries [2].
    - owner: Bessie Williamson (Elizabeth Leitch Williamson)
      from: 1954
      to: 1962
      notes: |
        Bessie Williamson — the distillery secretary who had
        joined Laphroaig in 1934 — inherited control after
        the death of Ian Hunter (the last direct Johnston
        descendant) in 1954. She was one of the first women
        to own and run a Scotch whisky distillery in the
        modern industry era. Williamson is widely cited as
        the founder of Laphroaig's modern marketing
        positioning [2].
    - owner: Long John International / Schenley
      from: 1962
      to: 1975
      notes: |
        Williamson sold to Long John International (US-owned,
        Schenley Industries portfolio) in 1962, though she
        continued in a managing role until her retirement
        in 1972 [2].
    - owner: Whitbread / Allied Brewers
      from: 1975
      to: 1990
      notes: |
        Long John was acquired by Whitbread in 1975, then
        absorbed into the wider Allied Brewers portfolio.
    - owner: Allied Distillers / Allied Domecq
      from: 1990
      to: 2005
      notes: |
        Allied Distillers / Allied Domecq held Laphroaig
        through the 1990s and early 2000s alongside the
        wider Ballantine's blend portfolio [2].
    - owner: Fortune Brands / Beam Global
      from: 2005
      to: 2014
      notes: |
        Allied Domecq was broken up in 2005; the spirits
        portfolio including Laphroaig went to Fortune Brands,
        which became Beam Inc. (later Beam Global) in 2011 [2].
    - owner: Beam Suntory / Suntory Global Spirits
      from: 2014
      to: null
      notes: |
        2014 Beam-Suntory merger; 2024 rebrand to Suntory
        Global Spirits. Laphroaig has been royally warranted
        as supplier to HRH The Prince of Wales (now HM King
        Charles III) since 1994 — the only Islay distillery
        with a Royal Warrant at the time of issue [2].


# --- Production: Inputs (site-level) ----------------------------------------
water_source: Kilbride Stream           # Producer-disclosed water
                                        # source: the Kilbride Stream
                                        # / Kilbride reservoir, fed
                                        # by peaty Islay catchment.
                                        # Used both as process water
                                        # and as coolant throughout
                                        # the whisky-making process
                                        # per the producer [1].


# --- Production: Equipment (site-level) -------------------------------------
mash_tun:
  type: full_lauter
  material: stainless_steel
  capacity_kg: null

washbacks:
  count: 8
  material: stainless_steel
  capacity_litres: 55000                # Each washback at 55,000 L
                                        # per trade-reference
                                        # sources [3].
  notes: |
    Eight stainless-steel washbacks, each at approximately
    55,000 L capacity, supporting a ~72-hour fermentation
    per the producer's "two or so days" description [1][3].

stills:
  wash_still:
    count: 3                            # 3 wash stills — note the
                                        # asymmetric 3+4 still
                                        # configuration. Most
                                        # distilleries pair wash and
                                        # spirit stills evenly;
                                        # Laphroaig's 3 wash + 4
                                        # spirit arrangement means
                                        # the spirit stills run at
                                        # lower throughput per
                                        # still [1][3].
    capacity_litres: null
    charge_litres: null
    shape: onion                        # "Short, bulbous neck"
                                        # description per trade-
                                        # press sources; producer
                                        # describes them as the
                                        # larger of the two still
                                        # types.
    height_m: null
    heating: indirect_steam
    lyne_arm_angle: ascending           # **Producer-attributed
                                        # ceiling-height lyne arm**
                                        # — "Our lyne arm — which
                                        # links the still to the
                                        # condenser unit — reaches
                                        # right up to the ceiling.
                                        # This height combined with
                                        # our slow distillation rate
                                        # removes heavy oils and
                                        # overwhelming flavours" [1].
                                        # Producer claim that "only
                                        # four or five other
                                        # distilleries do it this
                                        # way" is producer-
                                        # attributed and would
                                        # benefit from independent
                                        # verification.
    condenser: shell_and_tube
  spirit_still:
    count: 4                            # 4 spirit stills, smaller
                                        # than the wash stills.
    capacity_litres: null
    charge_litres: null
    shape: onion
    height_m: null
    heating: indirect_steam
    lyne_arm_angle: ascending
    condenser: shell_and_tube

warehouses:
  - id: laphroaig-coastal
    type: dunnage
    location: on_site
    climate_notes: |
      On-site coastal warehousing on the south Islay shore.
      The producer attributes the "maritime character" of
      Laphroaig to the warehouse environment — sea-spray-
      saturated air in contact with the casks across the
      maturation period [1]. Shared south-coast climate with
      neighbouring Lagavulin and Ardbeg warehouses.


