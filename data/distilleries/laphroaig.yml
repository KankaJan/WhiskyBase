# =============================================================================
# Laphroaig
# =============================================================================
# Schema: distillery.template.yml v0.2
# Entry confidence: medium — site identity, ownership lineage,
# floor-malting practice and equipment configuration are well-
# grounded against the producer source. Specific phenol-ppm
# figures and washback / still capacities come from the producer
# combined with trade-database sources.
# =============================================================================
# Twelfth populated distillery. Third populated south-Islay
# heavily-peated entry after Lagavulin and the east-Islay Caol Ila;
# completes the south-coast peated cluster minus Ardbeg. Notable
# for an unusual 3-wash + 4-spirit still arrangement, very tall
# lyne arms with high reflux, and the latest first-cut time in
# the industry (45 minutes after the second-distillation start).
# Cross-references `practice/floor-malting` as the second populated
# floor-malting practitioner after Highland Park.
# =============================================================================


