name: Laphroaig
also_known_as: []                       # Gaelic origin disputed in
                                        # producer materials —
                                        # variously parsed as
                                        # "lag-bhròdhaich" or
                                        # "the beautiful hollow by
                                        # the broad bay" depending on
                                        # the source. The producer
                                        # has not standardised a
                                        # canonical Gaelic
                                        # transliteration on the
                                        # current website.
wikidata_qid: null
website: https://www.laphroaig.com/


# --- Location ---------------------------------------------------------------
country: Scotland
region: Islay                           # Formal SWA region under the
                                        # Scotch Whisky Regulations
                                        # 2009 [5]. South-coast Islay
                                        # — the heavily-peated
                                        # "Kildalton trio" cluster
                                        # (Laphroaig, Lagavulin,
                                        # Ardbeg).
sub_region: null
locality: Port Ellen, Isle of Islay     # On the south coast of Islay,
                                        # roughly one mile east of
                                        # Port Ellen village, adjacent
                                        # to Lagavulin (~one mile
                                        # further east) and Ardbeg
                                        # (~one mile beyond that).
                                        # The trio share the same
                                        # peat-and-sea-spray
                                        # maturation environment [1].
coordinates:
  lat: 55.628
  lon: -6.151                           # Approximate; the distillery
                                        # site on the south Islay
                                        # coast. Not producer-published
                                        # as specific coordinates;
                                        # derived from the Port Ellen
                                        # locality and should be
                                        # replaced with surveyed
                                        # coordinates when a primary
                                        # geographical source is to
