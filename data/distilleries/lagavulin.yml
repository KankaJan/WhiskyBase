# --- Description ------------------------------------------------------------
description: |
  Heavily peated Islay distillery founded in 1816 by John Johnston
  on Lagavulin Bay, on the Kildalton coast of southern Islay
  between Laphroaig and Ardbeg [1][2]. Acquired by James Mackie &
  Co (later White Horse Distillers) in 1889 and brought under
  Distillers Company Ltd ownership through the 1927 White Horse
  merger; subsequently passed through Guinness / United Distillers
  during the late-1980s industry consolidations and has been
  Diageo-owned since the 1997 Diageo formation. Lagavulin is one
  of the six original [Classic Malts of Scotland](concept/glossary/classic-malts)
  launched by United Distillers in the late 1980s. Production uses
  heavily-peated malt sourced from Diageo's Port Ellen Maltings
  (Lagavulin does not floor-malt on site) at approximately 35 ppm
  malt phenol spec, fermented in 10 pine washbacks, and distilled
  in two pear-shaped wash and spirit stills. The producer cites a
  particularly slow spirit-still run as character-shaping.
  Maturation is predominantly in coastal dunnage warehouses on
  the Lagavulin Bay site, which trade references frequently
  associate with the saline / iodine character commonly
  attributed to long-aged Lagavulin core releases in independent
  reviews.


