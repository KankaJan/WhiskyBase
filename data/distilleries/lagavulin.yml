warehouses:
  - id: lagavulin-bay-dunnage
    type: dunnage
    location: on_site
    climate_notes: |
      Traditional dunnage warehouses at Lagavulin Bay, on the
      southern coast of Islay. Coastal climate; cool, damp, saline
      air. The seafront location is cited by the producer and by
      trade references as contributing to the spirit's matured
      character, particularly the saline / iodine notes commonly
      attributed to Lagavulin's coastal-warehouse-aged stock [1].

# Lagavulin also has additional warehouse capacity in the broader
# Islay area and mainland storage at Diageo's Cambus and other sites.
# These are not separately enumerated here; the on-site coastal
# dunnage warehouses are the canonical maturation location for the
# Lagavulin character.


