# --- Description ------------------------------------------------------------
description: |
  Bunnahabhain is a malt whisky distillery on the north-east coast
  of Islay, founded in 1881 by William Robertson and the Greenlees
  brothers to supply single malt for the Claymore blend [1][2].
  The site sits within the formal Islay protected locality under
  the Scotch Whisky Regulations 2009 (see
  educational/swa-regional-designations) but is geographically
  and stylistically separate from the south-coast Islay cluster
  (Lagavulin, Laphroaig, Ardbeg, Bowmore): the distillery's water
  source is peat-free, and the default production-line spirit is
  lightly peated (around 1-2 ppm) rather than the 25-50 ppm range
  of the south-Islay producers. A separate peated sub-line
  (variously labelled Toiteach or Moine across release windows)
  produces a heavier-peated spirit (around 35-40 ppm spec).
  Ownership has trajectoried through Highland Distilleries (1887-
  1999), Edrington (1999-2003), Burn Stewart Distillers
  (2003-2013), and Distell Group (2013-onwards, becoming a
  Heineken subsidiary in 2023) [2][3]. The core range was
  re-presented in 2010 as non-chill-filtered natural colour at
  46.3% ABV, a transparency-positioning move from the
  Burn Stewart era that persisted under Distell ownership.


