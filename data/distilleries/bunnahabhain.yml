# --- Ownership --------------------------------------------------------------
ownership:
  current: Distell International Ltd
  parent: Heineken N.V.                # Distell acquired by Heineken
                                       # in 2023, completing a transition
                                       # from South African-listed
                                       # Distell Group to Heineken
                                       # subsidiary status.
  history:
    - owner: William Robertson and the Greenlees brothers
      from: 1881
      to: 1887
      notes: |
        Founding owners. The site was built specifically to supply
        single malt for the Greenlees brothers' Claymore blend, in
        a remote north-east Islay location chosen for access to
        peat-free water and shipping by the Sound of Islay.
    - owner: Highland Distilleries Co. Ltd
      from: 1887
      to: 1999
      notes: |
        Bunnahabhain became part of the Highland Distilleries
        amalgamation in 1887, then operated under continuous
        Highland Distilleries ownership through the 20th century
        (including the 1982-84 mothballing period) until
        Edrington's acquisition of Highland Distilleries [2].
    - owner: Edrington (via Highland Distillers Group)
      from: 1999
      to: 2003
      notes: |
        Edrington acquired Highland Distilleries Co. in 1999;
        Bunnahabhain transferred as part of the deal but was sold
        on shortly afterwards along with Tobermory and Deanston
        as Edrington focused on its core Macallan / Highland Park
        / Famous Grouse portfolio.
    - owner: Burn Stewart Distillers
      from: 2003
      to: 2013
      notes: |
        Burn Stewart Distillers acquired Bunnahabhain (plus
        Tobermory and Deanston) from Edrington in 2003.
    - owner: Distell Group
      from: 2013
      to: 2023
      notes: |
        Distell Group (South Africa-listed) acquired Burn Stewart
        Distillers in 2013. During Distell ownership, Bunnahabhain
        transitioned its core range to non-chill-filtered natural
        colour presentation (announced 2010 before the Distell
        sale, fully effected during the Distell years).
    - owner: Distell International Ltd (Heineken subsidiary)
      from: 2023
      to: null
      notes: |
        Heineken completed acquisition of Distell in 2023;
        Bunnahabhain remains operated under the Distell
        International name as a Heineken subsidiary.


