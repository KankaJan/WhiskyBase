# --- SCHEMA-OBSERVATIONS observed during this entry -------------------------
# 1. **Peated sub-line modelling — RESOLVED 2026-05-17.**
#    Bunnahabhain produces both a default lightly-peated spirit
#    (Bunnahabhain Traditional) and a separate heavily-peated
#    sub-line (Toiteach / Moine across different release windows).
#    The Toiteach production is now modelled as a separate
#    `bunnahabhain-toiteach` production_line (added 2026-05-17),
#    matching the Springbank multi-line pattern. The choice for a
#    separate line rather than a `peating_variant:` attribute on
#    the default line reflects (a) the substantially different
#    malt input (peated commercial malt vs the default
#    lightly-peated supply), (b) the separate scheduled production
#    runs, and (c) the separately branded bottling (Toiteach core
#    is sold as a distinct product, not as a peated variant of
#    Bunnahabhain 12).
#
# 2. **Ownership-history continuity.** Bunnahabhain's ownership
#    transitioned across 5 distinct corporate entities since
#    founding, including the Heineken acquisition of Distell in
#    2023. The distillery template's `ownership.history` list
#    handles this cleanly with one entry per ownership period.
#    No schema gap.
#
# 3. **Margadale River / Loch Staoinsha water-source naming.**
#    The water-source field accepts a single string; the actual
#    source is documented variably as "Margadale River" (the
#    river) or "Loch Staoinsha" (the loch feeding the river).
#    Single string acceptable; this is producer-style naming
#    variance, not a schema issue.


