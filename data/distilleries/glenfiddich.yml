# --- Equipment & Configuration Changes Over Time ----------------------------
equipment_changes:
  - year: 1887
    change: |
      First stills commissioned. The producer's history
      records that Glenfiddich's original copper stills were
      second-hand equipment purchased from the Cardhu
      distillery; distillation began on these former Cardhu
      stills on Christmas Day 1887 [1].
    notes: |
      The Cardhu-stills origin is a producer-stated
      historical detail; the current 43-still configuration
      is the product of more than a century of subsequent
      expansion.
    source_id: 1
  - year: 1957
    change: |
      On-site coppersmiths established. Charles Gordon
      brought resident coppersmiths to the distillery to
      build and maintain Glenfiddich's stills; the producer
      cites this as the basis for the deliberately varied
      still shapes and sizes [1].
    source_id: 1
  - year: 1959
    change: |
      On-site cooperage established under Gordon Grant —
      one of the few distillery-resident cooperages still
      operating [1].
    source_id: 1
  - year: 1998
    change: |
      The Solera Vat installed — a large vatting vessel,
      inspired by the Spanish sherry solera, that is never
      emptied below the half-full mark and is continually
      topped up. It is used to marry the spirit for the
      Glenfiddich 15 Year Old; the partial-draw / partial-
      refill cycle gives that release its continuity of
      character [1].
    notes: |
      See the glenfiddich-15-solera bottling entry for how
      the Solera Vat shapes the 15 Year Old.
    source_id: 1


