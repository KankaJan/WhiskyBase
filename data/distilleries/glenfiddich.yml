# --- Status & Timeline ------------------------------------------------------
status: operating
founded: 1886                           # Producer states William
                                        # Grant and his nine children
                                        # began building the
                                        # distillery by hand in the
                                        # summer of 1886; the
                                        # producer's own timeline
                                        # block elsewhere dates the
                                        # build start to 1887. The
                                        # project records 1886 as the
                                        # founding (build-start) year
                                        # and 1887 as first spirit
                                        # (see first_spirit) [1].
first_spirit: 1887                       # Producer-disclosed: "the
                                        # first drop of spirit fell
                                        # from our copper stills on
                                        # Christmas Day 1887" [1].
mothballed_periods: []                   # No major modern mothballing.
                                        # The producer notes that by
                                        # the end of the 1920s
                                        # Glenfiddich was "one of only
                                        # six distilleries still
                                        # operating in Scotland" —
                                        # i.e. it ran through the
                                        # Prohibition-era and
                                        # interwar industry
                                        # contraction without
                                        # stopping [1].


# --- Ownership --------------------------------------------------------------
ownership:
  current: William Grant & Sons Ltd
  parent: null                          # William Grant & Sons Ltd is
                                        # the direct owner and the
                                        # ultimate parent — an
                                        # independent, family-owned
                                        # company. Registered in
                                        # Scotland, company number
                                        # SC131772 [1].
  history:
    - owner: William Grant & Sons
      from: 1886
      to: null
      notes: |
        Glenfiddich has been owned by William Grant & Sons —
        the company William Grant founded — in unbroken
        family ownership since the distillery was built. The
        firm remains one of the few sizeable Scotch producers
        still entirely family-owned, run by descendants of
        the founder across five generations of involvement
        (Grant Gordon joined in the 1920s; Charles Gordon
        brought coppersmiths on-site in 1957; Sandy Grant
        Gordon drove the 1963 single-malt export-marketing
        decision) [1]. Unbroken single-family ownership at
        this scale is unusual in the Scotch industry, where
        most distilleries have passed through corporate-
        acquisition cycles — a structural parallel to
        Glenfarclas (J. & G. Grant, family-owned since 1865;
        no corporate relationship between the two Grant
        families).


