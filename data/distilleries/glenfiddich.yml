# Glenfiddich
# =============================================================================
# Schema: distillery.template.yml v0.2
# Entry confidence: medium — site identity, ownership, founding
# history, and the broad production configuration are well-grounded
# against the producer source. Specific still-by-still heating
# splits and exact equipment counts come from trade-database
# sources and are hedged where the producer does not confirm them.
# =============================================================================
# Thirteenth populated distillery. Second populated Speyside entry
# after Glenfarclas. Among the world's best-selling single malts,
# and the distillery most closely associated with the creation of
# the modern single-malt category as a marketed product (the 1963
# export-marketing decision).
# =============================================================================


