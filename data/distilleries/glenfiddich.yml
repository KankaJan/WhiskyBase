# --- Description ------------------------------------------------------------
description: |
  Glenfiddich is a Speyside malt-whisky distillery at Dufftown,
  Banffshire, founded in 1886 by William Grant — who built the
  distillery by hand with his nine children and a single stone
  mason — with the first spirit running on Christmas Day 1887
  [1]. The original stills were second-hand equipment bought
  from the Cardhu distillery. Glenfiddich has been owned by
  William Grant & Sons in unbroken family ownership since, one
  of the few sizeable Scotch producers still entirely
  family-owned (a structural parallel to the unrelated
  Grant family's Glenfarclas).
  The distillery occupies a particular place in the history of
  the single-malt category: in 1963 Sandy Grant Gordon, the
  founder's great-grandson, made Glenfiddich the first single
  malt actively marketed and promoted outside Scotland, at a
  time when single malt was a category largely unknown to
  consumers accustomed to blended Scotch [1]. Glenfiddich is
  consistently cited among the world's best-selling single malts
  by volume — it and Glenlivet have traded the top-selling
  position over the years, with the ranking depending on the
  market and the measure used — and, by the producer's own
  award-count claim, the most-awarded single malt in the
  International Wine & Spirit Competition and the International
  Spirits Challenge since 2000.
  Production runs at very large scale — approximately 21 million
  litres of alcohol per year through 48 Douglas-fir washbacks
  and 43 copper stills (16 wash, 27 spirit) [3]. The still hall
  is unusual: on-site coppersmiths (resident since 1957)
  maintain deliberately varied still shapes and sizes, and 15 of
  the 27 spirit stills are direct-fired by gas — a configuration
  most large modern distilleries have abandoned in favour of
  indirect steam. The site also retains a working on-site
  cooperage (established 1959). Maturation inventory exceeds one
  million casks across dunnage and racked warehouses. The 1998
  installation of the Solera Vat — a continually-replenished
  marrying vessel inspired by the Spanish sherry solera —
  underpins the Glenfiddich 15 Year Old. The default production
  is unpeated; the core range is ex-bourbon-led with sherry-cask
  components in the older and Solera expressions.


