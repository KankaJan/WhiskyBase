# --- Description ------------------------------------------------------------
description: |
  Aberlour is a Speyside single-malt distillery at Charlestown of Aberlour,
  Moray, where the Lour Burn meets the River Spey. The modern distillery
  was built in 1879 by the local banker and entrepreneur James Fleming, on
  a site that had carried an earlier distillery from 1826 [1]. It has been
  a Pernod Ricard brand since 1975 (acquired via Campbell Distilleries) and
  sits in the Chivas Brothers stable alongside Glenlivet [1].

  The house style is sherry-influenced. The core range is built on "double
  cask" maturation — marrying ex-bourbon American oak with oloroso-seasoned
  sherry casks — and the distillery is best known for A'bunadh ("the
  original" in Gaelic), a no-age-statement single malt matured exclusively
  in first-fill Spanish oloroso sherry butts and bottled at cask strength
  without chill-filtration or added colour, in individually numbered
  batches [1][2].

  Production runs at about 3.9 million LPA on two wash stills (21,310 L)
  and two spirit stills of differing size (20,000 L and 15,456 L) with
  shell-and-tube condensers [1].


