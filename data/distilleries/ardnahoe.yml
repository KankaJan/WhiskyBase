# --- Description ------------------------------------------------------------
description: |
  Ardnahoe is the newest distillery on Islay, on the island's north-east
  coast near Port Askaig, opened in 2018 by the independent bottler Hunter
  Laing as the first new Islay distillery in fifteen years [1]. It produces
  a peated Islay spirit (~40 ppm) on one wash and one spirit still, at
  ~900,000 LPA, drawing process water from Ardnahoe Loch [1].

  Its distinctive equipment choice is a deliberately traditional one: worm-
  tub condensers paired with unusually long lye pipes [1]. Worm tubs give
  less copper contact (a heavier, more sulphury spirit) while the long lye
  pipes pull the other way through increased reflux — an unusual
  combination for a brand-new distillery. Ardnahoe's first whisky, the
  five-year-old Inaugural Release, was bottled in 2024.


