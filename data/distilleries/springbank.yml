# --- SCHEMA-GAPS observed during this pressure-test ------------------------
# This block is non-schema content for the distillery v0.2 promotion
# discussion. Springbank is the third distillery in the project and
# the second pressure-test of the distillery v0.1 schema.
#
# 1. **Multiple warehouses (CONFIRMED).** Predicted in TODO and in
#    handover §10 deferred-decisions list. Confirmed here: Springbank
#    has multiple distinct warehouses on the Campbeltown site
#    (dunnage + racked) plus additional warehousing at the adjacent
#    Glengyle distillery. The single-block `warehouse:` field cannot
#    capture this. v0.2 design: change `warehouse:` to a list of
#    warehouse entries, each carrying the current type/location/
#    climate_notes fields plus optionally a `name:` or `description:`
#    for distinguishing entries.
#
#    Suggested v0.2 shape:
#    ```yaml
#    warehouses:                  # NB plural
#      - id: campbeltown-dunnage  # OPTIONAL identifier
#        type: dunnage
#        location: on_site
#        climate_notes: |
#          Traditional dunnage warehouses on the Springbank site
#          ...
#      - id: glengyle-overflow
#        type: racked
#        location: off_site       # NB Glengyle is adjacent but
#                                 # technically separate site
#        climate_notes: |
#          ...
#    ```
#
#    Migration: Harris and Bruichladdich both currently use a single
#    warehouse block. Their v0.2 form would be a one-element list,
#    preserving all existing fields.
#
# 2. **Distillation regime per-line.** The `distillation.regime` enum
#    on production_line already includes `2.5x` and `partial_triple`
#    (verified during this pressure-test). No schema gap for
#    Springbank's distillation specifically. ✓
#
# 3. **Floor maltings (NEW for Springbank).** The `malt.source` enum
#    on production_line already includes `floor_malted_onsite` —
#    will be used by Springbank's three production lines. No schema
#    gap. ✓ However, the schema doesn't currently model the FLOOR
#    MALTINGS as equipment in their own right (analogous to mash tun,
#    washbacks, stills). For now this is captured in the production_
#    line's malt block; the floor maltings as a site-level piece of
#    equipment could become a candidate addition if a future
#    distillery (or a future detailed Springbank entry) needs to
#    record specific malting-floor dimensions, capacity, peat-burning
#    schedule, etc. Defer.
#
# 4. **Direct-fired wash still (NEW for Springbank).** The
#    `still.heating` enum (per `wash_still.heating: direct_fire`
#    above) already supports this value. ✓ No schema gap.
#
# 5. **Continuous family ownership lineage.** The `ownership.history`
#    block works fine for Springbank's two-period history (Reid 1828-
#    1837; Mitchells 1837-present). No schema gap. ✓


