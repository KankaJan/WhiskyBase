# --- Description ------------------------------------------------------------
description: |
  The Glenlivet is a Speyside single-malt distillery at Minmore in the
  parish of Glenlivet, Moray, founded in 1824 by George Smith, the first
  distiller in the glen to take a licence under the Excise Act 1823 [1].
  That primacy is the basis of the brand's "the single malt that started
  it all" positioning. Smith moved production from the original Upper
  Drumin farm to the purpose-built Minmore distillery in 1858-59 [1].

  The "Glenlivet" name itself was contested in law. As the glen's whisky
  gained value, numerous distilleries appended "Glenlivet" to their own
  names; the Smith family sued in 1881, and an 1884 compromise let the
  Smith distillery use "The Glenlivet" alone while others could only
  hyphenate as "-Glenlivet" [1]. The definite article became a mark of
  legal distinction rather than grammar.

  Ownership passed from George Smith (1824) to his son John Gordon Smith
  (1871), through twentieth-century mergers — with Glen Grant (1953),
  then Longmorn and Hill Thomson to form The Glenlivet Distillers Ltd
  (1970) — to Seagram (1977) and, on Seagram's break-up, to Pernod
  Ricard's Chivas Brothers (2001) [1].

  The house style is the light, floral, fruity Speyside register: the
  spirit is unpeated and distilled on tall, lantern-shaped copper pot
  stills with long, narrow necks, a geometry that promotes high reflux
  and a clean, light new make [1]. Maturation is led by American oak
  (ex-bourbon), with European-oak sherry and, in selected expressions,
  new French-oak components.

  The Glenlivet is the biggest-selling single malt in the United States
  and the second-biggest single malt globally, after Glenfiddich — the
  two Speyside brands form the long-standing best-seller pair of the
  category [1]. Production scale matches that standing: a 2010 extension
  took capacity to about 10.5 million LPA, and a new stillhouse opened in
  the 2024 bicentenary doubled it again to roughly 21 million litres a
  year across 28 stills [1][2].


