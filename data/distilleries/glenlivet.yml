# --- Equipment & Configuration Changes Over Time ----------------------------
equipment_changes:
  - year: 2010
    change: |
      A major extension (opened by the Prince of Wales) added a mash
      tun, eight washbacks and new stills, taking the still count to
      14 and increasing capacity by roughly 75% to approximately 10.5
      million LPA [1].
    source_id: 1
  - year: 2024
    change: |
      A new stillhouse, opened in the distillery's bicentenary year,
      added seven new pairs of lantern-shaped stills, taking the
      total to 28 and doubling annual capacity to roughly 21 million
      litres [2]. Wikipedia records ground broken on a further
      expansion in 2015 [1].
    source_id: 2


