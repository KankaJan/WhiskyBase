# --- Ownership --------------------------------------------------------------
ownership:
  current: Chivas Brothers Ltd
  parent: Pernod Ricard                   # The Glenlivet is operated by
                                          # Chivas Brothers, the Scotch arm
                                          # of Pernod Ricard, which took the
                                          # Seagram spirits portfolio in
                                          # 2001 [1].
  history:
    - owner: George Smith
      from: 1824
      to: 1871
      notes: |
        Founded and licensed the distillery in 1824; moved production
        from the Upper Drumin farm to the purpose-built Minmore
        distillery in 1858-59 [1].
    - owner: John Gordon Smith
      from: 1871
      to: 1953
      notes: |
        George Smith's son inherited in 1871. Under the Smith family
        the "Glenlivet" name was defended in law: after many
        distilleries had appended "Glenlivet" to their own names, the
        family (George Smith Grant, the founder's grandson) sued in
        1881, and an 1884 compromise let the Smith distillery use
        "The Glenlivet" alone while others could only hyphenate as
        "-Glenlivet". Some 26 distilleries did so; the practice has
        since died out [1].
    - owner: The Glenlivet Distillers Ltd
      from: 1953
      to: 1977
      notes: |
        Merged with J&J Grant of Glen Grant in 1953 to form The
        Glenlivet and Glen Grant Distillers Ltd; further mergers
        (Longmorn, Hill Thomson) formed The Glenlivet Distillers Ltd
        in 1970 [1].
    - owner: The Seagram Company
      from: 1977
      to: 2001
      notes: |
        Seagram acquired The Glenlivet Distillers Ltd in 1977,
        placing it in the Chivas Brothers stable [1]. (Some trade
        histories date this to 1978 — see glenlivet.NOTES.md.)
    - owner: Pernod Ricard (Chivas Brothers)
      from: 2001
      to: null
      notes: |
        On Seagram's 2000-2001 break-up, Pernod Ricard acquired the
        drinks business and The Glenlivet passed to its Chivas
        Brothers subsidiary [1]. Wikipedia dates the change to 2000
        (deal announcement); the acquisition completed in December
        2001 — see glenlivet.NOTES.md.


