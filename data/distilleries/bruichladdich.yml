# --- Status & Timeline ------------------------------------------------------
status: operating
founded: 1881                     # Built by the Harvey brothers [1][2].
first_spirit: 1881
mothballed_periods:
  - from: 1929
    to: 1936                     # Approximate — closures during the
                                  # 1920s-30s downturn; sources differ on
                                  # exact dates. TODO verify.
  - from: 1994
    to: 2001                     # Closed by Whyte and Mackay 1994 [1].
                                  # Production resumed under the Reynier
                                  # ownership group in May 2001 [1][2].


# --- Ownership --------------------------------------------------------------
ownership:
  current: Bruichladdich Distillery Co. Ltd
  parent: Rémy Cointreau          # Acquired July 2012 for £58m [3].
  history:
    - owner: Harvey family / Bruichladdich Proprietors Ltd
      from: 1881
      to: 1936                    # William Harvey ran the distillery until
                                  # his death in 1936 [1].
    - owner: Associated Scottish Distilleries Ltd
      from: 1936
      to: 1969
    - owner: Invergordon Distillers Ltd
      from: 1969
      to: 1993                    # Approximate; sold on to Whyte and Mackay.
    - owner: Whyte and Mackay
      from: 1993
      to: 2000                    # Mothballed 1994; sold December 2000 [1].
    - owner: Bruichladdich Distillery Co. Ltd (Reynier-led group)
      from: 2000
      to: 2012                    # Acquired 19 December 2000 by Murray
                                  # McDavid group led by Mark Reynier [1].
                                  # Jim McEwan hired as master distiller [1].
    - owner: Rémy Cointreau (Bruichladdich Distillery Co. Ltd)
      from: 2012
      to: null


# --- Production: Inputs (site-level) ----------------------------------------
water_source: |
  Mash/process water: Bruichladdich reservoir / Bruichladdich loch
  (described as soft and peaty by the distillery) [4]. Cooling water:
  Bruichladdich burn [4]. Reduction and bottling water: Octomore farm
  spring [4][5].


# --- Production: Equipment (site-level) -------------------------------------
mash_tun:
  type: traditional_rake          # Open-topped cast iron rake-and-plough
                                  # mash tun dating from 1881 [4][2].
                                  # Described by the distillery as one of
                                  # only three surviving rake-and-plough
                                  # mash tuns operating in Scotland [4].
  material: cast_iron             # [3][4]
  capacity_kg: 7000               # 7 tonnes per [3][4]; Wikipedia [2] also
                                  # gives 7 tonnes. NOTE: one secondary
                                  # source [11] reports 6.2 tonnes; the
                                  # 7-tonne figure is consistent across
                                  # the distillery's own communications
                                  # and structured trade references.
                                  # Scotch Whisky's structured page [3]
                                  # gives 6.63 tonnes grist weight per mash,
                                  # which represents working charge rather
                                  # than vessel capacity.

washbacks:
  count: 6                        # [3][4][2]
  material: oregon_pine           # [4]. NOTE: Wikipedia [2] notes that
                                  # Oregon pine and Douglas fir are
                                  # sometimes used interchangeably for the
                                  # same species (Pseudotsuga menziesii);
                                  # this is a naming, not a material,
                                  # discrepancy.
  capacity_litres: 35000          # Total washback capacity ~210,000 L
                                  # across six vessels (~35,000 L each
                                  # working volume) [4][2]. One secondary
                                  # source [12] reports 60,000 L vessels
                                  # filled to ~35,000 L; this is consistent
                                  # if 60,000 L is total volume and
                                  # 35,000 L is working fill.

stills:
  wash_still:
    count: 2
    capacity_litres: 17500        # Per Scotch Whisky structured spec [3].
                                  # NOTE: still capacity figures conflict
                                  # significantly between sources. See
                                  # bruichladdich.NOTES.md for full
                                  # reconciliation. The 17,500 L size with
                                  # 11,500 L typical charge is the most
                                  # internally consistent published figure.
    charge_litres: 11500          # [3][2]
    shape: plain                  # Plain, wide, with a long neck [3]; "tall
                                  # and narrow-necked" is the usual
                                  # descriptor [2][6].
    height_m: 6.0                 # Spirit stills reported as 6 m tall with
                                  # 0.9 m wide necks [2]; wash stills are
                                  # of similar overall height.
    heating: indirect_steam       # Steam, internal coils [13]; Scotch
                                  # Whisky [3] gives "Steam" as heat source.
    lyne_arm_angle: descending
    condenser: shell_and_tube     # [3]
  spirit_still:
    count: 2
    capacity_litres: 12500        # Per Scotch Whisky [3]. Wikipedia [2]
                                  # gives 21,000 L total (~10,500 L each).
                                  # Diffords [4] gives 7,100 L each — likely
                                  # a charge-vs-capacity confusion. The
                                  # 12,500 L figure is the most current
                                  # structured reference.
    charge_litres: 9000           # [3]
    shape: plain                  # "Plain, long narrow neck" [3]; sometimes
                                  # described as "pear-shaped" by the
                                  # distillery and writers [2][13].
    height_m: 6.0                 # ~6 m to top of neck, with ~0.9 m neck
                                  # diameter [2].
    heating: indirect_steam
    lyne_arm_angle: descending
    condenser: shell_and_tube

# Plus one Lomond still ("Ugly Betty"), recovered from the demolished
# Inverleven distillery in Dumbarton and installed in 2010 [2]. Used
# exclusively for The Botanist gin from 2011 [2][13]; falls outside
# the Scotch single malt scope of this knowledge base but noted here
# for site equipment completeness.

warehouses:
  - type: mixed                     # Dunnage, racking and palletised, on the
                                    # distillery site and at additional Islay
                                    # locations including the former Octomore
                                    # farm [3][13].
    location: on_site               # All maturation takes place on Islay [10].
                                    # An explicit policy of the distillery
                                    # since the 2001 reopening.
    climate_notes: |
      Coastal location on Loch Indaal exposed to Atlantic weather [2][13].
      On-island maturation policy means all stocks are exposed to Islay's
      maritime climate.


# --- Capacity ---------------------------------------------------------------
annual_capacity_lpa: 1500000      # 1.5 million LPA, considered close to
                                  # current capacity [2][3][8].


# --- Equipment & Configuration Changes Over Time ----------------------------
equipment_changes:
  - year: 2001
    change: Distillery dismantled and reassembled
    notes: |
      Between January and May 2001 the entire distillery was dismantled
      and reassembled, with original Victorian décor and equipment
      retained where possible [2]. Most of the original Harvey-era
      machinery (mash tun, mill, stills) is still in use.
    source_id: 2
  - year: 2010
    change: Lomond still installed
    notes: |
      Last surviving Lomond still recovered from the demolished
      Inverleven distillery in Dumbarton, modified by Jim McEwan, used
      from 2011 for The Botanist gin [2]. Installation accompanied
      replacement of one wash still and creation of a window in the
      stillhouse wall [4].
    source_id: 2
  - year: 2003
    change: Harvey Bottling Hall opened on site
    notes: |
      In-house bottling hall opened 25 May 2003 [11]; one of the few
      Islay distilleries that bottles on the island.
    source_id: 11


# --- Production Lines Produced at This Site ---------------------------------
production_lines:
  - bruichladdich-bruichladdich   # Unpeated, the original house style.
  - bruichladdich-port-charlotte  # Heavily peated (40 ppm spec).
  - bruichladdich-octomore        # Super-heavily peated, variable per release.

# Plus The Botanist gin (Lomond still), outside the scope of this knowledge
# base. The three single-malt lines share the four pot stills, with
# production scheduled in batches; Octomore reportedly accounts for ~10%
# of annual spirit output [10].


# --- Used by Blenders -------------------------------------------------------
also_used_by_blenders: []         # The distillery's stated policy is that
                                  # 100% of single malt output is used for
                                  # its own bottlings; the spirit is not
                                  # supplied to blenders [4][3].


