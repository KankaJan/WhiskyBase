# --- Description ------------------------------------------------------------
description: |
  Founded in 1881 by the Harvey brothers — William, John, and Robert — on
  the western shore of Loch Indaal on the Rinns of Islay [1][2]. The
  distillery operated under several owners through the 20th century before
  being mothballed by Whyte and Mackay in 1994 [1]. It was acquired in
  December 2000 by a private investor group led by Mark Reynier of Murray
  McDavid, with Jim McEwan hired from Bowmore as master distiller, and
  resumed production in May 2001 [1][2]. Rémy Cointreau acquired the
  business in July 2012 for £58 million [3]. The site retains substantial
  Victorian equipment including an open cast-iron rake-and-plough mash tun
  from 1881, a belt-driven Boby mill, six wooden washbacks, and four tall,
  narrow-necked pot stills, plus a Lomond still added in 2010 for gin
  production [2][4]. Maturation takes place exclusively on Islay [10], and
  the distillery has used 100% Scottish barley since the 2001 reopening,
  with island-grown barley reaching 30%+ of supply [13][2]. Bruichladdich
  produces three single malt lines from the same equipment — unpeated
  Bruichladdich, peated Port Charlotte (40 ppm spec), and super-heavily
  peated Octomore — distinguishing the site from Islay neighbours that
  produce a single fixed-style spirit.


