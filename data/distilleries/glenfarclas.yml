# --- Ownership --------------------------------------------------------------
ownership:
  current: J. & G. Grant
  parent: null                         # J. & G. Grant is a private
                                       # family-owned company; no
                                       # commercial parent. The Grant
                                       # family of Glenfarclas is
                                       # distinct from the Grant
                                       # family of Glenfiddich
                                       # (William Grant & Sons) —
                                       # two unrelated Scottish
                                       # distilling families sharing
                                       # the surname.
  history:
    - owner: Robert Hay
      from: 1836
      to: 1865
      notes: |
        Distilling at the Glenfarclas site predates the 1823 Excise
        Act formalisation of licensed Scotch distilling; Robert
        Hay's 1836 licensing brought the operation into the
        formal regulatory framework. The early operating period
        is documented variably in the Speyside-history
        literature [1].
    - owner: J. & G. Grant (John and George Grant)
      from: 1865
      to: null
      notes: |
        John Grant bought the distillery from Robert Hay in 1865,
        beginning the continuous family ownership that has
        persisted through six generations to the present.
        Glenfarclas is among the very few large Scotch
        distilleries to have remained under uninterrupted
        family ownership since the 19th century — most Scotch
        distilleries have passed through corporate-acquisition
        cycles (Diageo, Pernod Ricard, Suntory, etc.) over the
        same period [1][2].


