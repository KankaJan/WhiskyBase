# --- Description ------------------------------------------------------------
description: |
  Glenfarclas is a malt whisky distillery at Marypark in
  Ballindalloch, on the Speyside slope of Ben Rinnes, founded
  in 1836 under the post-1823 Excise Act licensing framework and
  owned by the Grant family (J. & G. Grant) in continuous unbroken
  succession since 1865 [1][2]. The site sits within the formal
  Speyside protected locality under the Scotch Whisky Regulations
  2009 (see educational/swa-regional-designations) — specifically
  on the slope of Ben Rinnes, the Speyside mountain shared as a
  water source by several surrounding distilleries.
  Glenfarclas is one of the very small set of Scotch distilleries
  retaining direct-fired distillation on all stills — gas heating
  applied directly under the still copper, rather than the modern
  indirect-steam standard — which contributes to the distillery's
  heavier-bodied sulphury-edged house style. The maturation
  programme is heavily sherry-cask-led, with oloroso ex-sherry
  butts predominant in the core range. The Grant-family ownership
  has spanned six generations and is unusual among large Scotch
  distilleries, most of which have passed through corporate-
  acquisition cycles over the same period.


