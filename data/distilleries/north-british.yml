# Nineteenth populated distillery and the project's SECOND grain distillery
# (after Cameronbridge). It is the confirming example for the grain-schema
# structuring: with a maize-led bill (85% maize / 15% malted barley) it
# contrasts with Cameronbridge's wheat, which is exactly why the cereal
# bill warranted a structured field. Uses the `stills.column_stills` and
# `cereal_bill` fields added in CHANGELOG [0.8.7]. Notable too for its
# 50:50 Diageo/Edrington joint-venture ownership and its founding purpose:
# an independent grain supplier set up to break the DCL grain monopoly.
# =============================================================================


