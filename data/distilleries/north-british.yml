# --- Description ------------------------------------------------------------
description: |
  North British is a grain-whisky distillery in the Gorgie area of
  Edinburgh, established in 1885 by the blenders Andrew Usher, William
  Sanderson and John M. Crabbie [1]. It was founded for a strategic
  reason: to give blending houses an independent, high-volume source of
  grain spirit outside the Distillers Company's grain monopoly. That
  independence persists in an unusual form today — the North British
  Distillery Company is owned 50:50 by Diageo and Edrington through the
  Lothian Distillers joint venture, and supplies grain whisky to both
  groups' blends (Johnnie Walker, The Famous Grouse) [1].

  Like Cameronbridge it distils by continuous Coffey-still distillation
  to a high strength (~94.5% ABV) [2], but its cereal bill is the
  contrast that makes the case for recording grain bills structurally:
  North British is maize-led, at roughly 85% maize to 15% malted barley
  [2], where Cameronbridge is wheat-led. The maize is imported (reported
  as ~3,000 tonnes a week from France via the Port of Leith) [1].
  Capacity is about 65 million LPA [1].

  North British is a pure blending-grain supplier: it carries no standing
  official single-grain range. Its spirit reaches drinkers as single
  grain mainly through independent bottlers — see north-british.NOTES.md.


