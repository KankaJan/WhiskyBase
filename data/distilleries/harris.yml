# --- Description ------------------------------------------------------------
description: |
  Founded in 2015 in Tarbert on the Isle of Harris, Outer Hebrides, by a
  group led by Anderson Bakewell and structured as a community-employer
  project; the site is the first legal distillery on Harris [1][3]. The
  initial £10 million build was supported by a £2.8 million combined
  grant from the Scottish Government and Highlands and Islands Enterprise
  [3]. Spirit production began on 17 December 2015 [3]. The site
  operates one wash still and one spirit still, both made by Frilli of
  Siena, with descending lyne arms and shell-and-tube condensers [2][9].
  The distillery is independently owned (Isle of Harris Distillers Ltd)
  and produces both single malt whisky and gin on the same premises [2].
  Water is drawn from Abhainn Cnoc a' Charrain, a stream flowing over
  Lewisian gneiss [1].


