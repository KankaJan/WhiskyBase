# --- Production: Equipment (site-level) -------------------------------------
mash_tun:
  type: semi_lauter               # [2][5]
  material: stainless_steel       # Clad in pine [5] / American oak [4].
                                  # Sources differ on cladding wood; both
                                  # agree the vessel itself is stainless steel.
  capacity_kg: 1200               # 1.2 tonnes per [2][4][5][6].
                                  # NOTE: one secondary source [7] reports
                                  # 1.5 tonnes; the 1.2-tonne figure is
                                  # consistent across more sources and
                                  # matches the distillery's own staff
                                  # account [6].

washbacks:
  count: 5                        # Per [2][5]. NOTE: two secondary sources
                                  # [4][7] state 8 washbacks. Discrepancy
                                  # unresolved; the 5-washback figure is
                                  # in the structured Scotch Whisky
                                  # Whiskypedia entry [2] which also
                                  # matches an independent visit account [5].
  material: oregon_pine           # Per [2][4][5]. NOTE: [7] states
                                  # Douglas fir; this is likely an error
                                  # given the consistency of other sources.
  capacity_litres: 6000           # Working volume per [2][6].

stills:
