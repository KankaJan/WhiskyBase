                                  # structured reference and is consistent
                                  # with photographs of the equipment.
    height_m: null
    heating: external_heat_exchanger
                                  # Steam from external heat exchangers [2].
    lyne_arm_angle: descending    # [5]
    condenser: shell_and_tube     # [2]
  spirit_still:
    count: 1
    capacity_litres: 5000         # [2][5][8]
    charge_litres: 4000           # [2]
    shape: onion                  # [2]
    height_m: null
    heating: external_heat_exchanger
    lyne_arm_angle: descending    # [5]
    condenser: shell_and_tube     # [2]

# Both stills manufactured by Frilli, Siena, Italy [9].

warehouses:
  - type: null                      # Type not consistently reported.
                                    # TODO: confirm dunnage vs racked.
    location: mixed                 # On-site warehouse in Tarbert; off-site
                                    # warehouse near Ardhasaig on the shores
                                    # of Loch a Siar [2][7].
    climate_notes: |
      Maritime location with oceanic climate moderated by the Gulf Stream
      despite the latitude (~57.9 °N). The distillery reports relatively
      stable seasonal temperatures, which it associates with reductive
      maturation conditions [1][7].


