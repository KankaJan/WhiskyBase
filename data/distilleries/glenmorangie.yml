# --- SCHEMA-OBSERVATIONS (sub-brand modelling question) -------------------
# This block documents an open data-modelling question rather than a
# schema gap that needs fixing.
#
# **The sub-brand question for Glenmorangie.** The distillery
# produces several distinct recipes beyond the standard
# Glenmorangie line:
#
# - **Glenmorangie Signet** — a blend that includes chocolate malt
#   (a heavily-kilned dark malt typically used in stout brewing,
#   uncommon in Scotch). Different malt source by definition.
# - **Glenmorangie Allta** — uses a wild yeast strain
#   (Saccharomyces diaemath) isolated from barley grown at
#   Cadboll Estate, rather than the standard distiller's yeast
#   used in the main line. Different fermentation.
# - **Private Edition releases** (Tùsail, Tarlogan, Astar,
#   Companta, etc.) — vary across several axes; some use
#   different malts (winter barley, heritage varieties), some
#   different yeasts, some different cask programmes.
#
# Per project precedent (Bruichladdich's three lines —
# Bruichladdich/Port Charlotte/Octomore — differ in malt
# peating, with all other equipment shared), Signet and Allta
# arguably warrant their own production_line entries because
# they involve different recipe variables. Astar is more
# borderline — same recipe, different cask programme.
#
# Decision for this entry: model only the main "glenmorangie-
# original" production line. Defer Signet and Allta as separate
# production_line entries until usage patterns justify the
# split. The current single-line modelling is closer to how the
# producer presents the brand (Glenmorangie as one company-level
# brand with sub-brands) than to the multi-line Bruichladdich
# pattern, but the project's bar for "separate production line"
# is recipe-variable difference, which Signet and Allta meet.
# This decision is provisional and worth revisiting when usage
# (specifically, populating Signet or Allta bottlings) forces
# the question.
#
# No schema gap. This is a modelling choice with two defensible
# options; the project's current data does not yet force the
# choice.


