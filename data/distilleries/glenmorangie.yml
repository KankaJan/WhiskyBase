# --- Description ------------------------------------------------------------
description: |
  Highland distillery founded in 1843 by William Matheson in Tain,
  Easter Ross, on the southern shore of the Dornoch Firth [1][2].
  Distinguished structurally by stills of unusual height (the body
  of each still measures approximately 5.14 m / 16'10"), paired
  with ascending lyne arms that give the spirit substantial reflux
  and contribute to the line's lightness. Glenmorangie has been
  continuously operating since 1843 with progressive equipment
  expansion; current configuration is eight stills (four wash, four
  spirit). Water is drawn from Tarlogie Springs, a hard mineralised
  source uncommon in Scotch whisky production [1]. The distillery
  was independent through the 19th century, owned by Macdonald &
  Muir / Glenmorangie plc for most of the 20th, and has been part
  of Moët Hennessy (the wines-and-spirits subsidiary of LVMH) since
  2004 [1][2]. Glenmorangie pioneered modern commercial cask-finish
  programmes (the Quinta Ruban, Lasanta, Nectar d'Or, Companta, and
  similar releases) and continues to develop limited Private
  Edition expressions.


