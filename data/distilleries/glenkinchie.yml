# --- Description ------------------------------------------------------------
description: |
  Glenkinchie is a Lowland malt-whisky distillery at Peaston Bank
  near Pencaitland in East Lothian, about 15 miles south-east of
  Edinburgh, founded in 1825 by the farmer brothers John and George
  Rate as the Milton Distillery and licensed under the Glenkinchie
  name in 1837 [1][2]. The site has been owned through the SMD →
  DCL → United Distillers → Diageo corporate lineage in continuous
  succession since 1925, with one historical gap: the Rate brothers
  were bankrupted in 1853 and the site operated as a sawmill until
  an Edinburgh syndicate restarted whisky production in 1881 [2].
  Glenkinchie was selected for the original Classic Malts of
  Scotland series in 1988 as the Lowland representative; in 2020
  Diageo positioned the site as "The Lowland Home of Johnnie
  Walker" within its four-corner brand-home programme alongside
  Caol Ila, Clynelish, and Cardhu, following a £185 million whisky-
  tourism investment [1][4]. Production runs on two pot stills
  (one wash, one spirit) with worm-tub condensers, an
  uncommon configuration among large modern distilleries; the
  producer describes the wash still as "the largest in the
  industry", with the specific capacity figure (30,963 L per
  trade-database sources) more than 50% larger than typical Scotch
  wash-still capacity [1][3]. The default production is unpeated
  and approximately 90% of the spirit historically supplies the
  Johnnie Walker blend programme; the 10% single-malt share is the
  source of the bottled core range, which since 1988 has been
  anchored by Glenkinchie 12 Year Old. The "Lowland" regional
  designation under the Scotch Whisky Regulations 2009 covers
  Glenkinchie geographically; the contested "triple-distilled
  Lowland" stereotype does not apply — Glenkinchie has been
  double-distilled throughout the project-relevant period (the
  triple-distilled Lowland is Auchentoshan).


