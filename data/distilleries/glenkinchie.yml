# =============================================================================
# Glenkinchie
# =============================================================================
# Schema: distillery.template.yml v0.2
# Entry confidence: medium — site identity, ownership lineage, and
# core equipment configuration are well-grounded against the producer
# source and standard trade references. Annual-capacity figures
# conflict across sources and are recorded as such rather than
# smoothed.
# =============================================================================
# First populated Lowland-region distillery in the project's data
# set. Tests the Lowland regional designation under the Scotch
# Whisky Regulations 2009 and exercises `condenser: worm_tub` for
# the first time at a populated Diageo site.
# =============================================================================


# --- Identity ---------------------------------------------------------------
id: glenkinchie
name: Glenkinchie
also_known_as:                          # Producer-attributed
  - The Edinburgh Malt                  # marketing positioning per
                                        # malts.com — included as a
                                        # known-alias rather than the
                                        # project's voice [1].
wikidata_qid: null
website: https://www.malts.com/en/glenkinchie


# --- Location ---------------------------------------------------------------
country: Scotland
region: Lowlands                        # Formal SWA region under the
                                        # Scotch Whisky Regulations
                                        # 2009 [3]. First populated
                                        # Lowland distillery in the
                                        # data set.
sub_region: East Lothian
locality: Peaston Bank, near Pencaitland # The distillery sits roughly
                                        # one mile south of Pencaitland
                                        # village, in a glen of the
                                        # Kinchie Burn within East
                                        # Lothian's farmland; about
                                        # 15 miles south-east of
                                        # Edinburgh city centre [1][2].
coordinates:
  lat: 55.912
  lon: -2.838                           # Approximate; the distillery
                                        # site near Peaston Bank south
                                        # of Pencaitland village. Not
                                        # producer-published; approximate
                                        # location derived from the
                                        # village reference in producer
                                        # and trade-press text — should
                                        # be replaced with surveyed
                                        # coordinates when a primary
                                        # geographical source is to
                                        # hand.


# --- Status & Timeline ------------------------------------------------------
status: operating
founded: 1825                           # Informal founding year per
                                        # the producer — established
                                        # by farmers John and George
                                        # Rate as the Milton Distillery
                                        # on the current site or
                                        # nearby [1][2]. Licensed and
                                        # renamed Glenkinchie 1837 (see
                                        # equipment_changes / first
                                        # spirit history below).
first_spirit: 1825
mothballed_periods:
  - from: 1853                          # The Rate brothers were
    to: 1881                            # bankrupted in 1853; the site
                                        # was converted to a sawmill
                                        # and did not produce whisky
                                        # until an Edinburgh syndicate
                                        # restarted operations in
                                        # 1881 [2]. The 28-year gap
                                        # is unusually long among
                                        # currently-operating
                                        # distilleries.
    note: |
      Site converted to a sawmill after the Rate brothers'
      bankruptcy; whisky production resumed when a syndicate
      of Edinburgh-based drinks-trade investors purchased the
      site [2].


# --- Ownership --------------------------------------------------------------
ownership:
  current: Diageo plc
  parent: null                          # Diageo plc is the direct
                                        # owner; the corporate group
                                        # is Diageo itself.
  history:
    - owner: John and George Rate
      from: 1825
      to: 1853
      notes: |
        Founding ownership. Two farmer brothers operating the
        site initially as the Milton Distillery, licensed and
        renamed Glenkinchie 1837. Bankrupted 1853 [2].
    - owner: Edinburgh syndicate
      from: 1881
      to: 1890
      notes: |
        Re-start ownership after the 1853-1881 sawmill period.
        A group of Edinburgh-based wine-and-spirit-trade
        investors purchased the site in 1881; the Glenkinchie
        Distillery Company was formally founded in 1890 [2].
    - owner: Scottish Malt Distillers (SMD)
      from: 1914
      to: 1925
      notes: |
        In 1914 Glenkinchie joined the Lowland-distillery group
        that formed Scottish Malt Distillers (SMD), alongside
        Rosebank, St Magdalene, Grange, and Clydesdale [2].
    - owner: Distillers Company Limited (DCL) / Scottish Malt
        Distillers
      from: 1925
      to: 1986
      notes: |
        SMD merged into DCL in 1925; Glenkinchie operated under
        the DCL portfolio for the next six decades. The DCL
        rationalisation of Lowland distilleries through the
        late 20th century closed several Lowland sites
        (including St Magdalene in 1983, Inverleven in 1991,
        and Rosebank in 1993); Glenkinchie survived as DCL's
        retained Lowland malt-distillery operation [2].
    - owner: United Distillers / UDV / Diageo
      from: 1986
      to: null
      notes: |
        Guinness acquired DCL in 1986, forming United
        Distillers. Guinness merged with Grand Metropolitan in
        1997 to form Diageo; Glenkinchie has been Diageo-owned
        in continuous succession since [2]. In 1988 Glenkinchie
        was selected as the Lowland representative in the
        original Classic Malts of Scotland series alongside
        Cragganmore, Dalwhinnie, Glenkinchie, Lagavulin, Oban,
        and Talisker [2][3]. In 2020 Diageo completed a
        £185 million whisky-tourism investment that included
        the Glenkinchie brand-home redevelopment, positioning
        Glenkinchie as "The Lowland Home of Johnnie Walker"
        (one of the four Diageo brand-home distilleries
        alongside Caol Ila, Clynelish, and Cardhu) [1][4].


# --- Production: Inputs (site-level) ----------------------------------------
water_source: Kinchie Burn              # The Kinchie Burn (which gives
                                        # the distillery its name; the
                                        # burn's name derives from
                                        # "de Quincey", the historical
                                        # local landowner family).
                                        # Water originates in the
                                        # Lammermuir Hills to the south
                                        # and runs through the glen [1].


# --- Production: Equipment (site-level) -------------------------------------
mash_tun:
  type: null                            # Mash-tun type not directly
                                        # disclosed in the producer
                                        # source; trade references
                                        # describe a modernised
                                        # full-lauter installation
                                        # post the 1969 maltings
                                        # conversion but the specific
                                        # current type is hedged.
  material: null
  capacity_kg: null

washbacks:
  count: 6                              # Six wooden washbacks per
                                        # standard trade references —
                                        # 2 Oregon pine + 4 Canadian
                                        # larch (or close variants);
                                        # the count is widely cited
                                        # but specific material
                                        # proportions hedged [3].
  material: larch
  capacity_litres: null
  notes: |
    Six wooden washbacks of mixed Oregon-pine and
    Canadian-larch construction per trade-reference sources
    (commonly cited as 2 Oregon pine + 4 Canadian larch).
    The schema's `material:` field takes a single value;
    `larch` is recorded as the dominant material with the
    mixed construction noted here.

stills:
  wash_still:
    count: 1
    capacity_litres: 30963              # Producer-attributed (Diageo
                                        # via malts.com) claims the
                                        # "largest wash still in the
                                        # industry"; the specific
                                        # 30,963 L figure is reported
                                        # by whisky.com against the
                                        # producer's claim. A separate
                                        # 21,000 L figure widely cited
                                        # in the trade press refers to
                                        # the typical charge rather
                                        # than the still's full
                                        # capacity [1][3].
    charge_litres: 21000                # The standard wash-still
                                        # charge per trade references;
                                        # the still operates at
                                        # roughly two-thirds capacity
                                        # in normal running.
    shape: onion                        # Producer description
                                        # "fat old copper pot stills"
                                        # in onion / pot shape;
                                        # specific shape categorisation
                                        # cross-referenced against
                                        # trade publications [1][3].
    height_m: null
    heating: indirect_steam
    lyne_arm_angle: null
    condenser: worm_tub                 # First populated distillery
                                        # in the project with
                                        # `worm_tub` cooling. The
                                        # producer (Diageo) explicitly
                                        # contrasts the worm tub with
                                        # "a more modern condenser",
                                        # describing the resulting
                                        # spirit as having "greater
                                        # character and depth" [1].
                                        # Trade-press sources also
                                        # include Glenkinchie on
                                        # standard lists of remaining
                                        # worm-tub distilleries [3].
  spirit_still:
    count: 1
    capacity_litres: 20998              # Reported alongside the wash-
                                        # still figure by whisky.com.
                                        # Like the wash still, the
                                        # actual charge in operation
                                        # is less than the published
                                        # capacity.
    charge_litres: null
    shape: onion
    height_m: null
    heating: indirect_steam
    lyne_arm_angle: null
    condenser: worm_tub

warehouses:
  - id: glenkinchie-on-site
    type: dunnage
    location: on_site
    climate_notes: |
      On-site warehousing at the Glenkinchie complex; the
      East Lothian inland-coastal climate (the Firth of
      Forth lies roughly 10 miles north) is cooler and drier
      than the typical Speyside maturation environment.
      Diageo also operates substantial off-site maturation
      capacity at central-belt warehouses; the project
      treats the on-site warehouse as the canonical
      Glenkinchie maturation environment without claiming
      that all Glenkinchie spirit matures there [1].


# --- Capacity ---------------------------------------------------------------
annual_capacity_lpa: null               # Annual capacity figures
                                        # conflict across the
                                        # available trade-reference
                                        # sources: 2.5 million LPA per
                                        # whisky.com / Distilando;
                                        # 1.7 million LPA per the
                                        # Scotch Whisky / Whiskypedia
                                        # listing; 1.6 million LPA
                                        # cited elsewhere. Producer
                                        # (Diageo) does not publish a
                                        # current capacity figure on
                                        # malts.com. Per the project's
                                        # source-conflict policy, the
                                        # specific figure is recorded
                                        # as null rather than smoothed;
                                        # the range 1.6-2.5 million
                                        # LPA captures the conflict.
                                        # See sources [1][3][5].


# --- Equipment & Configuration Changes Over Time ----------------------------
equipment_changes:
  - year: 1837
    change: |
      Site rebuilt as the Glenkinchie distillery after the
      Rate brothers obtained their licence. The earlier
      Milton Distillery on or adjacent to the site operated
      under different naming from 1825.
    notes: |
      The 1825 founding date refers to the informal start
      under the Milton name; the 1837 licensing is the formal
      Glenkinchie distillery's first year [1][2].
    source_id: 2
  - year: 1890
    change: |
      Rebuilt as the redbrick Victorian distillery complex
      that survives today, with worker housing and a bowling
      green on the same site; the Glenkinchie Distillery
      Company was formally constituted in the same period.
    notes: |
      The post-1881 redevelopment under the Edinburgh
      syndicate established the current site footprint [1][2].
    source_id: 2
  - year: 1969
    change: |
      On-site malting floor ceased operation; malt
      thereafter delivered from commercial maltsters. The
      former malting building was converted to a museum of
      malt-whisky production.
    notes: |
      Glenkinchie is one of many DCL distilleries that
      consolidated malting to dedicated commercial maltsters
      in the late 1960s and 1970s rationalisation [2][3].
    source_id: 2


# --- Production Lines Produced at This Site ---------------------------------
production_lines:
