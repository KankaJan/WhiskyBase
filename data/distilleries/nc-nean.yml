# --- Description ------------------------------------------------------------
description: |
  Nc'nean is a small, modern single-malt distillery on the Drimnin estate
  in Morvern, on Scotland's west-Highland coast by the Sound of Mull,
  founded by Annabel Thomas with production from 2017 [1]. It is defined as
  much by its sustainability model as its whisky: it states it was the
  first UK whisky producer to reach net-zero carbon emissions in
  production, is a certified B Corporation (2022), uses 100% organic
  barley, renewable electricity and recycled-glass bottles [1].

  The spirit is unpeated, distilled on a single wash and single spirit
  still at a very small ~100,000 LPA [1]. The flagship Organic Single Malt
  is matured largely in STR (shaved, toasted, re-charred) red-wine casks
  alongside ex-bourbon and a little oloroso, and bottled non-chill-filtered
  at 46% ABV.


