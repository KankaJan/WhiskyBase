# --- Ownership --------------------------------------------------------------
ownership:
  current: The Macallan Distillers Ltd
  parent: Edrington                       # The Macallan Distillers Ltd
                                          # is a wholly-owned subsidiary
                                          # of Edrington [1][2]. Voting
                                          # control of Edrington in turn
                                          # sits with The Robertson
                                          # Trust, a Scottish charitable
                                          # trust [2] — an unusual
                                          # ownership structure (charity-
                                          # controlled global spirits
                                          # group) for the industry.
  history:
    - owner: Alexander Reid and successor licensees
      from: 1824
      to: 1996
      notes: |
        Alexander Reid licensed the distillery in 1824. The
        site passed through a sequence of private and
        family-owned operators in the nineteenth and twentieth
        centuries; the producer's published history identifies
        Roderick Kemp (from 1892) as the figure who consolidated
        the modern Macallan operation and Allan Shiach
        (chairman from 1969) as the figure who established the
        sherry-cask programme of the modern brand [1]. The
        ownership chain in this period is not fully ledgered
        in the surveyed sources and a producer-page migration
        will tighten the dates.
    - owner: Highland Distillers
      from: 1996
      to: 1999
      notes: |
        Highland Distillers acquired Macallan in 1996 [1].
    - owner: Edrington
      from: 1999
      to: null
      notes: |
        Edrington (then trading as The Edrington Group)
        acquired Highland Distillers in 1999, in partnership
        with William Grant & Sons taking a minority interest
        through "the 1887 Company" [1][2]. Macallan has been an
        Edrington brand since. Edrington is voting-controlled
        by The Robertson Trust [2]. In September 2023 Edrington
        acquired Vasyma, a Jerez-based cooperage, extending its
        sherry-cask supply chain — a vertically-integrated move
        consistent with the centrality of sherry casks to the
        Macallan style [2].


