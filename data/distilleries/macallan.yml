# --- Description ------------------------------------------------------------
description: |
  The Macallan is a Speyside single-malt distillery at the Easter
  Elchies estate near Craigellachie, Moray, founded in 1824 by
  Alexander Reid under the Excise Act 1823 [1]. It has been an
  Edrington brand since 1999, when Edrington (in partnership with
  William Grant & Sons taking a minority stake) acquired Highland
  Distillers, which had bought Macallan in 1996 [1][2]. Voting
  control of Edrington sits with The Robertson Trust, a Scottish
  charitable trust — an ownership structure unusual at this scale
  in the Scotch industry.

  Macallan is consistently ranked among the highest-selling
  single-malt Scotch whiskies by volume — typically second or
  third behind Glenfiddich and Glenlivet, with the precise ranking
  depending on market and measure [1]. By value, the brand
  occupies the premium end of the category, with the rare and
  archival releases setting successive world-record auction
  prices for whisky (a 1926 bottle reached £2.1m at auction in
  November 2023 [1]).

  Two production characteristics are central to the brand's
  identity:

  - **Short spirit stills.** Macallan's 24 spirit stills are
    among the smallest in Scotland, at 3,900 L charge volume per
    Wikipedia's published specification [1]. Smaller stills give
    a higher copper-to-spirit contact ratio over a longer
    proportional time, which the producer associates with the
    rich, mid-weight character of the new make. The producer
    uses "curiously small stills" as branded shorthand for this
    detail [1].

  - **Sherry-cask maturation.** Originally Macallan was matured
    exclusively in oloroso-seasoned oak sherry casks shipped
    from Jerez de la Frontera [1]. The 2004 Fine Oak range (from
    2018 renamed Triple Cask Matured) introduced American-oak
    ex-bourbon casks alongside the European-oak and American-oak
    sherry casks, broadening the maturation palette without
    displacing the Sherry Oak core range [1]. In September 2023,
    Edrington acquired Vasyma, a Jerez-based sherry cooperage,
    extending Macallan's sherry-cask supply chain vertically [2].

  Production runs at ~15 million LPA through 36 stills (12 wash +
  24 spirit) at the new still house, opened 2018 and designed by
  Rogers Stirk Harbour + Partners [1]. The £140m capital project
  replaced the preceding still house and tripled capacity while
  preserving the small spirit-still geometry that the producer
  treats as part of the spirit's identity.


