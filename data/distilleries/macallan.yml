# Fifteenth populated distillery. Third populated Speyside entry
# (after Glenfarclas, Glenfiddich). Sherry-led house style: the
# defining feature of the Macallan range is maturation in oloroso-
# seasoned sherry casks (both European and American oak) sourced
# from Jerez, increasingly through Edrington's 2023 acquisition of
# the Vasyma cooperage there.
