# --- Equipment & Configuration Changes Over Time ----------------------------
equipment_changes:
  - year: 1892
    change: |
      Roderick Kemp acquired Macallan and is identified by the
      producer as the figure who consolidated the modern Macallan
      operation; Wikipedia summarises this period as when "the
      distillery was able to buy its first large copper pot still,
      which allowed it to increase production" [1].
    source_id: 1
  - year: 2018
    change: |
      The new Macallan still house and visitor experience opened
      at Easter Elchies, designed by Rogers Stirk Harbour +
      Partners (the architectural practice founded by Richard
      Rogers) — a £140m capital project that replaced the
      preceding still house and trebled production capacity to
      approximately 15 million LPA. The new still house holds 36
      stills in three pods (12 wash + 24 spirit), preserving the
      small spirit-still geometry of the earlier site [1].
    notes: |
      The new still house was shortlisted for the 2019 RIBA
      Stirling Prize and won the 2019 RIAS Andrew Doolan Best
      Building in Scotland Award [1].
    source_id: 1


