# --- Description ------------------------------------------------------------
description: |
  Highland Park is a malt whisky distillery in Kirkwall on Mainland
  Orkney, founded in 1798 and owned by The Edrington Group since
  Edrington's 1999 acquisition of Highland Distillers Co. [1][2].
  Geographically the most northerly Scotch malt distillery in
  Scotland, Highland Park sits within the formal Highland region
  under the Scotch Whisky Regulations 2009 but is commonly marketed
  in the trade press as an "Islands" producer; see
  educational/swa-regional-designations for the formal-vs-informal
  regional designation question. The site retains partial on-site
  floor malting (commonly cited at around 20% of its grain
  requirement) using local Orkney peat from Hobbister Moor, which
  is heather-dominated rather than the moss-dominated peat of
  mainland Scotland or Islay — a compositional difference that
  producer literature attributes a distinctive aroma signature to
  but which is not separately quantified against primary phenol
  analysis in the project's current sources. Coastal dunnage
  warehousing on the Orkney site exposes maturing casks to North
  Atlantic salt air; the producer cites this as contributing to
  the spirit's profile.


