# --- Description ------------------------------------------------------------
description: |
  Ardnamurchan is a modern single-malt distillery at Glenbeg on the remote
  Ardnamurchan peninsula in the west Highlands, with production from 2014
  [1]. It was built and is owned by Adelphi, a long-established independent
  bottling company — an independent bottler creating its own distillery.

  Two features set it apart in this data set. First, it runs both peated
  and unpeated production, and its core single malt is bottled from a
  roughly 50:50 vatting of the two styles. Second, it publishes the full
  cask composition of every release through its "AD" batch codes — an
  unusually radical transparency about exactly what is in the bottle. The
  distillery is powered by renewable energy (hydroelectricity and a biomass
  boiler fed with local timber) [1]. Production is on a single wash and
  single spirit still at ~500,000 LPA [1].


