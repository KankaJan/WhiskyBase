# Eighteenth populated distillery and the project's FIRST GRAIN distillery.
# This is a deliberate model-expansion: grain whisky is made by continuous
# (column / Coffey) distillation from a wheat-led cereal bill, not by batch
# pot-still distillation of malted barley. The malt-centric schema does not
# yet structure column stills or the cereal bill; those are captured in
# prose here and recorded as SCHEMA-OBSERVATIONS in cameronbridge.NOTES.md
# for structuring when a second grain distillery lands. The one schema
# change made now is the additive `distillation.regime: continuous` enum
# value (CHANGELOG [0.8.6]).
# =============================================================================


