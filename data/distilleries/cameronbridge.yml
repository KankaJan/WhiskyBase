# --- Description ------------------------------------------------------------
description: |
  Cameronbridge is a grain-whisky distillery at Cameron Bridge in Fife,
  founded in 1824 by John Haig [1]. It is the project's first grain
  distillery: rather than batch pot-still distillation of malted barley,
  it makes whisky by continuous (column / Coffey) distillation from a
  wheat-led cereal bill, with a smaller proportion of malted barley
  providing the enzymes for starch conversion. The spirit comes off the
  stills at a high strength, close to the 94.8% ABV ceiling above which a
  Scotch spirit may no longer be called whisky — far lighter and more
  neutral than malt new make.

  Cameronbridge was an early adopter of the technology that made grain
  whisky possible, running Robert Stein's patent still from around 1830
  and later Aeneas Coffey's improved column still [1]. It moved to
  grain-only production in 1929 and, since the closure of Port Dundas in
  2010, is Diageo's last wholly-owned operational grain distillery [1].
  At roughly 136 million litres a year it is one of the largest
  distilleries in Europe [1].

  Most of the output is grain whisky for blends — Johnnie Walker, Bell's,
  J&B and others — and the site also produces neutral spirit for Diageo's
  white-spirit brands (Gordon's, Tanqueray, Smirnoff) [1]. Two single-grain
  bottlings carry the distillery's own name to market: the long-standing
  Cameron Brig and, since 2014, the premium Haig Club range.


