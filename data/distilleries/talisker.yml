# entry, and the third populated Diageo Classic Malt (after Lagavulin and
# Glenkinchie). Distinctive equipment: five stills (two wash, three
# spirit) with U-shaped lye-pipe purifier loops and worm-tub condensers —
# a combination that, with the medium peating, gives the peppery, smoky,
# maritime house style. Resolves the forward reference from
# equipment/worm-tub.
