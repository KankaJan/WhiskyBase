# --- Description ------------------------------------------------------------
description: |
  Talisker is a single-malt distillery at Carbost on the Isle of Skye,
  founded in 1830 by the brothers Hugh and Kenneth MacAskill [1]. It is
  the oldest distillery on Skye and, for most of its history, the only one
  (Torabhaig opened on the island in 2017). Talisker is one of Diageo's
  six Classic Malts and has been in the Distillers Company / United
  Distillers / Diageo corporate lineage since 1925 [1].

  The spirit is medium-peated — a malt phenol specification of roughly
  18-22 ppm [1] — giving a smoky character without the heavy phenolic
  weight of the south-Islay distilleries. The house style is usually
  described as peppery, smoky and maritime.

  Two pieces of equipment shape that character. First, the still set is
  asymmetric: two wash stills and three spirit stills, an unusual 2:3
  ratio. The wash-still lye pipes run in a pronounced U-shape — a purifier
  loop that condenses heavier vapour and returns it to the still for
  re-distillation, raising reflux. Second, all five stills condense
  through worm tubs rather than modern shell-and-tube condensers [1] (see
  equipment/worm-tub). Worm tubs give less copper contact and a heavier,
  more sulphury spirit; the purifier loops pull in the opposite direction.
  The combination is the distillery's signature.

  Production runs at about 3.5 million LPA [1]. The current stills are
  rebuilds: a 1960 stillhouse fire destroyed the originals, which were
  reconstructed to the same design to preserve the spirit character [1].
  Talisker malt also goes into Diageo blends, Johnnie Walker among them.


