# --- Ownership --------------------------------------------------------------
ownership:
  current: Diageo plc
  parent: null                        # Diageo plc is the direct owner;
                                      # the corporate group is Diageo
                                      # itself.
  history:
    - owner: Hector Henderson
      from: 1846
      to: 1854
      notes: |
        Founding ownership. The distillery passed through
        several 19th-century owners before consolidation [1].
    - owner: Bulloch Lade & Co.
      from: 1863
      to: 1920
      notes: |
        Bulloch Lade & Co. operated Caol Ila through much of
        the late 19th century, expanding the site
        substantially.
    - owner: Distillers Company Limited (DCL) / Scottish Malt
        Distillers
      from: 1927
      to: 1986
      notes: |
        Acquired into the DCL portfolio in 1927. DCL underwent
        the 1972-1974 Caol Ila reconstruction (the original
        site demolished and rebuilt with the current
        equipment-house configuration). DCL itself was
        consolidated into United Distillers in 1986.
    - owner: United Distillers / UDV / Diageo
      from: 1986
      to: null
      notes: |
        The DCL → United Distillers → UDV → Diageo lineage
        encompassing the 1986 consolidation and the 1997
        creation of Diageo through the Guinness-GrandMet
        merger. Caol Ila has been Diageo-owned in continuous
        succession since.


