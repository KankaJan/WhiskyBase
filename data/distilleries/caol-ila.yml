      Coastal Islay warehousing on the Sound of Islay; the
      maturation environment is shared with Bunnahabhain
      (geographically adjacent on the north-east Islay
      coast). Diageo also operates significant off-site
      maturation capacity at the mainland Speyside / Central
      Belt warehouses; the Caol Ila spirit destined for the
      blend trade is often shipped off-island for maturation,
      while the spirit destined for single-malt releases is
      more commonly matured on-site [2].


