# --- Description ------------------------------------------------------------
description: |
  Caol Ila is a malt whisky distillery on the east coast of Islay
  at Port Askaig, founded in 1846 by Hector Henderson and owned
  by Diageo plc since the 1997 Guinness-GrandMet merger that
  created Diageo (the site's Diageo-lineage ownership trails back
  to the 1927 DCL acquisition) [1][2]. The site sits within the
  formal Islay protected locality under the Scotch Whisky
  Regulations 2009. Caol Ila is the largest Islay distillery by
  capacity (the post-1974 reconstruction substantially expanded
  output), with the majority of production historically supplying
  the blend trade — particularly the peated Islay component of
  the Johnnie Walker family of blended Scotches. The single-malt
  release programme expanded materially with Diageo's 2002
  "Hidden Malts" launch, which introduced Caol Ila alongside
  Clynelish and Glen Elgin as previously blend-only Diageo
  malts; the Caol Ila 12 Year Old has been the flagship core
  release since. The spirit is heavily peated (~30-35 ppm spec)
  but is generally characterised as cleaner and less briny than
  the south-coast Islay producers (Lagavulin, Laphroaig, Ardbeg),
  attributed to the distillery's tall lantern-shape stills and
  the east-coast site exposure.


