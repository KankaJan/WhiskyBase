# --- Equipment & Configuration Changes Over Time ----------------------------
equipment_changes:
  - year: 1972
    change: |
      Major reconstruction: original site demolished and
      rebuilt with new still house, washback, and warehouse
      configuration. The current 6-still (3 wash + 3 spirit)
      configuration dates from this reconstruction. The
      project's equipment-level entries for Caol Ila reflect
      the post-1974 site rather than the pre-1972 incarnation.
    notes: |
      The reconstruction substantially increased site
      capacity; Caol Ila moved from medium-scale operation
      to one of Islay's largest single-malt operations
      during this period [2].
    source_id: 2


