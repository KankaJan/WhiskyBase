# --- Description ------------------------------------------------------------
description: |
  Ardbeg is a heavily-peated malt-whisky distillery on the south
  coast of Islay, the easternmost of the "Kildalton" trio of
  south-coast producers alongside Lagavulin and Laphroaig [1][2].
  It was founded commercially in 1815 by John McDougall, with
  illicit distilling reported on the site from roughly 1794;
  ownership passed to the Glasgow whisky merchant Thomas Buchanan
  in 1838 while the McDougall family continued to run it [2].
  Ardbeg has one of the most turbulent histories in the modern
  industry: under Hiram Walker ownership, production was halted
  in 1981, ran only intermittently from 1989, and had effectively
  ceased by late 1996. The distillery was bought and reopened by
  Glenmorangie plc in 1997 — the founding event of the modern
  Ardbeg — and passed to LVMH (Moet Hennessy) with the rest of
  Glenmorangie plc in December 2004 [1][2].
  Ardbeg's malt is heavily peated, specified at about 50 ppm
  phenols with the malt as delivered reported to average closer
  to 55 ppm [3]; the peated malt is bought in rather than floor-
  malted on site. Fermentation is long — about 66-71 hours as
  standard in twelve wooden washbacks — which builds fruit-ester
  congeners that survive the heavy peat.
  The distinctive equipment feature is a **purifier** on the
  spirit-still lyne arm: a small condenser that intercepts the
  heavier vapour components and returns them to the pot for
  re-distillation, sharply raising reflux. A purifier is uncommon
  among Islay distilleries, and is the principal equipment-level
  reason Ardbeg pairs intense peat smoke with a comparatively
  clean, citrus-tinged new make [2][3].
  A new still house completed in 2019 doubled the still count
  from a single wash + spirit pair to two pairs, built to double
  distilling capacity in response to demand [4]; the project
  records the post-expansion still configuration but leaves the
  annual-capacity figure null pending a producer-published
  post-expansion value (see ardbeg.NOTES.md). Water is drawn
  from Loch Uigeadail, a hill loch about three miles behind the
  distillery whose peat-filtered water lends its name to the
  Uigeadail bottling.


