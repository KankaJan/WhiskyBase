# =============================================================================
# Fourteenth populated distillery. Fourth populated south-Islay
# heavily-peated entry, completing the "Kildalton" peated cluster
# alongside Laphroaig, Lagavulin and (east-Islay) Caol Ila. Notable
# for a purifier on the spirit-still lyne arm — uncommon on Islay —
# and for one of the most turbulent closure/revival histories in the
# modern industry: mothballed 1981, intermittent through the early
# 1990s, and rescued by Glenmorangie plc in 1997.
# =============================================================================


