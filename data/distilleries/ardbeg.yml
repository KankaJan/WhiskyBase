    source_id: 1
  - year: 2019
    change: |
      New still house completed, doubling the still count from a
      single wash + spirit pair to two pairs (2 wash + 2 spirit).
      The former still-house space was repurposed for additional
      washbacks.
    notes: |
      The Glenmorangie Company funded the expansion explicitly to
      double Ardbeg's distilling capacity in response to demand [4].
