# --- Status & Timeline ------------------------------------------------------
status: operating
founded: 1815                           # Commercial founding under John
                                        # McDougall. Illicit distilling
                                        # is reported on the site from
                                        # roughly 1794; 1815 is the
                                        # licensed-commercial date [1][2].
first_spirit: 1815
mothballed_periods:
  - from: 1981
    to: 1997
    notes: |
      Production was halted in 1981 under Hiram Walker ownership
      amid the early-1980s industry contraction. Limited
      production resumed on a small scale in 1989 and continued
      intermittently at a low level until late 1996; the
      distillery was then effectively idle until the June 1997
      revival under Glenmorangie plc [2]. Recorded as a single
      mothballed span with the intermittent 1989-1996 runs
      noted rather than split into micro-periods.


# --- Ownership --------------------------------------------------------------
ownership:
  current: Moet Hennessy
  parent: LVMH Moet Hennessy Louis Vuitton SE
  history:
    - owner: John McDougall / McDougall family
      from: 1815
      to: 1838
      notes: |
        Commercial founding by John McDougall. The McDougall
        family continued to run the distillery after the 1838
        sale of the business [1][2].
    - owner: Thomas Buchanan
      from: 1838
      to: 1853
      notes: |
        Glasgow whisky merchant Thomas Buchanan bought the
        business in 1838; the distillery continued to be run by
        John McDougall's son Alexander until Alexander's death
        in 1853, after which his sisters Margaret and Flora were
        involved in the operation [2].
    - owner: McDougall family / Ardbeg Distillery Ltd
      from: 1853
      to: 1979
      notes: |
        The McDougall family and the successor company Ardbeg
        Distillery Ltd ran the distillery through the later 19th
        and most of the 20th century. Hiram Walker (Canadian)
        acquired an interest in the company during the 20th
        century and took full control in 1979; the surveyed
        sources do not give a precise date for the earlier
        Hiram Walker stake [2].
    - owner: Hiram Walker / Allied
      from: 1979
      to: 1997
      notes: |
        Hiram Walker took full control in 1979. Production was
        halted in 1981 (see mothballed_periods); the site passed
        within the Hiram Walker / Allied Lyons / Allied
        Distillers ownership chain through the mothballed years [2].
    - owner: Glenmorangie plc
      from: 1997
      to: 2004
      notes: |
        Glenmorangie plc bought and reopened Ardbeg in 1997 —
        limited production resumed 25 June 1997 and full
        production in 1998. The 1997 rescue is the founding event
        of the modern Ardbeg [1][2].
    - owner: Moet Hennessy (LVMH)
      from: 2004
      to: null
      notes: |
        LVMH (Moet Hennessy) acquired Glenmorangie plc — and with
        it Ardbeg — on 28 December 2004. Ardbeg is operated within
        The Glenmorangie Company [1][2].


