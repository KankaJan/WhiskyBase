                                        # Scotch Whisky Regulations
                                        # 2009 [5]. South-coast Islay —
                                        # the heavily-peated "Kildalton"
                                        # cluster (Laphroaig, Lagavulin,
                                        # Ardbeg).
sub_region: null
locality: Port Ellen, Isle of Islay     # South coast of Islay, roughly
                                        # one mile east of Lagavulin and
                                        # the easternmost of the
                                        # Kildalton trio; the three
                                        # share a peat-and-sea-spray
                                        # maturation environment [1][2].
