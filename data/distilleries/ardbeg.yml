  type: null                            # Mash-tun type not cleanly
                                        # pinned in the surveyed
                                        # sources.
  material: stainless_steel
  capacity_kg: null

washbacks:
  count: 12
  material: larch                       # Wooden washbacks of Oregon
                                        # pine per trade sources; the
                                        # schema's material enum uses
                                        # `larch` as the wood value —
                                        # recorded as wood, with the
                                        # Oregon-pine specific noted
                                        # here.
  capacity_litres: 23000                # ~23,000-23,500 L per washback
                                        # per trade-database sources [3].
  notes: |
    Twelve wooden (Oregon pine) washbacks at roughly
    23,000-23,500 L. Fermentation runs about 66-71 hours as
    standard, with longer cycles also used; the long-fermentation
    regime contributes secondary fruit-ester congeners [3].

stills:
  wash_still:
    count: 2                            # Post-2019 configuration: a
                                        # 2-wash + 2-spirit arrangement.
                                        # See equipment_changes — the
                                        # 2019 still house doubled the
                                        # still count from a single pair
                                        # to two pairs [3][4].
    capacity_litres: 18000              # ~18,000 L wash stills [3].
    charge_litres: null
    shape: null
    height_m: null
    heating: indirect_steam
    lyne_arm_angle: ascending           # Ascending lyne arms promoting
                                        # high reflux [3].
    condenser: shell_and_tube
  spirit_still:
    count: 2
    capacity_litres: 17000              # ~17,000 L spirit stills [3].
    charge_litres: null
    shape: null
    height_m: null
    heating: indirect_steam
    lyne_arm_angle: ascending
    condenser: shell_and_tube
    notes: |
      The spirit still carries a **purifier** on the lyne arm —
      a small condenser that captures heavier vapour components
      and returns them to the pot for re-distillation, sharply
      increasing reflux. A purifier is uncommon among Islay
      distilleries, and is the principal equipment-level
      contributor to Ardbeg's combination of intense peat with a
      comparatively clean, citrus-tinged spirit [2][3]. See
      `glossary/reflux`.


