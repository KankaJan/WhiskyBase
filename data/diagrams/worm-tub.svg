<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 510"
     role="img" aria-labelledby="worm-tub-title worm-tub-desc"
     class="wb-diagram">
  <!-- WhiskyBase diagram: worm tub (technical schematic).
       The worm is a tapered copper coil descending through a tub of
       water. Cooling water flows counter-current: cold water enters
       low and warm water overflows high, while vapour enters the
       worm hot at the top and the condensed spirit runs off at the
       bottom. A small upward arrow inside the water column makes
       the counter-current direction explicit.
       Style spec: docs/diagram-style.md. Labels sit outside the
       figure.
       Grounded on equipment/worm-tub.yml body description and
       Russell ed. 2022 Ch 14 (Nicol). -->
  <title id="worm-tub-title">Worm tub</title>
  <desc id="worm-tub-desc">Cross-section of a worm tub: a tapered
    copper coil — the worm — descends inside a tub of cooling water.
    Spirit vapour from the lyne arm enters the top of the worm and
    condenses as it descends; cold cooling water enters the tub at
    the bottom and warm water overflows at the top, so the water
    flows counter to the vapour direction. The condensed spirit runs
    off below the tub to the spirit safe.</desc>

  <!-- Figure line-work -->
  <g fill="none" stroke="currentColor" stroke-width="2.5"
     stroke-linejoin="round" stroke-linecap="round">

    <!-- Water tub -->
    <ellipse cx="360" cy="140" rx="150" ry="12"/>
    <path d="M210 140 L210 400"/>
    <path d="M510 140 L510 400"/>
    <path d="M210 400 C210 422, 510 422, 510 400"/>

    <!-- Water surface, just below the tub rim -->
    <path d="M218 158 C282 166, 438 166, 502 158"/>

    <!-- The worm: stacked tapered ellipses with alternating
         step-down connectors (a descending coil seen edge-on) -->
    <g stroke-width="2.2">
      <ellipse cx="360" cy="178" rx="130" ry="6"/>
      <ellipse cx="360" cy="210" rx="122" ry="6"/>
      <ellipse cx="360" cy="242" rx="112" ry="6"/>
      <ellipse cx="360" cy="274" rx="102" ry="6"/>
      <ellipse cx="360" cy="306" rx="92" ry="6"/>
      <ellipse cx="360" cy="338" rx="82" ry="6"/>
      <path d="M490 178 L482 210"/>
      <path d="M238 210 L248 242"/>
      <path d="M472 242 L462 274"/>
      <path d="M258 274 L268 306"/>
      <path d="M452 306 L442 338"/>
    </g>

    <!-- Vapour inlet pipe -->
    <path d="M150 86 L228 174"/>
    <path d="M218 170 L230 178 L218 184"/>

    <!-- Spirit outflow -->
    <path d="M442 338 L442 412 L562 412"/>
    <path d="M554 404 L564 413 L554 421"/>

    <!-- Cooling-water inlet (low) -->
    <path d="M148 376 L208 372"/>
    <path d="M198 366 L210 372 L198 380"/>

    <!-- Warm-water overflow (high) -->
    <path d="M510 152 L588 138"/>
    <path d="M576 132 L590 137 L578 145"/>

    <!-- Internal upward arrow: counter-current water flow -->
    <g stroke-width="1.8">
      <path d="M222 322 L222 256"/>
      <path d="M216 264 L222 254 L228 264"/>
    </g>
  </g>

  <!-- Leader lines -->
  <g fill="none" stroke="var(--muted-color)" stroke-width="1.4"
     stroke-linecap="round">
    <path d="M148 64 C150 72, 152 80, 154 88"/>
    <path d="M602 96 C594 108, 588 122, 584 134"/>
    <path d="M600 260 C558 252, 510 248, 478 244"/>
    <path d="M152 290 C168 290, 188 290, 218 290"/>
    <path d="M148 408 C158 400, 168 390, 178 376"/>
    <path d="M540 444 C544 432, 548 422, 552 414"/>
  </g>

  <!-- Labels (crisp, outside the figure) -->
  <g fill="var(--muted-color)" font-size="14" stroke="none">
    <text x="144" y="60" text-anchor="end">Vapour from the lyne arm</text>
    <text x="608" y="92">Warm water out</text>
    <text x="608" y="264">Tapered copper worm</text>
    <text x="148" y="294" text-anchor="end">Cooling-water flow</text>
    <text x="144" y="412" text-anchor="end">Cold water in</text>
    <text x="476" y="450">Spirit, to the spirit safe</text>
  </g>
</svg>
