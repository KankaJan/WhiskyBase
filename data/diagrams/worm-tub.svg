<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 530"
     role="img" aria-labelledby="worm-tub-title worm-tub-desc"
     class="wb-diagram">
  <!-- Blueprint cross-section of a worm tub. Double-walled outline
       with section hatching; the worm shown as a stack of tapered
       ellipses descending through the tub; dashed annotation leaders.
       Counter-current cooling: cold water nozzle low on the left,
       warm water nozzle high on the right. Stroke color: currentColor. -->
  <title id="worm-tub-title">Worm tub</title>
  <desc id="worm-tub-desc">Blueprint-style cross-section of a worm
    tub: a tapered copper coil (the worm) descends inside a tub of
    cooling water. Spirit vapour enters the top of the worm and
    condenses as it descends. Cold cooling water enters low on one
    side and warm water overflows high on the opposite side, so the
    water flows counter to the vapour direction. Condensed spirit
    runs off below the tub to the spirit safe.</desc>

  <defs>
    <pattern id="cut-hatch-worm-tub" patternUnits="userSpaceOnUse"
             width="5" height="5" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="5"
            stroke="currentColor" stroke-width="0.5"/>
    </pattern>
  </defs>

  <!-- Wall material -->
  <path d="M206 140 L514 140 L514 400 C514 428, 206 428, 206 400 Z
           M210 144 L510 144 L510 400 C510 422, 210 422, 210 400 Z"
        fill="url(#cut-hatch-worm-tub)" fill-rule="evenodd"
        stroke="none"/>

  <!-- Wall outlines (open tub: no top closure) -->
  <g fill="none" stroke="currentColor" stroke-width="1.4"
     stroke-linejoin="round" stroke-linecap="butt">
    <path d="M206 140 L206 400 C206 428, 514 428, 514 400 L514 140"/>
    <path d="M210 144 L210 400 C210 422, 510 422, 510 400 L510 144"/>
    <!-- top rim -->
    <ellipse cx="360" cy="140" rx="154" ry="10"/>
  </g>

  <!-- Internal structural elements -->
  <g fill="none" stroke="currentColor" stroke-width="1.2"
     stroke-linejoin="round" stroke-linecap="butt">

    <!-- Water surface -->
    <path d="M218 160 C282 168, 438 168, 502 160"/>

    <!-- Worm: stack of tapered ellipses with step-down connectors -->
    <g stroke-width="1.0">
      <ellipse cx="360" cy="180" rx="130" ry="6"/>
      <ellipse cx="360" cy="212" rx="122" ry="6"/>
      <ellipse cx="360" cy="244" rx="112" ry="6"/>
      <ellipse cx="360" cy="276" rx="102" ry="6"/>
      <ellipse cx="360" cy="308" rx="92" ry="6"/>
      <ellipse cx="360" cy="340" rx="82" ry="6"/>
      <path d="M490 180 L482 212"/>
      <path d="M238 212 L248 244"/>
      <path d="M472 244 L462 276"/>
      <path d="M258 276 L268 308"/>
      <path d="M452 308 L442 340"/>
    </g>

    <!-- Vapour inlet nozzle on the top rim (where the lyne arm
         couples in) -->
    <path d="M218 158 L218 110 L242 110 L242 162"/>

    <!-- Cold-water inlet nozzle low on the left wall -->
    <path d="M206 376 L168 376 L168 396 L206 396"/>

    <!-- Warm-water overflow nozzle high on the right wall -->
    <path d="M514 152 L552 152 L552 172 L514 172"/>

    <!-- Spirit outflow nozzle below the bottom (where the worm
         leaves the tub) -->
    <path d="M442 414 L442 458 L568 458"/>
  </g>

  <!-- Annotation leaders -->
  <g fill="none" stroke="currentColor" stroke-width="1.0"
     stroke-linecap="butt" stroke-dasharray="5 3">
    <!-- vapour from lyne arm -->
    <path d="M150 64 L230 110"/>
    <!-- warm water out -->
    <path d="M602 96 L552 162"/>
    <!-- tapered copper worm -->
    <path d="M598 260 L466 252"/>
    <!-- cold water in -->
    <path d="M150 412 L168 386"/>
    <!-- spirit, to the spirit safe -->
    <path d="M478 488 L568 458"/>
  </g>

  <!-- Dots at endpoints -->
  <g fill="currentColor" stroke="none">
    <circle cx="466" cy="252" r="2.4"/>
    <circle cx="230" cy="110" r="2.6"/>
    <circle cx="552" cy="162" r="2.6"/>
    <circle cx="168" cy="386" r="2.6"/>
    <circle cx="568" cy="458" r="2.6"/>
  </g>

  <!-- Labels -->
  <g fill="currentColor" font-size="14" stroke="none">
    <text x="144" y="60" text-anchor="end">Vapour from the lyne arm</text>
    <text x="608" y="92">Warm water out</text>
    <text x="606" y="264">Tapered copper worm</text>
    <text x="144" y="416" text-anchor="end">Cold water in</text>
    <text x="476" y="500">Spirit, to the spirit safe</text>
  </g>
</svg>
