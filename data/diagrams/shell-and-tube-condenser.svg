<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 450"
     role="img" aria-labelledby="sandt-title sandt-desc"
     class="wb-diagram">
  <!-- WhiskyBase diagram: shell-and-tube condenser (hand-drawn schematic).
       Style spec: docs/diagram-style.md. Labels outside the figure;
       leaders never cross a drawn line.
       Grounded on equipment/shell-and-tube-condenser.yml body. -->
  <title id="sandt-title">Shell-and-tube condenser</title>
  <desc id="sandt-desc">Schematic of a shell-and-tube condenser: a
    cylindrical shell enclosing a bundle of copper tubes. Spirit
    vapour passes down the tubes and condenses; cooling water
    flows through the shell around them.</desc>

  <defs>
    <filter id="sketch-sandt" x="-15%" y="-15%" width="130%" height="130%">
      <feTurbulence type="fractalNoise" baseFrequency="0.015"
                    numOctaves="2" seed="13" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="6"/>
    </filter>
  </defs>

  <g fill="none" stroke="currentColor" stroke-width="2.5"
     stroke-linejoin="round" stroke-linecap="round"
     filter="url(#sketch-sandt)">
    <!-- shell -->
    <ellipse cx="330" cy="112" rx="80" ry="18"/>
    <path d="M250 112 L250 360"/>
    <path d="M410 112 L410 360"/>
    <path d="M250 360 C250 382 410 382 410 360"/>
    <!-- copper tube bundle -->
    <g stroke-width="2">
      <path d="M278 122 L278 356"/>
      <path d="M300 124 L300 358"/>
      <path d="M322 124 L322 358"/>
      <path d="M344 124 L344 358"/>
      <path d="M366 122 L366 356"/>
    </g>
    <!-- spirit vapour inlet -->
    <path d="M186 76 L312 102"/>
    <path d="M302 93 L314 103 L300 106"/>
    <!-- cooling water out (upper) -->
    <path d="M250 152 L182 138"/>
    <path d="M194 132 L180 137 L192 146"/>
    <!-- cooling water in (lower) -->
    <path d="M182 318 L250 332"/>
    <path d="M238 326 L252 333 L240 340"/>
    <!-- spirit outflow -->
    <path d="M330 372 C330 392 330 404 342 410 L420 410"/>
    <path d="M412 402 L422 411 L412 419"/>
  </g>

  <g fill="none" stroke="var(--muted-color)" stroke-width="1.4"
     stroke-linecap="round" filter="url(#sketch-sandt)">
    <path d="M186 56 C200 64 214 72 230 84"/>
    <path d="M566 226 C490 222 440 214 392 206"/>
    <path d="M150 104 C160 110 168 116 176 124"/>
    <path d="M150 360 C160 352 168 344 176 334"/>
    <path d="M540 432 C512 424 480 416 452 410"/>
  </g>

  <g fill="var(--muted-color)" font-size="14" stroke="none">
    <text x="182" y="52" text-anchor="end">Spirit vapour from the still</text>
    <text x="572" y="230">Copper tube bundle</text>
    <text x="146" y="100" text-anchor="end">Cooling water out</text>
    <text x="146" y="372" text-anchor="end">Cooling water in</text>
    <text x="458" y="436">Spirit, to the spirit safe</text>
  </g>
</svg>
