<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 600"
     role="img" aria-labelledby="washback-title washback-desc"
     class="wb-diagram">
  <!-- Blueprint cross-section of a washback. Double-walled outline
       with diagonal section hatching; solid structural lines for
       the switcher and hoops; dashed annotation leaders with dots.
       Stroke color: currentColor throughout. -->
  <title id="washback-title">Washback</title>
  <desc id="washback-desc">Blueprint-style cross-section of a tall
    upright wooden washback. A drive motor on the lid turns a
    vertical switcher shaft; a horizontal switcher arm sweeps the
    top of the wash to knock down fermenting froth. Three iron
    hoops bind the vessel. Cooled wort and yeast enter through a
    short pipe nozzle on the dome; the fermented wash runs off
    through a nozzle on the right wall to the wash still.</desc>

  <defs>
    <pattern id="cut-hatch-washback" patternUnits="userSpaceOnUse"
             width="5" height="5" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="5"
            stroke="currentColor" stroke-width="0.5"/>
    </pattern>
  </defs>

  <!-- Wall material -->
  <path d="M266 130 C322 106, 418 106, 474 130 L462 480
           C462 506, 278 506, 278 480 Z
           M270 130 C322 116, 418 116, 470 130 L458 480
           C458 502, 282 502, 282 480 Z"
        fill="url(#cut-hatch-washback)" fill-rule="evenodd"
        stroke="none"/>

  <!-- Wall outlines -->
  <g fill="none" stroke="currentColor" stroke-width="1.4"
     stroke-linejoin="round" stroke-linecap="butt">
    <path d="M266 130 C322 106, 418 106, 474 130 L462 480
             C462 506, 278 506, 278 480 Z"/>
    <path d="M270 130 C322 116, 418 116, 470 130 L458 480
             C458 502, 282 502, 282 480 Z"/>
  </g>

  <!-- Internal structural elements -->
  <g fill="none" stroke="currentColor" stroke-width="1.2"
     stroke-linejoin="round" stroke-linecap="butt">

    <!-- Switcher drive motor -->
    <rect x="350" y="74" width="40" height="42"/>
    <g stroke-width="0.8">
      <circle cx="370" cy="96" r="6"/>
      <path d="M370 87 L370 90"/>
      <path d="M370 102 L370 105"/>
      <path d="M361 96 L364 96"/>
      <path d="M376 96 L379 96"/>
    </g>

    <!-- Switcher shaft + arm -->
    <path d="M370 116 L370 230"/>
    <path d="M295 230 L445 230"/>

    <!-- Liquid (wash) surface -->
    <path d="M276 248 C336 256, 404 256, 464 248"/>

    <!-- Fermenting froth peaks -->
    <g stroke-width="1.0">
      <path d="M278 246 Q294 232 310 246 Q326 232 342 246
               Q358 232 374 246 Q390 232 406 246 Q422 232 438 246
               Q452 240 460 244"/>
    </g>

    <!-- Iron hoops (three bands spanning the front of the vessel) -->
    <path d="M268 192 C322 204, 418 204, 472 192"/>
    <path d="M272 320 C324 332, 416 332, 468 320"/>
    <path d="M278 432 C326 444, 414 444, 462 432"/>

    <!-- Cooled wort + yeast inlet nozzle on the dome (off-set
         to the right of the switcher motor) -->
    <path d="M410 110 L410 70 L434 70 L434 110"/>

    <!-- Wash outlet nozzle on the right wall, near the base -->
    <path d="M463 448 L503 448 L503 468 L463 468"/>
  </g>

  <!-- Annotation leaders -->
  <g fill="none" stroke="currentColor" stroke-width="1.0"
     stroke-linecap="butt" stroke-dasharray="5 3">
    <path d="M174 232 L284 232"/>
    <path d="M174 340 L286 340"/>
    <path d="M426 100 L394 100"/>
    <path d="M610 234 L450 230"/>
    <path d="M608 324 L470 324"/>
    <!-- Inlet leader -->
    <path d="M178 60 L422 70"/>
    <!-- Outlet leader -->
    <path d="M474 568 L503 470"/>
  </g>

  <!-- Dots at endpoints -->
  <g fill="currentColor" stroke="none">
    <circle cx="284" cy="232" r="2.4"/>
    <circle cx="286" cy="340" r="2.4"/>
    <circle cx="394" cy="100" r="2.4"/>
    <circle cx="450" cy="230" r="2.4"/>
    <circle cx="470" cy="324" r="2.4"/>
    <circle cx="422" cy="70" r="2.6"/>
    <circle cx="503" cy="470" r="2.6"/>
  </g>

  <!-- Labels -->
  <g fill="currentColor" font-size="14" stroke="none">
    <text x="174" y="56" text-anchor="end">Cooled wort and yeast</text>
    <text x="170" y="236" text-anchor="end">Fermenting froth</text>
    <text x="170" y="344" text-anchor="end">Wooden staves</text>
    <text x="430" y="100">Switcher drive motor</text>
    <text x="618" y="236">Switcher arm</text>
    <text x="616" y="322">Iron hoops</text>
    <text x="478" y="584">Wash, to the wash still</text>
  </g>
</svg>
