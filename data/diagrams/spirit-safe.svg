<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 530"
     role="img" aria-labelledby="safe-title safe-desc"
     class="wb-diagram">
  <!-- Blueprint cross-section of a spirit safe. Double-walled
       brass case with section hatching; brass mullions divide the
       front; three test cups visible inside, each with a floating
       hydrometer; brass stand below the case; dashed annotation
       leaders. Stroke color: currentColor. -->
  <title id="safe-title">Spirit safe</title>
  <desc id="safe-desc">Blueprint-style cross-section of a spirit
    safe: a glass-fronted brass case mounted on a brass stand.
    Three glass panels divided by brass mullions front the case;
    two brass taps on top admit test water. Inside, three test cups
    each carry a spirit hydrometer floating in distillate.
    Distillate enters from the condenser via a pipe nozzle at the
    top; a swivelling spout below the case directs the run between
    two floor-level receivers, one for foreshots and feints, one
    for the potable spirit.</desc>

  <defs>
    <pattern id="cut-hatch-safe" patternUnits="userSpaceOnUse"
             width="5" height="5" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="5"
            stroke="currentColor" stroke-width="0.5"/>
    </pattern>
  </defs>

  <!-- Brass case wall material -->
  <path d="M176 96 L524 96 L524 234 L176 234 Z
           M180 100 L520 100 L520 230 L180 230 Z"
        fill="url(#cut-hatch-safe)" fill-rule="evenodd"
        stroke="none"/>

  <!-- Wall outlines -->
  <g fill="none" stroke="currentColor" stroke-width="1.4"
     stroke-linejoin="round" stroke-linecap="butt">
    <path d="M176 96 L524 96 L524 234 L176 234 Z"/>
    <path d="M180 100 L520 100 L520 230 L180 230 Z"/>
  </g>

  <!-- Internal structural elements -->
  <g fill="none" stroke="currentColor" stroke-width="1.2"
     stroke-linejoin="round" stroke-linecap="butt">

    <!-- Brass taps on top of the case -->
    <g stroke-width="1.0">
      <path d="M252 96 L252 74"/>
      <path d="M244 74 L260 74"/>
      <path d="M252 74 L252 62"/>
      <path d="M380 96 L380 74"/>
      <path d="M372 74 L388 74"/>
      <path d="M380 74 L380 62"/>
    </g>

    <!-- Brass mullions dividing the front into three glass panels -->
    <g stroke-width="1.0">
      <path d="M298 100 L298 230"/>
      <path d="M402 100 L402 230"/>
    </g>

    <!-- Three test cups, each with a hydrometer -->
    <g stroke-width="1.0">
      <path d="M222 122 L222 214"/>
      <path d="M258 122 L258 214"/>
      <path d="M222 214 C222 222, 258 222, 258 214"/>
      <path d="M224 172 C234 176, 246 176, 256 172"/>
      <ellipse cx="240" cy="188" rx="4" ry="6"/>
      <path d="M240 182 L240 134"/>
      <path d="M332 122 L332 214"/>
      <path d="M368 122 L368 214"/>
      <path d="M332 214 C332 222, 368 222, 368 214"/>
      <path d="M334 172 C344 176, 356 176, 366 172"/>
      <ellipse cx="350" cy="188" rx="4" ry="6"/>
      <path d="M350 182 L350 134"/>
      <path d="M442 122 L442 214"/>
      <path d="M478 122 L478 214"/>
      <path d="M442 214 C442 222, 478 222, 478 214"/>
      <path d="M444 172 C454 176, 466 176, 476 172"/>
      <ellipse cx="460" cy="188" rx="4" ry="6"/>
      <path d="M460 182 L460 134"/>
    </g>

    <!-- Brass stand: two front legs and a cross-stretcher -->
    <path d="M192 234 L192 322"/>
    <path d="M508 234 L508 322"/>
    <path d="M206 300 L494 300"/>

    <!-- Swivelling spout with hinge and angled position -->
    <path d="M340 234 L340 270"/>
    <ellipse cx="340" cy="272" rx="6" ry="4"/>
    <path d="M340 272 L432 360"/>

    <!-- Floor line -->
    <path d="M148 380 L612 380"/>

    <!-- Receivers (two floor-level bowls) -->
    <path d="M210 380 C210 432, 340 432, 340 380"/>
    <path d="M380 380 C380 432, 510 432, 510 380"/>

    <!-- Distillate inlet pipe nozzle at the top of the case -->
    <path d="M124 96 L124 76 L150 76 L150 96"/>
  </g>

  <!-- Annotation leaders -->
  <g fill="none" stroke="currentColor" stroke-width="1.0"
     stroke-linecap="butt" stroke-dasharray="5 3">
    <!-- distillate from condenser -->
    <path d="M196 56 L137 76"/>
    <!-- brass tap -->
    <path d="M576 56 L388 70"/>
    <!-- glass panel -->
    <path d="M124 166 L190 168"/>
    <!-- cup and hydrometer -->
    <path d="M592 176 L478 188"/>
    <!-- swivelling spout -->
    <path d="M572 308 L432 360"/>
    <!-- brass stand -->
    <path d="M134 296 L206 300"/>
    <!-- foreshots and feints -->
    <path d="M282 446 L282 412"/>
    <!-- potable spirit -->
    <path d="M444 446 L444 412"/>
  </g>

  <!-- Dots at endpoints -->
  <g fill="currentColor" stroke="none">
    <circle cx="190" cy="168" r="2.4"/>
    <circle cx="478" cy="188" r="2.4"/>
    <circle cx="432" cy="360" r="2.4"/>
    <circle cx="206" cy="300" r="2.4"/>
    <circle cx="388" cy="70" r="2.4"/>
    <circle cx="282" cy="412" r="2.4"/>
    <circle cx="444" cy="412" r="2.4"/>
    <circle cx="137" cy="76" r="2.6"/>
  </g>

  <!-- Labels -->
  <g fill="currentColor" font-size="14" stroke="none">
    <text x="200" y="52" text-anchor="end">Distillate from condenser</text>
    <text x="582" y="52">Brass tap</text>
    <text x="120" y="170" text-anchor="end">Glass panel</text>
    <text x="598" y="180">Cup and hydrometer</text>
    <text x="578" y="312">Swivelling spout</text>
    <text x="130" y="300" text-anchor="end">Brass stand</text>
    <text x="282" y="462" text-anchor="middle">Foreshots and feints</text>
    <text x="444" y="462" text-anchor="middle">Potable spirit</text>
  </g>
</svg>
