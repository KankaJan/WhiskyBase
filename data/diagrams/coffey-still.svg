<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470"
     role="img" aria-labelledby="coffey-title coffey-desc"
     class="wb-diagram">
  <!-- WhiskyBase diagram: Coffey still (hand-drawn schematic).
       Style spec: docs/diagram-style.md. Labels outside the columns;
       leaders never cross a drawn line.
       Grounded on Russell ed. 2022 Ch 15; see coffey-still.yml source 1. -->
  <title id="coffey-title">Coffey still</title>
  <desc id="coffey-desc">Schematic of a Coffey still: two plated
    columns, the analyser and the rectifier. Cold wash is preheated
    up the rectifier and fed to the top of the analyser; steam
    enters the analyser base; vapour passes to the rectifier base;
    spirit is drawn off near the top of the rectifier.</desc>

  <defs>
    <filter id="sketch-coffey" x="-15%" y="-15%" width="130%" height="130%">
      <feTurbulence type="fractalNoise" baseFrequency="0.015"
                    numOctaves="2" seed="17" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="6"/>
    </filter>
  </defs>

  <g fill="none" stroke="currentColor" stroke-width="2.5"
     stroke-linejoin="round" stroke-linecap="round"
     filter="url(#sketch-coffey)">
    <!-- analyser column -->
    <path d="M160 100 L280 100 L280 410 L160 410 Z"/>
    <!-- rectifier column -->
    <path d="M460 100 L580 100 L580 410 L460 410 Z"/>
    <!-- plates -->
    <g stroke-width="1.8">
      <path d="M160 150 L280 150"/>
      <path d="M160 198 L280 198"/>
      <path d="M160 246 L280 246"/>
      <path d="M160 294 L280 294"/>
      <path d="M160 342 L280 342"/>
      <path d="M460 150 L580 150"/>
      <path d="M460 198 L580 198"/>
      <path d="M460 246 L580 246"/>
      <path d="M460 294 L580 294"/>
      <path d="M460 342 L580 342"/>
    </g>
    <!-- wash preheat coil rising through the rectifier -->
    <g stroke-width="2">
      <path d="M520 400 L500 372 L540 344 L500 316 L540 288
               L500 260 L540 232 L500 204 L540 176 L520 130"/>
    </g>
    <!-- cold wash feed inlet -->
    <path d="M662 422 L582 404"/>
    <path d="M590 396 L580 405 L592 410"/>
    <!-- preheated wash crossover to the analyser top -->
    <path d="M520 130 L520 78 L220 78 L220 100"/>
    <path d="M212 92 L220 102 L228 92"/>
    <!-- steam inlet at the analyser base -->
    <path d="M86 392 L158 380"/>
    <path d="M146 374 L160 380 L148 388"/>
    <!-- vapour transfer, analyser top to rectifier base -->
    <path d="M280 118 L372 118 L372 392 L458 392"/>
    <path d="M450 384 L460 392 L450 400"/>
    <!-- spirit draw-off near the rectifier top -->
    <path d="M580 152 L650 152"/>
    <path d="M642 144 L652 152 L642 160"/>
  </g>

  <g fill="none" stroke="var(--muted-color)" stroke-width="1.4"
     stroke-linecap="round" filter="url(#sketch-coffey)">
    <path d="M220 432 L220 412"/>
    <path d="M520 432 L520 412"/>
    <path d="M598 432 C616 424 636 416 652 412"/>
    <path d="M86 378 C108 379 130 380 150 381"/>
    <path d="M334 250 L368 250"/>
  </g>

  <g fill="var(--muted-color)" font-size="14" stroke="none">
    <text x="220" y="448" text-anchor="middle">Analyser column</text>
    <text x="520" y="448" text-anchor="middle">Rectifier column</text>
    <text x="600" y="442">Cold wash feed</text>
    <text x="80" y="374" text-anchor="end">Steam in</text>
    <text x="330" y="254" text-anchor="end">Vapour transfer</text>
    <text x="658" y="156">Spirit out</text>
  </g>
</svg>
