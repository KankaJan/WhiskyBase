<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 510"
     role="img" aria-labelledby="coffey-title coffey-desc"
     class="wb-diagram">
  <!-- Blueprint cross-section of a Coffey still. Two plated columns
       (analyser and rectifier) with double-walled outlines and
       section hatching; dashed annotation leaders. Stroke color:
       currentColor. -->
  <title id="coffey-title">Coffey still</title>
  <desc id="coffey-desc">Blueprint-style schematic of a Coffey still
    in cross-section: the plated analyser column on the left, the
    plated rectifier column on the right. Cold wash enters the
    rectifier base, rises through a pre-heat coil, crosses over to
    the analyser top; steam enters the analyser base; alcohol-rich
    vapour crosses to the rectifier base via the vapour-transfer
    pipe; spirit is drawn off near the rectifier top.</desc>

  <defs>
    <pattern id="cut-hatch-coffey" patternUnits="userSpaceOnUse"
             width="5" height="5" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="5"
            stroke="currentColor" stroke-width="0.5"/>
    </pattern>
  </defs>

  <!-- Analyser column wall material -->
  <path d="M156 106 L284 106 L284 414 L156 414 Z
           M160 110 L280 110 L280 410 L160 410 Z"
        fill="url(#cut-hatch-coffey)" fill-rule="evenodd"
        stroke="none"/>

  <!-- Rectifier column wall material -->
  <path d="M456 106 L584 106 L584 414 L456 414 Z
           M460 110 L580 110 L580 410 L460 410 Z"
        fill="url(#cut-hatch-coffey)" fill-rule="evenodd"
        stroke="none"/>

  <!-- Column wall outlines -->
  <g fill="none" stroke="currentColor" stroke-width="1.4"
     stroke-linejoin="round" stroke-linecap="butt">
    <path d="M156 106 L284 106 L284 414 L156 414 Z"/>
    <path d="M160 110 L280 110 L280 410 L160 410 Z"/>
    <path d="M456 106 L584 106 L584 414 L456 414 Z"/>
    <path d="M460 110 L580 110 L580 410 L460 410 Z"/>
  </g>

  <!-- Internal structural elements -->
  <g fill="none" stroke="currentColor" stroke-width="1.2"
     stroke-linejoin="round" stroke-linecap="butt">

    <!-- Plates: 4 per column -->
    <g stroke-width="1.0">
      <path d="M160 170 L280 170"/>
      <path d="M160 230 L280 230"/>
      <path d="M160 290 L280 290"/>
      <path d="M160 350 L280 350"/>
      <path d="M460 170 L580 170"/>
      <path d="M460 230 L580 230"/>
      <path d="M460 290 L580 290"/>
      <path d="M460 350 L580 350"/>
    </g>

    <!-- Wash pre-heat coil in the rectifier -->
    <g stroke-width="1.0">
      <path d="M520 400 L500 360 L540 320 L500 280 L540 240
               L500 200 L540 160 L520 130"/>
    </g>

    <!-- Wash crossover from rectifier top to analyser top -->
    <path d="M520 130 L520 80 L220 80 L220 110"/>

    <!-- Vapour transfer pipe (analyser top to rectifier base) -->
    <path d="M284 130 L380 130 L380 388 L456 388"/>

    <!-- Cold-wash inlet nozzle on the rectifier base (right wall) -->
    <path d="M584 392 L624 392 L624 412 L584 412"/>

    <!-- Steam inlet nozzle at the analyser base (left wall) -->
    <path d="M156 380 L116 380 L116 400 L156 400"/>

    <!-- Spirit draw-off nozzle near the rectifier top (right wall) -->
    <path d="M584 158 L624 158 L624 178 L584 178"/>
  </g>

  <!-- Annotation leaders -->
  <g fill="none" stroke="currentColor" stroke-width="1.0"
     stroke-linecap="butt" stroke-dasharray="5 3">
    <!-- analyser column -->
    <path d="M120 258 L156 258"/>
    <!-- rectifier column -->
    <path d="M620 258 L584 258"/>
    <!-- steam in -->
    <path d="M110 360 L116 380"/>
    <!-- cold wash feed -->
    <path d="M650 446 L624 412"/>
    <!-- spirit out -->
    <path d="M650 138 L624 158"/>
    <!-- vapour transfer -->
    <path d="M388 460 L410 396"/>
  </g>

  <!-- Dots at endpoints -->
  <g fill="currentColor" stroke="none">
    <circle cx="156" cy="258" r="2.4"/>
    <circle cx="584" cy="258" r="2.4"/>
    <circle cx="410" cy="396" r="2.4"/>
    <circle cx="116" cy="380" r="2.6"/>
    <circle cx="624" cy="412" r="2.6"/>
    <circle cx="624" cy="158" r="2.6"/>
  </g>

  <!-- Labels -->
  <g fill="currentColor" font-size="14" stroke="none">
    <text x="118" y="262" text-anchor="end">Analyser column</text>
    <text x="624" y="262">Rectifier column</text>
    <text x="108" y="356" text-anchor="end">Steam in</text>
    <text x="558" y="452">Cold wash feed</text>
    <text x="656" y="142">Spirit out</text>
    <text x="320" y="466">Vapour transfer</text>
  </g>
</svg>
