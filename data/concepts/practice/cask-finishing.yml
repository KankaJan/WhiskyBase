# --- Identity ---------------------------------------------------------------
id: cask-finishing
title: Cask finishing
kind: practice


# --- Summary & Body ---------------------------------------------------------
summary: |
  Cask finishing (also "wood finishing" or double / secondary
  maturation) is the practice of transferring already-matured
  whisky into a second, different cask for a further period
  before bottling. The finishing cask — commonly an ex-sherry,
  port, wine or rum cask — adds a further layer of extracted
  character on top of the primary maturation.

body: |
  ## What finishing is

  A whisky is first matured to maturity in its primary cask
  (typically an ex-bourbon barrel). In cask finishing, it is then
  re-racked into a second cask of a different prior content for a
  shorter further period. The second cask contributes its own
  extracted compounds and the residue of its previous fill, so
  the finished whisky carries character from both casks. The
  general chemistry is that of [maturation](concept/educational/maturation)
  and [cask-maturation-kinetics](concept/educational/cask-maturation-kinetics);
  finishing simply applies a second cask exposure.

  ## Finishing versus full secondary maturation

  Finishing shades into full secondary (or "double") maturation;
  the difference is mainly one of duration and intent. This
  project records a terminal cask exposure of under about twelve
  months in the bottling `finish` field, and treats longer
  substantive secondary maturations as additional `maturation`
  entries (see the schema convention in `TODO.md`). The boundary
  is a documentation convention, not a regulatory line.

  ## See also

  - [maturation](concept/educational/maturation) — the primary
    maturation stage finishing extends.


