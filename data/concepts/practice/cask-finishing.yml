# --- Practice block ---------------------------------------------------------
practice:
  adopted_by: []                     # Widespread; not a
                                     # distinguishing per-distillery
                                     # practice at the entry level.
  consequences: |
    The finished whisky carries extracted character from two
    casks of different prior contents, layered rather than blended.
  contrast_with:
    - educational/maturation         # Single-cask primary maturation.


# --- Sources ----------------------------------------------------------------
sources:
  - id: 1
    type: book
    citation: |
      Conner, J., "Maturation", Chapter 16 in Russell, I.,
      Stewart, G. & Kellershohn, J. (eds.), Whisky and Other
      Spirits: Technology, Production and Marketing, 3rd edition,
      Academic Press (Elsevier), 2022.
    accessed: 2026-05-21
    notes: |
      Ch 16 (Conner, Maturation) establishes that cask type and
      prior fill are the dominant maturation variables and that
      maturation is not a homogeneous process — the basis on which
      a second cask of different prior content confers additional
      character.
  - id: 2
    type: book
    citation: |
      Miller, G.H., Whisky Science: A Condensed Distillation,
      2nd edition, Springer International Publishing, 2024.
      ISBN 978-3-031-50686-4.
    accessed: 2026-05-21
    notes: |
      Miller Ch 8 (Maturation), section 8.14 Post-Maturation
      Processing, treats the processing steps applied to whisky
      after its primary maturation.


