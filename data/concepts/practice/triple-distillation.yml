# --- Sources ----------------------------------------------------------------
sources:
  - id: 1
    type: book
    citation: |
      Nicol, D.A., "Batch distillation", Chapter 9 in
      Russell, I. & Stewart, G. (eds.), Whisky: Technology,
      Production and Marketing, 2nd edition, Academic Press
      (Elsevier), 2014, pp 155-177.
    accessed: 2026-05-19
    notes: |
      The triple-distillation section is on p 173. Nicol
      describes the three-still sequence (wash still → low
      wines still → spirit still), the strong/weak fraction
      splits at each stage, the recycling of weak feints and
      heads/tails, the strength figures (double-distilled
      ~68-72% ABV; triple-distilled approaching 90% ABV), the
      "primarily lowland" distribution, the Irish-practice
      parallel, and the "at least two distilleries" count for
      the Scotch malt industry as of 2014.

  - id: 2
    type: official_website
    url: https://www.auchentoshan.com/our-process
    accessed: 2026-05-18
    notes: |
      Auchentoshan's producer process page. Used for the
      producer-attributed characterisation of triple
      distillation as producing a "lighter" and "smoother"
      spirit and the producer's claim that distillation runs
      from ~8% wash to 81% final spirit (within the general
      triple-distillation range Nicol documents).


