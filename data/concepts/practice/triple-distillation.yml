  consequences: |
    Collects new-make spirit at a higher alcoholic strength than
    double distillation (a triple-distilled product can approach
    90% ABV against the ~68-72% typical of double distillation)
    and is associated with a lighter, more rectified spirit
    character as heavier congeners are separated out across the
    additional distillation pass. The lighter-character claim is
    producer-attributed; the strength difference is the
    load-bearing, literature-grounded fact.
