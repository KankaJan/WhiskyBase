    citation: |
      Bringhurst, T.A., Harrison, B.M. & Brosnan, J., "Scotch
      whisky: raw material selection and processing", Chapter 10
      in Russell, I., Stewart, G. & Kellershohn, J. (eds.),
      Whisky and Other Spirits: Technology, Production and
      Marketing, 3rd edition, Academic Press (Elsevier), 2022.
    accessed: 2026-05-21
    notes: |
      Ch 10 (Bringhurst, Harrison & Brosnan) covers malt as a
      raw material and the commercial maltings that supply the
      Scotch industry, the large-batch mechanised malting that
      has displaced most on-site floor malting.
  - id: 2
    type: book
    citation: |
      Miller, G.H., Whisky Science: A Condensed Distillation,
      2nd edition, Springer International Publishing, 2024.
      ISBN 978-3-031-50686-4.
    accessed: 2026-05-21
    notes: |
      Miller Ch 3 (Malting), p 152, describes the pneumatic
      malting facility: after initial soaking, conditioned and
      humidified air is continually drawn down through the grain
      bed to provide oxygen, expel carbon dioxide, and maintain
      moisture content, with temperature controlled through the
      cycle.


