# --- Identity ---------------------------------------------------------------
id: pneumatic-malting
title: Pneumatic malting
kind: practice


# --- Summary & Body ---------------------------------------------------------
summary: |
  Pneumatic malting is the mechanised alternative to traditional
  floor malting. After steeping, the germinating grain is held in
  a closed vessel through which conditioned, humidified air is
  drawn to supply oxygen, carry off carbon dioxide and heat, and
  hold moisture and temperature steady. The two common forms are
  the rotating drum and the Saladin box (a long rectangular bed
  with mechanical turners). Pneumatic malting handles far larger
  batches than a malting floor and is the standard method at the
  commercial maltings that supply most Scotch distilleries.

body: |
  Pneumatic malting is the mechanised contrast to
  [floor malting](concept/practice/floor-malting) — the same
  controlled germination, but in a closed vessel with forced air
  rather than on an open floor turned by hand.

  ## How it works

  After [steeping](concept/glossary/steeping), the grain is loaded
  into the malting vessel and germinated under a stream of
  conditioned air: humidified, temperature-controlled air is drawn
  through the grain bed to deliver oxygen, expel the carbon
  dioxide and heat that germination generates, and keep moisture
  and temperature uniform [1][2].

  ## Drum and Saladin box

  Two forms are common: the rotating **drum**, turned mechanically
  to keep the bed loose and even, and the **Saladin box**, a long
  rectangular bed worked by travelling mechanical turners. Both
  handle much larger batches than a malting floor and need far
  less manual labour, which is why
  [external malting](concept/practice/external-malting) at large
  commercial maltings has displaced most on-site floor malting.

  ## See also

  - [floor-malting](concept/practice/floor-malting) — the
    traditional manual method this mechanises.
  - [external-malting](concept/practice/external-malting) — the
    buy-in practice that pneumatic maltings serve.


