practice:
  adopted_by: []                       # Distillery slugs not yet
                                       # systematically populated; the
                                       # practice applies by default to
                                       # most malt distilleries. The
                                       # explicit list is omitted because
                                       # of its near-universal coverage —
                                       # the more useful inverse is the
                                       # floor-malting list (see
                                       # practice/floor-malting).
  consequences: |
    Concentrates malt-stage process control in a small number of
    commercial maltsters. Trade-off: lower unit cost and tighter
    specification reproducibility, against loss of direct
    distillery-level control over the malt stage.
  contrast_with:
    - practice/floor-malting


# --- Sources ----------------------------------------------------------------
sources:
  - id: 1
    type: book
    citation: |
      Bringhurst, T.A. & Brosnan, J., "Scotch whisky: raw
      material selection and processing", Chapter 6 in
      Russell, I. & Stewart, G. (eds.), Whisky: Technology,
      Production and Marketing, 2nd edition, Academic Press
      (Elsevier), 2014, pp 49-121.
    accessed: 2026-05-19
    notes: |
      Bringhurst & Brosnan cover commercial maltster operation
      throughout the malting subsection of Ch 6, with malt
      specifications on pp 59-61 (Table 6.1 documents a typical
      2012 malt specification: moisture, soluble extract,
      fermentability, fermentable extract, predicted spirit
      yield, diastatic power, dextrinising units, total
      nitrogen). The malt-procurement and dialogue-with-supplier
      pattern is described on p 59.

  - id: 2
    type: trade_publication
    url: https://www.maltwhiskyyearbook.com/
    accessed: 2026-05-16
    notes: |
      The Malt Whisky Yearbook records maltster relationships
      where disclosed. Useful as a cross-check on which
      distilleries source from which maltster, though
      disclosure is uneven.


