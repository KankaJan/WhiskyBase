    url: https://scotchwhisky.com/whiskypedia/4892/isle-of-harris/
    accessed: 2026-05-02
    notes: |
      Worked example of a Whiskypedia structured spec sheet
      reporting PPM — Isle of Harris entry showing the 12-14 ppm
      specification for The Hearach.

  - id: 3
    type: trade_publication
    url: https://scotchwhisky.com/magazine/latest-news/15546/octomore-08-3-is-world-s-peatiest-scotch/
    accessed: 2026-05-02
    notes: |
      Used as the contrast case for direct producer attribution.
      The article carries Bruichladdich's explicit statement: "Using
      HPLC (high performance liquid chromatography), the readings
      came back at 309.1 ppm" — direct producer attribution distinct
      from Whiskypedia's derivative curation.


