  - methodology/harris-published-ppm


# --- Methodology block ------------------------------------------------------
methodology:
  measures:
    - peating_ppm
  method: hplc
  compounds: standard_7
  used_by:
    - harris                           # Harris's Whiskypedia entry is
                                       # the source cited via this
                                       # methodology in data. Other
                                       # distilleries' Whiskypedia
                                       # entries become candidates as
                                       # their entries are added.
  adopted: null                        # The Whiskypedia structured
                                       # section has been in continuous
                                       # use across the magazine's
                                       # active publication period; no
                                       # specific adoption date for the
                                       # PPM-disclosure convention is
                                       # documented.
  limitations: |
    Whiskypedia spec sheets are derivative — they curate producer-
    disclosed values rather than independently measuring. The
    HPLC + standard 7 methodology is implicit (industry-standard for
    modern Scotch) rather than explicitly attributed on the
    Whiskypedia entries themselves. For distilleries that have their
    own published methodology pages (e.g. Bruichladdich), prefer the
    distillery-specific methodology slug, which records direct
    producer attribution rather than derivative curation.


