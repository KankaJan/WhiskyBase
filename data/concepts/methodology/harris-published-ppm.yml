# --- Methodology block ------------------------------------------------------
methodology:
  measures:
    - peating_ppm
  method: hplc
  compounds: standard_7
  used_by:
    - harris
  adopted: null                        # Harris began production in
                                       # 2015; the methodology has been
                                       # used since the first commercial
                                       # release of The Hearach in 2023.
  limitations: |
    Spec PPM only — measured at the malt stage by the maltster
    (Bairds), not by Harris itself. Harris's published PPM is the
    supplier's specification; the distillery does not perform or
    commission independent verification of every malt delivery. The
    seven-compound sum discards individual compound information; for
    finer-grained analysis, GC-MS on the bottled liquid would be
    required and is not part of Harris's published practice. The
    inherited-from-supplier nature of this methodology means that
    changes in Bairds' practice would propagate to Harris's
    disclosed figures without separate notification.


