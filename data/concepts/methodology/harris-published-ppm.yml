# =============================================================================
# Schema: concept.template.yml v0.1
# Kind: methodology
# Function: attestation referenced from production_line.peating
# measurements where the source is Harris-derived. Distinct from
# bruichladdich-published-ppm in one important respect: Harris does not
# perform or commission its own PPM measurement; the published figure
# is the maltster's (Bairds of Inverness) specification, inherited
# without independent verification.
