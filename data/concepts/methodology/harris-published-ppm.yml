# --- Identity ---------------------------------------------------------------
id: harris-published-ppm
title: Harris's published PPM methodology
kind: methodology


# --- Summary & Body ---------------------------------------------------------
summary: |
  The Isle of Harris Distillery reports phenol PPM specifications for
  The Hearach as the malt specification supplied by their maltster,
  Bairds of Inverness. Bairds uses high performance liquid
  chromatography (HPLC) summing the standard set of seven phenolic
  compounds. Harris does not independently re-measure delivered
  malt; the published PPM is the maltster's spec figure.

body: |
  The Isle of Harris Distillery, founded 2015, sources malted
  barley from Bairds of Inverness for The Hearach core single malt
  line. The malt is specified at 12-14 ppm phenols [1]. The
  methodology behind that figure is inherited from Bairds rather
  than performed by Harris itself; Bairds uses HPLC as its standard
  for peated malt PPM disclosure, consistent with broader Scotch
  industry practice for modern peated malt specs [2].

  ## What this methodology measures

  The Bairds spec PPM is the total phenol content of the kilned
  malt before it is delivered to Harris and before it is mashed,
  fermented, or distilled. As with all spec-stage PPM disclosures,
  it is a specification of the malt input, not of the bottled
  liquid. The phenol concentration in the new make spirit is
  substantially lower than the malt-stage figure, and the figure in
  bottled Hearach is lower again.

  ## What this methodology does not claim

  The published PPM figure is silent on:

  - the concentration of phenols in the bottled Hearach
  - the perceived smokiness of the finished whisky
  - the specific phenolic profile (the standard seven-compound sum
    discards information about which compounds are present in what
    proportion)
  - the origin or type of peat used by Bairds for the Harris malt
    (Harris does not separately disclose Bairds' peat sourcing)

  An independent measurement by Two Whisky Bros reported
  approximately 12.1 ppm in delivered malt for The Hearach Batch 5,
  consistent with the lower end of the disclosed spec range [3].
  The reviewer did not state the measurement method explicitly; the
  figure's alignment with the spec range and the maltster's standard
  practice supports inferring HPLC + standard 7 methodology.

  ## How this differs from related methodologies

  This methodology is distinct from
  [Bruichladdich's published PPM](concept/methodology/bruichladdich-published-ppm)
  in one important respect: Bruichladdich appears to perform or
  commission PPM measurement directly, and has explicitly attributed
  specific figures (the 309.1 ppm Octomore 8.3 release) to HPLC
  measurement in producer communications. Harris by contrast
  inherits the maltster's standard without separate attribution;
  the published Harris PPM is the supplier's spec sheet figure
  reported through the distillery's product pages. The
  [Scotch Whisky magazine Whiskypedia methodology](concept/methodology/scotch-whisky-published-ppm)
  is a third related case — the same HPLC + standard 7 industry
  default, but applied as derivative curation of producer specs by
  a trade publication rather than as direct producer attribution.


