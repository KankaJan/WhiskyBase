# --- Methodology block ------------------------------------------------------
methodology:
  measures:
    - peating_ppm
  method: hplc
  compounds: standard_7
  used_by:
    - bruichladdich                    # Slug of the distillery.
                                       # The line and bottling entries
                                       # also use this methodology;
                                       # listing the distillery here is
                                       # sufficient given the
                                       # distillery-line-bottling
                                       # hierarchy.
  adopted: null                        # Method has been used
                                       # consistently since at least the
                                       # Octomore series began in 2008;
                                       # specific adoption date not
                                       # disclosed.
  limitations: |
    Spec PPM only — measured at the malt stage, not in the new make
    or bottled liquid. The seven-compound sum discards individual
    compound information; for finer-grained analysis, GC-MS on the
    bottled liquid would be required and is not part of the
    producer's published practice.


