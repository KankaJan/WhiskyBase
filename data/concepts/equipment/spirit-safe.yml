# --- Identity ---------------------------------------------------------------
id: spirit-safe
title: Spirit safe
kind: equipment


# --- Summary & Body ---------------------------------------------------------
summary: |
  The spirit safe is the locked, glass-fronted brass instrument
  through which the distillate from a pot still flows, so that its
  strength and temperature can be read and the cut points judged
  without the spirit being handled. It carries spirit hydrometers
  and a swivelling spout that directs the flow between receivers.
  The spirit safe was first introduced around 1823, at the Port
  Ellen distillery on Islay, and was historically kept under lock
  to prevent illicit sampling and to satisfy excise control.

body: |
  The spirit safe sits between the still's condenser and the
  receivers, and is the distiller's window onto the running
  distillation — see [the spirit cut](concept/educational/spirit-cut)
  for how it is used to make the cut.

  ## Function

  The distillate runs through the safe, where spirit hydrometers
  (calibrated at 20 degrees C) read its strength and a thermometer
  its temperature [1]. A swivelling spout directs the flow to the
  appropriate receiver — for a spirit still, one bowl for
  foreshots and feints and one for the potable spirit. The
  demisting test, which fixes the foreshots-to-spirit cut point,
  is carried out at the safe [1].

  ## Lock and key

  The safe is made of brass with plate-glass windows and was
  historically locked, the keys held so as to prevent illicit
  sampling and to keep the operation within excise control [1][2].


