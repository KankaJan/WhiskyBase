# --- Summary & Body ---------------------------------------------------------
summary: |
  The Coffey still — also called the patent still or continuous
  still — is the column still used to distil Scotch grain whisky.
  Unlike the batch pot still it runs continuously: a steady feed
  of wash enters the analyser column and meets rising steam, and
  the alcohol vapour passes to a second column, the rectifier,
  where it condenses and is drawn off at high strength. It is
  named for Aeneas Coffey, who patented his design in 1830,
  refining Robert Stein's 1827 column still.

body: |
  The Coffey still is the grain-whisky counterpart to the malt
  distillery's [pot still](concept/equipment/pot-still): a
  continuous still rather than a batch one.

  ## How it works

  A traditional Coffey still has two columns [1]:

  - **Analyser (wash) column** — preheated wash is fed in high up
    the column and flows down across a series of plates; steam
    introduced at the base boils the liquid and fractionation
    begins.
  - **Rectifier column** — vapour from the top of the analyser is
    led into the base of the rectifier and rises, meeting the
    cool wash-feed coil and condensing; the spirit condensed on
    the spirit plate is drawn off as the product, with fusel oil
    removed lower down.

  Because the feed is constant, the still reaches a steady state
  and runs without interruption — unlike the fill-distil-empty
  cycle of a pot still. It also reaches a higher, lighter spirit
  strength in a single pass.

  ## In whisky production

  Continuous distillation made grain whisky available as a
  lighter, cheaper component, and its introduction in the
  mid-1800s is what made commercial
  [blending](concept/educational/blending) possible. See
  [distillation](concept/educational/distillation) for the
  process overview and the pot-still contrast.


