      Schematic of a Coffey still in cross-section: the
      plated analyser column on the left and the plated rectifier
      column on the right, with the pre-heat coil rising through the
      rectifier, the cold wash feed at the rectifier base, the
      wash crossover from rectifier top to analyser top, the steam
      inlet at the analyser base, the vapour-transfer pipe from
      analyser top to rectifier base, and the spirit draw-off near
      the rectifier top.
