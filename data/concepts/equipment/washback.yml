# --- Diagrams ---------------------------------------------------------------
diagrams:
  - file: washback.svg
    alt: >-
      Blueprint-style cross-section of a tall upright wooden washback: a
      cylindrical vessel drawn in double-walled outline with diagonal
      section hatching on the cut staves. A drive motor on the lid turns
      a vertical switcher shaft; a horizontal switcher arm sweeps the top
      of the wash to knock down fermenting froth. Three iron hoops bind
      the vessel. Cooled wort and yeast enter through a short pipe nozzle
      on the dome; the fermented wash runs off through a nozzle on the
      right wall to the wash still. Each part is connected to its label
      by a dashed annotation leader ending in a filled dot.
    caption: "A wooden washback in blueprint cross-section: switcher, iron hoops, inlet and outlet nozzles."
    source_id: 1


# --- Sources ----------------------------------------------------------------
sources:
  - id: 1
    type: book
    citation: |
      Russell, I. & Stewart, G., "Distilling yeast and
      fermentation", Chapter 12 in Russell, I., Stewart, G. &
      Kellershohn, J. (eds.), Whisky and Other Spirits:
      Technology, Production and Marketing, 3rd edition,
      Academic Press (Elsevier), 2022.
    accessed: 2026-05-21
    notes: |
      Ch 12 (Russell & Stewart), pp 231-232: the fermentation
      vessels (washbacks) vary in size, geometry and
      construction; malt-distillery fermenters are comparatively
      small (up to 30,000 L) and traditional wooden vessels are
      "not uncommon"; grain-distillery fermenters are much larger
      (250,000 L+) and usually stainless steel with temperature
      control, CIP and stirring.
  - id: 2
    type: book
    citation: |
      Miller, G.H., Whisky Science: A Condensed Distillation,
      2nd edition, Springer International Publishing, 2024.
      ISBN 978-3-031-50686-4.
    accessed: 2026-05-21
    notes: |
      Miller Ch 5 (Fermentation), p 239: lactobacilli enter the
      fermentation through raw materials or through "wooden
      washbacks which are difficult to sterilize", and help shape
      the character of the spirit.


