# --- Identity ---------------------------------------------------------------
id: washback
title: Washback
kind: equipment


# --- Summary & Body ---------------------------------------------------------
summary: |
  A washback is the vessel in which wort is fermented into wash.
  Cooled wort is run into the washback, pitched with distiller's
  yeast, and fermented over roughly 48 to 100+ hours into a wash
  of about 7-9% ABV. Malt-distillery washbacks are comparatively
  small (up to about 30,000 litres) and are often built of wood —
  Oregon pine, larch or Douglas fir — although stainless steel is
  also common; grain distilleries use much larger stainless-steel
  fermenters.

body: |
  The washback is the fermentation vessel of a Scotch malt
  distillery — the stage between mashing and distillation.

  ## Wood and steel

  Malt-distillery washbacks have a much smaller capacity than
  typical brewery fermenters — up to roughly 30,000 litres — and
  traditional wooden vessels remain common [1]. Grain distilleries
  by contrast use far larger fermenters (250,000 litres or more),
  usually stainless steel, with temperature control, in-place
  cleaning and stirring [1]. Wood and steel washbacks are both in
  current use at malt distilleries; the choice is a site-level one
  recorded on the distillery and production-line entries.

  ## Fermentation in the washback

  Unlike a brewery, a malt distillery does not boil its wort, and
  wooden washbacks are difficult to sterilise [2]. A resident
  population of lactic acid bacteria therefore lives in wood
  washbacks and, particularly in longer fermentations, contributes
  to the character of the wash. See
  [fermentation](concept/glossary/fermentation) for the process
  and [distillers-yeast](concept/glossary/distillers-yeast) for
  the yeast.


