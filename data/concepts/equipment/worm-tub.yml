  distinguishing_features: |
    Tapered copper coil submerged in a water-filled vessel; produces
    a spirit with markedly less copper-stripping than shell-and-tube
    condensers, leaving more sulphur compounds in the new make.
    Larger, more expensive to install, and harder to maintain than
    shell-and-tube alternatives. The choice to use worm tubs is
    associated with a heavier, more savoury house style and is
    typically deliberate at the distillery level rather than an
    operational default.

