# --- Identity ---------------------------------------------------------------
id: pot-still
title: Pot still
kind: equipment


# --- Summary & Body ---------------------------------------------------------
summary: |
  A pot still is the batch still used for Scotch malt whisky
  distillation: a copper vessel charged with a fixed quantity of
  liquid, heated until the volatile fraction is driven off as
  vapour, then emptied and recharged for the next cycle. Each
  Scotch malt distillery runs at least one pair — a wash still
  and a spirit still — and the size, shape and operation of those
  stills are among the principal influences on new-make character.

body: |
  The pot still is the defining instrument of Scotch malt whisky
  production. Unlike the continuous column still used for grain
  whisky, it works one charge at a time: fill, distil, empty,
  recharge.

  ## Principal components

  A simple pot still, whether distilling wash or low wines,
  comprises [1]:

  - **Heating source** — direct fire (coal or gas beneath the
    pot) or, more commonly today, indirect steam heating through
    internal coils or pans.
  - **Pot** — the body of the still holding the charge.
  - **Head (or swan neck)** — the tapering upper section from
    which vapour leaves the pot.
  - **Lyne arm (lye pipe)** — the pipe carrying vapour from the
    head to the condenser. See [lyne-arm](concept/glossary/lyne-arm).
  - **Condenser** — where the vapour is returned to liquid,
    either a [worm tub](concept/equipment/worm-tub) or a
    [shell-and-tube condenser](concept/equipment/shell-and-tube-condenser).

  The whole vapour path is built of copper, whose reactions with
  the spirit vapour shape character — see
  [the copper conversation](concept/educational/copper-conversation).

  ## Shape and character

  Pot still shape varies widely between distilleries and is
  widely held to influence spirit character, principally through
  [reflux](concept/glossary/reflux) — the partial recondensation
  of vapour back into the pot. Tall stills with ascending lyne
  arms promote reflux and tend toward lighter spirit; short
  stills with descending lyne arms reduce it. Miller notes that
  although belief in the importance of still design is strong,
  the quantitative literature explaining it is thin [2].

  ## In the production sequence

  Scotch malt whisky is conventionally distilled twice: the
  [wash still](concept/glossary/wash-still) concentrates the
  fermented wash into [low wines](concept/glossary/low-wines),
  and the [spirit still](concept/glossary/spirit-still)
  redistils those low wines, the distiller taking
  [the spirit cut](concept/educational/spirit-cut). Some
  distilleries run a third still — see
  [triple distillation](concept/practice/triple-distillation).


