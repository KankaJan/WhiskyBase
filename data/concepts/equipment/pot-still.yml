# --- Sources ----------------------------------------------------------------
sources:
  - id: 1
    type: book
    citation: |
      Nicol, D.A., "Batch distillation", Chapter 14 in
      Russell, I., Stewart, G. & Kellershohn, J. (eds.),
      Whisky and Other Spirits: Technology, Production and
      Marketing, 3rd edition, Academic Press (Elsevier), 2022,
      pp 247-271.
    accessed: 2026-05-20
    notes: |
      Ch 14 (Nicol) enumerates the principal pot-still
      components (heating source, pot, head, lyne/lye pipe,
      condenser) at p 248, and reviews still design, construction
      and the role of copper.
  - id: 2
    type: book
    citation: |
      Miller, G.H., Whisky Science: A Condensed Distillation,
      2nd edition, Springer International Publishing, 2024.
      ISBN 978-3-031-50686-4.
    accessed: 2026-05-20
    notes: |
      Miller Ch 6 (Distillation Experiments and Observations),
      section 6.1 The Shape of Stills, pp 253-255: still geometry
      and reflux, with the caveat that "there is very little
      quantitative reasoning in the literature to explain the
      design of Scottish pot stills ... though there is much
      expressed belief in the importance of still design".


