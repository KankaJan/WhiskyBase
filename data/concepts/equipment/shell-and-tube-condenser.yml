                                     # The vast majority of Scotch malt
                                     # distilleries use shell-and-tube
                                     # condensers; only the
                                     # currently-populated entries are
                                     # listed here. The worm-tub page
                                     # holds the inverse list (the
                                     # minority that don't use
                                     # shell-and-tube).
  distinguishing_features: |
    Large copper surface area per unit of spirit, efficient heat
    transfer, controllable cooling rate, supports catalytic sulphur
    removal across the full tube bundle. Compact installation
    relative to outdoor worm-tub tubs. Industry-default condenser
    type for modern Scotch malt distillation.
  alternatives:
    - equipment/worm-tub


# --- Diagrams ---------------------------------------------------------------
diagrams:
  - file: shell-and-tube-condenser.svg
    alt: >-
      Cross-section schematic of a vertical shell-and-tube condenser:
      a domed upper bonnet receives spirit vapour from the still and
      distributes it across a bundle of copper tubes; the tubes pass
      through tube sheets at each end of the cylindrical shell and
      run down to a domed lower bonnet that drains condensed spirit
      to the spirit safe. Cooling water enters cold low on one side
      through a flanged nozzle and exits warm high on the opposite
      side, counter to the descending vapour and condensate.
    caption: "A shell-and-tube condenser in cross-section: bonnets, tube bundle, tube sheets, and counter-current water nozzles."
    source_id: null


