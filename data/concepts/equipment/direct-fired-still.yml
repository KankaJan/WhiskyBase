equipment:
  category: still
  used_at_distilleries:
    - glenfarclas                     # All six stills direct-fired.
    - springbank                      # Wash still only;
                                      # spirit stills are
                                      # indirect-steam (see
                                      # data/distilleries/springbank.yml).
    - macallan                        # Forward reference;
                                      # Macallan not yet populated.
    - glenlivet                       # Forward reference.
    - ben-nevis                       # Forward reference.
  distinguishing_features: |
    Gas (historically coal) heating applied directly under the
    still copper rather than via internal steam coils.
    Localised hot copper surface drives Maillard / caramelisation
    reactions that don't form to the same extent under uniform
    indirect-steam heating. Requires a rummager (copper-mesh
    chain stirred across the still base) to prevent solids from
    baking onto the heated copper. Now uncommon in Scotch malt
    distilling; most distilleries converted to indirect-steam
    heating from the mid-20th century for energy efficiency and
    process control.
  alternatives:
    - equipment/shell-and-tube-condenser   # Indirect-steam-heated
                                           # stills are universally
                                           # paired with shell-and-tube
                                           # condensers in modern
                                           # Scotch malt distilling;
                                           # the broader
                                           # equipment-comparison
                                           # framework places direct
                                           # firing against the
                                           # indirect-steam standard
                                           # the project documents
                                           # via the shell-and-tube
                                           # equipment page.


