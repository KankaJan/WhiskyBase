# --- Identity ---------------------------------------------------------------
id: mash-tun
title: Mash tun
kind: equipment


# --- Summary & Body ---------------------------------------------------------
summary: |
  A mash tun is the vessel in which milled malt (grist) is mixed
  with hot water to extract fermentable sugars — the mashing
  stage. The grist is mixed with a first water at about
  63.5-64 degrees C to gelatinise the starch and let the malt
  enzymes convert it to sugar; the sweet wort is drained through
  a slotted false floor that the spent grain husks form into a
  filter bed, and further, hotter waters recover the remaining
  extract. Three main types are in use.

body: |
  The mash tun is where mashing is carried out — see
  [mashing](concept/glossary/mashing) for the process and
  [wort](concept/glossary/wort) for the liquid it produces.

  ## The three types

  Mashing is a batch process, carried out in one of three main
  types of mash tun [1]:

  - **Traditional (rake-and-plough) tun** — mechanical rakes and
    a plough stir the grist bed and discharge the spent grains.
  - **Lauter / semi-lauter tun** — rotating knife-fitted arms can
    be raised and lowered to cut the bed and control the run-off,
    giving faster, more consistent wort separation.
  - **Mash filter** — a plate-and-frame filter that presses wort
    from the mash; it needs a much finer grist. Mash filters are
    rare in Scotch malt whisky — Russell records at least two
    distilleries operating one at the time of writing [1].

  ## In the production sequence

  The grist is delivered from the mill, combined with the first
  mashing water, and held at the saccharification temperature;
  the wort is drawn off and the bed is sparged with further
  waters at higher temperatures (typically 70-90 degrees C) to
  recover the remaining extract [1]. The wort is cooled and run
  to the [washback](concept/equipment/washback).


