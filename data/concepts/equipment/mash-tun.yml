# --- Diagrams ---------------------------------------------------------------
diagrams:
  - file: mash-tun.svg
    alt: >-
      Cross-section schematic of a lauter-style mash tun: a domed
      cylindrical vessel with a drive gearbox on top turning a central
      shaft that carries a rotating rake; the rake stirs a bed of
      crushed grain (grist and husks) resting on a perforated false
      bottom; sweet wort drains through the bed and the plate into the
      sump below, then off to the washback. Grist and hot water enter
      near the top.
    caption: "The mash tun in cross-section: rake, grain-husk bed, false bottom."
    source_id: 1


# --- Sources ----------------------------------------------------------------
sources:
  - id: 1
    type: book
    citation: |
      Bringhurst, T.A., Harrison, B.M. & Brosnan, J., "Scotch
      whisky: raw material selection and processing", Chapter 10
      in Russell, I., Stewart, G. & Kellershohn, J. (eds.),
      Whisky and Other Spirits: Technology, Production and
      Marketing, 3rd edition, Academic Press (Elsevier), 2022.
    accessed: 2026-05-21
    notes: |
      Ch 10 (Bringhurst, Harrison & Brosnan), pp 173-181:
      mashing mixes the grist with liquor at a specific
      temperature (typically 63.5-64 degrees C) to gelatinise the
      starch and hydrolyse it to fermentable sugars; the three
      main mash-tun types (traditional, lauter / semi-lauter,
      mash filter) are described, with subsequent sparge waters
      typically at 70-90 degrees C. At least two distilleries
      operated a mash filter at the time of writing.
  - id: 2
    type: book
    citation: |
      Miller, G.H., Whisky Science: A Condensed Distillation,
      2nd edition, Springer International Publishing, 2024.
      ISBN 978-3-031-50686-4.
    accessed: 2026-05-21
    notes: |
      Miller Ch 4 (Mashing), p 199: lautering is the draining of
      wort from the mash through the grain-husk filter bed; mash
      filters are the modern industrial alternative for a
      hammer-milled grist and are used by Irish Distillers and
      Inchdairnie.


