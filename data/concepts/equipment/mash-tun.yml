  distinguishing_features: |
    The mashing vessel. Three types: the traditional
    rake-and-plough tun, the lauter / semi-lauter tun, and the
    mash filter (rare in Scotch malt whisky). The slotted false
    floor and the grain-husk bed together form the wort filter.
