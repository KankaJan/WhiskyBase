# --- Sources ----------------------------------------------------------------
sources:
  - id: 1
    type: book
    citation: |
      Conner, J., "Maturation", Chapter 16 in Russell, I.,
      Stewart, G. & Kellershohn, J. (eds.), Whisky and Other
      Spirits: Technology, Production and Marketing, 3rd edition,
      Academic Press (Elsevier), 2022.
    accessed: 2026-06-14
    notes: |
      Russell ed. 2022 Ch 16 (Conner, Maturation). Grounds: the firing of
      the cask interior as "probably the most important stage of barrel
      production as it defines the character the cask will confer"; the
      shell heated to ~230-260 degrees C for ~15 minutes to set the staves,
      then charred until the required degree of char is reached; the
      additive/subtractive framework; and char-mediated reduction of
      sulphur compounds (e.g. dimethyl disulphide) occurring largely in
      early maturation. Same chapter cited in glossary/char-and-toast.
  - id: 2
    type: book
    citation: |
      Miller, G.H., Whisky Science: A Condensed Distillation,
      2nd edition, Springer International Publishing, 2024.
      ISBN 978-3-031-50686-4.
    accessed: 2026-06-14
    notes: |
      Miller Ch 8 (Maturation): heat treatment of the cask interior
      greatly increases wood-derived flavour compounds available for
      extraction (vanillin in particular), and the carbonised layer
      contributes the subtractive, adsorptive side of maturation.
  - id: 3
    type: peer_reviewed_paper
    citation: |
      Mosedale, J. R. & Puech, J.-L. (1998), "Wood maturation of
      distilled beverages", Trends in Food Science & Technology,
      9(3), 95-101.
    url: https://doi.org/10.1016/S0924-2244(98)00024-7
    accessed: null
    notes: |
      Canonical review of oak-derived compounds in spirit maturation:
      the lignin breakdown products (vanillin and related aldehydes),
      caramelised hemicellulosic sugars and furanic compounds, and oak
      lactones referenced here as the products of heat treatment.
      Quantitative claims should be verified against the paper text.
  - id: 4
    type: trade_publication
    url: https://www.bestdrink.cz/news/proc-se-sudy-vypaluji/
    accessed: 2026-06-14
    notes: |
      Trade reference (in Czech) used for the char-level specifics not
      detailed in the book sources: the four American char levels with
      approximate burn times (~15 / 30 / 35 / 55 seconds for #1-4), the
      heaviest as "alligator" char, the char layer at roughly 2-4 mm, the
      toasting-versus-charring distinction, and the carbon layer acting as
      a filter that removes sulphur. The supporting chemistry rests on
      sources 1-3.


