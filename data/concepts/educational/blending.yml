      Whisky.
  - id: 2
    type: book
    citation: |
      Macleod, S.J., "Blending", Chapter 17 in Russell, I.,
      Stewart, G. & Kellershohn, J. (eds.), Whisky and Other
      Spirits: Technology, Production and Marketing, 3rd edition,
      Academic Press (Elsevier), 2022.
    accessed: 2026-05-21
    notes: |
      Ch 17 (Macleod, Blending): a blended Scotch whisky is a
      blend of one or more malt whiskies with one or more grain
      whiskies (pp 313-318); commercial blending began in the
      mid- to late-1800s with the introduction of continuous
      grain distillation; the blender's task is to meld disparate
      distillery characters into a balanced, consistent sensory
      profile held steady over long periods. Marrying is the
      traditional post-blending integration step.


