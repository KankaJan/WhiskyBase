# --- Identity ---------------------------------------------------------------
id: fermentation-overview
title: Fermentation (the production stage)
kind: educational


# --- Summary & Body ---------------------------------------------------------
summary: |
  Fermentation is the stage that converts the wort's sugars into alcohol and
  generates much of the spirit's flavour. Cooled wort is run into a washback
  and pitched with distiller's yeast; over roughly two to four days the yeast
  produces a low-strength "wash" of about 7-9% ABV, and in longer
  fermentations lactic acid bacteria add a second, flavour-shaping phase
  [1][2].


body: |
  This page covers fermentation as a process. The yeast organism and the
  commercial strains are covered in
  [yeast-strains](concept/educational/yeast-strains); the bare term is
  defined in [fermentation](concept/glossary/fermentation); the vessel in
  [washback](concept/equipment/washback).

  ## The washback

  Fermentation takes place in a washback: a large vessel of wood (Oregon
  pine / Douglas fir, or larch) or of stainless steel. Wooden washbacks are
  not sterilised between fills and carry a resident microflora — chiefly
  lactic acid bacteria — living in the timber, which becomes important in the
  second phase below. Stainless-steel washbacks are easier to clean and
  control but hold less resident bacteria [1].

  ## Pitching and the fermentation curve

  Wort is cooled to roughly 18-20 degrees C before it enters the washback:
  distiller's yeast is killed at the temperatures the mash itself ran at, so
  pitching into wort that is still hot would kill the culture [1][2]. Once
  pitched, the yeast first multiplies and then ferments in earnest,
  converting the wort sugars to ethanol and carbon dioxide and throwing off
  vigorous CO2 and foam. The reaction is exothermic, so the wash heats itself
  as it works — it can climb into the low-to-mid 30s degrees C in a
  traditional washback without external cooling [1][2]. Over roughly 48 hours
  the yeast brings the wash to about 7-9% ABV from a starting gravity around
  1050-1060.

  ## The two-phase fermentation: yeast, then bacteria

  A Scotch fermentation runs in two overlapping phases [1][2]:

  - **Primary (yeast).** The pitched *Saccharomyces cerevisiae* does the main
    work, converting sugar to ethanol and producing the first wave of
    congeners (esters, higher alcohols).
  - **Secondary (bacteria).** As the sugars deplete and the yeast declines,
    the pH falls and the washback's resident
    [lactic acid bacteria](concept/glossary/lactic-acid-bacteria) proliferate,
    producing lactic acid and further esters and fatty acids. This phase only
    develops materially once the yeast has finished — which is why
    fermentation length is a flavour decision, not only a throughput one.

  ## Fermentation time as a flavour lever

  Within the conventional 48 to 100-plus hour range, the duration a
  distillery chooses materially shapes character [1][2]:

  - **Short fermentations** (around 48 hours) keep the bacterial second phase
    brief and tend toward a heavier, more cereal and nutty, "spirity" new
    make.
  - **Long fermentations** (70 hours and beyond) give the lactic acid
    bacteria time to act, building the lighter, fruitier, more ester-driven
    character many producers seek.

  Fermentation time is recorded on each `production_line` entry; it is one of
  the few fermentation variables distilleries routinely disclose.

  ## Flavour: congeners first form here

  Fermentation is where most of the whisky's
  [congeners](concept/glossary/congener) first appear — the esters, higher
  alcohols, aldehydes and acids that the still then sorts and concentrates and
  that maturation reshapes. The classes of compound and their sensory
  associations are surveyed in
  [aromatic-compounds-in-whisky](concept/educational/aromatic-compounds-in-whisky).
  The finished [wash](concept/glossary/wash) is then charged to the wash still
  for the first distillation.

  ## See also

  - [whisky-production](concept/educational/whisky-production) — the master
    overview.
  - [yeast-strains](concept/educational/yeast-strains) — the yeast organism
    and the commercial strains.
  - [distillation](concept/educational/distillation) — the stage the wash
    feeds into.


