# --- Sources ----------------------------------------------------------------
sources:
  - id: 1
    type: book
    citation: |
      Russell, I., Stewart, G. & Kellershohn, J. (eds.), Whisky
      and Other Spirits: Technology, Production and Marketing,
      3rd edition, Academic Press (Elsevier), 2022.
    accessed: 2026-06-15
    notes: |
      Russell ed. 2022 Ch 12 (Russell & Stewart, distilling yeast and
      fermentation) and Ch 13 (Wilson, contamination): wort cooling and
      pitching temperature, the exothermic fermentation curve, the wash at
      ~7-9% ABV over ~48-100 h, and the two-phase yeast-then-lactic-acid-
      bacteria fermentation with its effect on ester development and
      fermentation-time character.
  - id: 2
    type: book
    citation: |
      Miller, G.H., Whisky Science: A Condensed Distillation,
      2nd edition, Springer International Publishing, 2024.
      ISBN 978-3-031-50686-4.
    accessed: 2026-06-15
    notes: |
      Miller Ch 5 (Fermentation): conversion of sugars to ethanol and CO2 by
      Saccharomyces cerevisiae, the role of lactic acid bacteria in longer
      fermentations (higher fatty acids and esters; lactobacilli "essential
      for the development of the perceived quality parameters of Scotch malt
      spirit", p 239) and the fruity gamma-lactone pathway (p 241); a
      representative wash at ~8% ABV.


