# --- Sources ----------------------------------------------------------------
sources:
  - id: 1
    type: book
    citation: |
      Mitchell, M., "Whisky global packaging developments",
      Chapter 18 in Russell, I. & Stewart, G. (eds.),
      Whisky: Technology, Production and Marketing, 2nd
      edition, Academic Press (Elsevier), 2014, pp 315-326.
    accessed: 2026-05-19
    notes: |
      Mitchell Ch 18 covers chill-filtration in the packaging
      preparation section, with the practice referenced at
      p 257 and the cross-reference to Aylott's Ch 14 (whisky
      analysis) for the fatty-acid-ester chemistry. Aylott
      Ch 14 (pp 243-269) covers the underlying composition
      (fatty acid esters as the haze-forming compounds) and
      the chill-filtration mechanism at p 231 in the
      whisky-stability subsection. The 46% ABV producer-empirical
      threshold is project-attributed rather than Russell-
      attributed; the chemistry the threshold rests on
      (precipitation of fatty acid esters at cool serving
      temperatures) is grounded in Aylott Ch 14.

  - id: 2
    type: peer_reviewed_paper
    citation: |
      Conner, J. M., Reid, K. J. G., Jack, F. (2003), "Effect of
      chill-filtration on the flavour and stability of Scotch
      whisky", in Bryce, J. H. & Stewart, G. G. (eds.), Distilled
      Spirits: Tradition and Innovation, Nottingham University
      Press.
    accessed: null
    notes: |
      Conference proceedings chapter from the Worldwide
      Distilled Spirits Conference series. Standard
      Scotch-industry source on chill-haze chemistry and
      filtration effects. The conference-proceedings format
      means access requires the published volume; the
      citation should be verified against the actual chapter
      text when accessed.

  - id: 3
    type: peer_reviewed_paper
    citation: |
      Conner, J. M., Paterson, A., Piggott, J. R. (1998),
      "Interactions between ethyl esters and aroma compounds in
      model spirit solutions", Journal of Agricultural and Food
      Chemistry, 42(10), 2231-2234 (1994 paper; mentioned here
      for the underlying ester-interaction chemistry that
      informs chill-filtering sensory studies).
    accessed: null
    notes: |
      The 1994 Conner et al. paper on ethyl ester / aroma
      interactions provides the model-solution background for
      subsequent chill-filtering sensory work. Cited as one of
      the most-relevant peer-reviewed chemistry references for
      this entry's flavour-effect claims.

  - id: 4
    type: regulatory_text
    url: https://www.legislation.gov.uk/uksi/2009/2890/contents
    accessed: 2026-05-16
    notes: |
      The Scotch Whisky Regulations 2009 do not regulate the
      chill-filtering process directly. The 40% ABV minimum
      bottling strength (reg 6) sets the lower bound below which
      the spirit may not be sold as Scotch; chill-filtering is a
      producer choice within that framework.


