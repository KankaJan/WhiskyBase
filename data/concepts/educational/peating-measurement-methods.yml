sources:
  - id: 1
    type: trade_publication
    url: https://scotchwhisky.com/magazine/latest-news/15546/octomore-08-3-is-world-s-peatiest-scotch/
    accessed: 2026-05-02
    notes: |
      Trade press article reporting Octomore 8.3 release with
      explicit producer-attributed disclosure of HPLC method and
      acknowledgement that method affects PPM figures.

  - id: 2
    type: other
    url: https://bvsolutions.freshdesk.com/en/support/solutions/articles/43000513822-what-is-the-difference-between-phenols-by-4aap-vs-gcms-methods-
    accessed: 2026-05-02
    notes: |
      Bureau Veritas technical note on 4-AAP vs GC-MS methods.
      Used for documentation of 4-AAP's known limitations:
      non-detection of para-substituted alkyl phenols, variable
      recovery for substituted phenols, colorimetric interference.

  - id: 3
    type: other
    url: https://pubmed.ncbi.nlm.nih.gov/18962987/
    accessed: 2026-05-02
    notes: |
      Peer-reviewed study comparing 4-AAP and UV-ratio
      spectrophotometric methods across 36 phenolic compounds.
      Used for the 0-100% recovery range citation. Older paper
      but the chemistry has not changed; the recovery
      characteristics of 4-AAP for substituted phenols remain
      a known limitation.


