# --- Identity ---------------------------------------------------------------
id: maturation
title: Maturation
kind: educational


# --- Summary & Body ---------------------------------------------------------
summary: |
  Maturation is the years-long stage in which new-make spirit
  rests in oak casks and becomes whisky. By law Scotch whisky must
  mature for at least three years, in oak casks of no more than
  700 litres, in Scotland. During maturation the cask adds
  compounds extracted from the oak, removes or transforms harsher
  spirit compounds, and admits slow oxidation; the cask is the
  single largest influence on the flavour and the colour of the
  finished whisky.

body: |
  This page is an overview of maturation. The chemistry and the
  cask-level detail live in the linked pages.

  ## What the cask does

  Maturation is not simple storage. Three broad processes act on
  the spirit in the cask [1][3]:

  - **Additive** — colour and flavour compounds are extracted
    from the oak (vanillin, oak lactones, tannins and others),
    their concentrations raised by the charring or toasting of
    the cask.
  - **Subtractive** — harsher, more volatile spirit compounds are
    lost or transformed, including some sulphur compounds.
  - **Oxidative** — slow interaction with air through the cask
    contributes further change.

  The rate and balance of these processes are the subject of
  [cask-maturation-kinetics](concept/educational/cask-maturation-kinetics);
  the effect of how full the cask is filled is covered by
  [cask-fill-states](concept/educational/cask-fill-states).

  ## Casks and warehouses

  The cask itself — its wood, its previous contents, whether it
  is a first fill or a refill — is the dominant variable; the
  project's cask entries document the individual cask types. The
  building the cask rests in matters too: see
  [warehousing](concept/educational/warehousing) for the
  dunnage / racked / palletised warehouse types and their effect
  on evaporative loss.

  ## The legal minimum

  Under the Scotch Whisky Regulations 2009, spirit may be called
  Scotch whisky only after maturing for at least three years in
  oak casks not exceeding 700 litres, stored in Scotland [2].
  New-make spirit below that age is not whisky.

  ## See also

  - [cask-maturation-kinetics](concept/educational/cask-maturation-kinetics)
    — the extraction kinetics and the contested-claims section.
  - [warehousing](concept/educational/warehousing) — where casks
    are stored to mature.


