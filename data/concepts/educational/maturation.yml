# --- Sources ----------------------------------------------------------------
sources:
  - id: 1
    type: book
    citation: |
      Conner, J., "Maturation", Chapter 16 in Russell, I.,
      Stewart, G. & Kellershohn, J. (eds.), Whisky and Other
      Spirits: Technology, Production and Marketing, 3rd edition,
      Academic Press (Elsevier), 2022.
    accessed: 2026-05-21
    notes: |
      Ch 16 (Conner, Maturation): casks are filled with spirit
      and set aside in a warehouse to mature, but a wide range of
      variables influence the matured whisky; maturation is not a
      homogeneous process. Covers the additive extraction of wood
      constituents, the role of cask type and fill, and warehouse
      conditions.
  - id: 2
    type: regulatory_text
    url: https://www.legislation.gov.uk/uksi/2009/2890/regulation/3
    accessed: 2026-05-21
    notes: |
      The Scotch Whisky Regulations 2009, regulation 3: Scotch
      whisky must be matured in Scotland in oak casks of capacity
      not exceeding 700 litres for a period of at least three
      years.
  - id: 3
    type: book
    citation: |
      Miller, G.H., Whisky Science: A Condensed Distillation,
      2nd edition, Springer International Publishing, 2024.
      ISBN 978-3-031-50686-4.
    accessed: 2026-05-21
    notes: |
      Miller Ch 8 (Maturation) treats the chemistry of maturation
      independently of Russell — the additive extraction of oak
      compounds (raised by cask charring/toasting), the
      transformation and loss of spirit compounds, and oxidative
      change — corroborating the additive / subtractive /
      oxidative framing of this overview.


