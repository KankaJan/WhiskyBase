id: fermentation
title: Fermentation
kind: educational


# --- Summary & Body ---------------------------------------------------------
summary: |
      Fermentation is the stage that converts the wort's sugars
      into alcohol. Cooled wort is run into a washback, pitched with
      distiller's yeast, and fermented over several days into a
      low-strength wash ready for distillation.


body: |
      Fermentation turns the sugary wort into an alcoholic wash.
      This page is the overview.
      
      ## In the washback
      
      Cooled [wort](concept/glossary/wort) is run into a
      [washback](concept/equipment/washback) and pitched with
      [distiller's yeast](concept/glossary/distillers-yeast). The
      general process is defined in
      [fermentation](concept/glossary/fermentation): the yeast
      metabolises the sugars into ethanol and carbon dioxide over
      roughly two to four days, producing a [wash](concept/glossary/wash)
      of about 7-9% ABV.
      
      ## Bacteria and flavour development
      
      The wort is not sterile and the wooden washbacks are not
      sterilised, so [lactic acid bacteria](concept/glossary/lactic-acid-bacteria)
      are active alongside the yeast — particularly in longer
      fermentations, after the yeast has done its primary work — and
      contribute to character. Fermentation is where many of the
      whisky's [congeners](concept/glossary/congener) first form; the
      classes of flavour compound are surveyed in
      [aromatic-compounds-in-whisky](concept/educational/aromatic-compounds-in-whisky).
      
      ## See also
      
      - [whisky-production](concept/educational/whisky-production) —
        the master overview.
      - [distillation](concept/educational/distillation) — the stage
        the wash feeds into.



