# --- Sources ----------------------------------------------------------------
sources:
  - id: 1
    type: book
    citation: |
      Nicol, D.A., "Batch distillation", Chapter 14 in
      Russell, I., Stewart, G. & Kellershohn, J. (eds.),
      Whisky and Other Spirits: Technology, Production and
      Marketing, 3rd edition, Academic Press (Elsevier), 2022,
      pp 247-271.
    accessed: 2026-05-20
    notes: |
      Ch 14 (Nicol), pp 255-256: the spirit safe (introduced
      circa 1823 at Port Ellen, locked, monitors cut point,
      strength and temperature); the two collecting bowls for
      foreshots-and-feints and for potable spirit; the demisting
      test (foreshots diluted to 46% ABV, turbid-to-clear marking
      the primary cut point); the second cut point chosen by
      bouquet and strength, usually 68-70% ABV; and the practice
      at some distilleries of abandoning the demisting test to
      capture more congeners. Foreshots and feints are recycled
      into the next spirit-still charge.
  - id: 2
    type: book
    citation: |
      Miller, G.H., Whisky Science: A Condensed Distillation,
      2nd edition, Springer International Publishing, 2024.
      ISBN 978-3-031-50686-4.
    accessed: 2026-05-20
    notes: |
      Miller Ch 6-7 (Distillation): the distillate strength and
      composition change continuously through a batch run, and
      congeners distribute across the run by volatility — the
      basis on which heads / heart / tails differ. Ch 7's batch
      (Rayleigh) distillation analysis models the falling
      distillate strength that the cut points track.


