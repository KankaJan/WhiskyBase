# --- Sources ----------------------------------------------------------------
sources:
  - id: 1
    type: peer_reviewed_paper
    citation: |
      Mosedale, J. R. & Puech, J.-L. (1998), "Wood maturation of
      distilled beverages", Trends in Food Science & Technology,
      9(3), 95-101.
    url: https://doi.org/10.1016/S0924-2244(98)00024-7
    accessed: 2026-06-15
    notes: |
      Canonical review of oak-derived compounds in spirit maturation;
      grounds the species-differentiated extractable chemistry (oak
      lactones and vanillin from lignin, hydrolysable ellagitannins).
      The directional species claims (American oak higher in oak
      lactone and vanillin, European oak higher in ellagitannins) are
      corroborated by cooperage and enology literature; quantitative
      specifics should be verified against the paper text. Also cited
      in educational/cask-charring-and-toasting and
      educational/cask-maturation-kinetics.
  - id: 2
    type: book
    citation: |
      Conner, J., "Maturation", Chapter 16 in Russell, I.,
      Stewart, G. & Kellershohn, J. (eds.), Whisky and Other
      Spirits: Technology, Production and Marketing, 3rd edition,
      Academic Press (Elsevier), 2022.
    accessed: 2026-06-15
    notes: |
      Russell ed. 2022 Ch 16 (Conner, Maturation): American (ex-bourbon,
      Q. alba) and European (sherry, Q. robur / Q. petraea) oak as the
      two cask woods of Scotch and their contrasting flavour
      contributions; the bourbon new-charred-oak requirement as the
      source of single-use American barrels.
  - id: 3
    type: peer_reviewed_paper
    citation: |
      Kim, D. et al. (2024), "Detailed three-dimensional analyses of
      tyloses in oak used for bourbon and wine barrels through X-ray
      computed tomography", Scientific Reports, 14, 17044.
    url: https://doi.org/10.1038/s41598-024-67298-x
    accessed: 2026-06-15
    notes: |
      X-ray computed-tomography quantification of tyloses in cooperage
      oak; Quercus alba shows the highest tylose volume, the structural
      basis for its watertightness when sawn. PMID 39048642.
  - id: 4
    type: trade_publication
    url: https://www.worldcooperage.com/oak-species-for-cooperage/
    accessed: 2026-06-15
    notes: |
      Cooperage-industry reference on oak species. Used for the practical
      consequence of tyloses: American oak can be quarter-sawn and stay
      watertight (more staves per log), whereas European oak must be
      split along the grain to avoid leakage. The underlying tyloses
      mechanism rests on source 3.
  - id: 5
    type: trade_publication
    url: https://www.edinburghwhiskyacademy.com/blogs/shortcut/shortcut-mizunara-oak
    accessed: 2026-06-15
    notes: |
      Whisky-education reference used for the Mizunara specifics:
      Japanese oak (Quercus crispula, related to Q. mongolica), highly
      porous and low in tyloses ("water oak"), leak-prone and difficult
      to cooper, and its sandalwood / incense character. A trade source;
      botanical naming (Q. crispula vs Q. mongolica) varies across
      references and should be treated as approximate.


