# --- Identity ---------------------------------------------------------------
id: malting
title: Malting
kind: educational


# --- Summary & Body ---------------------------------------------------------
summary: |
      Malting is the first production stage: raw barley is
      converted into malt — grain whose starch-converting enzymes have
      been developed and whose endosperm has been opened up ready for
      mashing. It runs in three steps — steeping, germination and
      kilning — and is the stage at which peated character, where
      wanted, is taken on.


body: |
      Malting turns raw barley into the malt that the rest of the
      process needs. This page is the overview; each step has its own
      page.
      
      ## The three steps
      
      - **[Steeping](concept/glossary/steeping)** — the barley is
        soaked in water to raise its moisture and trigger germination.
      - **[Germination](concept/glossary/germination)** — the steeped
        grain is allowed to sprout under controlled conditions,
        developing the enzymes and modifying the endosperm; the
        germinated, undried grain is green malt.
      - **[Kilning](concept/glossary/kiln)** — heat dries the green
        malt, halting germination and fixing the malt; the staged kiln
        temperatures also develop colour and flavour.
      
      The enzyme capacity built up during malting — its
      [diastatic power](concept/glossary/diastatic-power) — is what
      will convert starch to sugar at the [mashing](concept/educational/mashing)
      stage.
      
      ## How and where it is done
      
      Malting can be done on a traditional malting floor
      ([floor malting](concept/practice/floor-malting)) or
      mechanically ([pneumatic malting](concept/practice/pneumatic-malting)
      — the drum and Saladin-box methods). Most distilleries buy their
      malt in from commercial maltings rather than malt on site — see
      [external malting](concept/practice/external-malting).
      
      ## Peated malt
      
      Where smoky character is wanted, [peat](concept/glossary/peat) is
      burned during kilning and its phenolic smoke is deposited on the
      malt. The resulting peating level is the subject of
      [the peating block](concept/glossary/peating-block) and
      [peating-measurement-methods](concept/educational/peating-measurement-methods).
      
      ## See also
      
      - [whisky-production](concept/educational/whisky-production) —
        the master overview.
      - [mashing](concept/educational/mashing) — the stage malt feeds
        into.



