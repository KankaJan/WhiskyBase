    notes: |
      Ch 16 (Conner), "Warehouse types", pp 305-307: dunnage
      warehouses (stows two or three high on wooden runners,
      humidity dependent on soil and water table); multi-storey
      racked warehouses (steel racking up to twelve rows high);
      palletised storage (casks on end on pallets, up to eight
      high, efficient but with higher evaporative losses and
      lower extractives). Warehouse temperature and humidity
      influence evaporative loss, with an inverse
      temperature-humidity relationship within a warehouse;
      warehouse operation is largely the result of tradition
      rather than design.
  - id: 2
