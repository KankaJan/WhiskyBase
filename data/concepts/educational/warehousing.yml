id: warehousing
title: Warehousing
kind: educational


# --- Summary & Body ---------------------------------------------------------
summary: |
  Warehousing is the storage of filled casks through maturation.
  Three warehouse types are in use in Scotland: traditional
  dunnage warehouses (casks stacked two or three high on wooden
  runners, on earth or stone floors); racked warehouses (steel
  racking holding casks on their sides, up to about twelve rows
  high); and palletised warehouses (casks stood on end on pallets,
  stacked up to eight high). Warehouse type, temperature and
  humidity influence the rate of evaporative loss and the balance
  of compounds the maturing spirit takes up.

body: |
  Casks spend the years of [maturation](concept/educational/maturation)
  in a warehouse, and the warehouse is itself a maturation
  variable.

  ## The three warehouse types

  Russell records three warehouse types in current Scottish use
  [1]:

  - **Dunnage** — the traditional form: brick or stone walls,
    earth or stone floors, casks stacked two or three high on
    their sides with wooden runners between the layers. Humidity
    depends partly on the surrounding soil and water table.
  - **Racked** — large multi-storey buildings with steel racking
    that holds casks on their sides in long parallel rows,
    extending up to about twelve rows high.
  - **Palletised** — casks stood on their ends on pallets and
    stacked up to eight high with forklift trucks. Palletised
    storage is efficient for cask handling and warehouse
    capacity, but Russell notes it can give higher evaporative
    losses and lower levels of extractives.

  ## Climate and the angel's share

  Warehouse temperature and humidity influence evaporative loss —
  the "angel's share" — and there is an inverse relationship
  within a warehouse between temperature and humidity [1][2]. The
  warehouse environment is one of the variables that
  [cask-maturation-kinetics](concept/educational/cask-maturation-kinetics)
  treats in detail; Russell is explicit that warehouse operation
  has largely been shaped by tradition rather than by design and
  calculation [1].

  ## See also

  - [maturation](concept/educational/maturation) — the stage
    warehousing serves.


