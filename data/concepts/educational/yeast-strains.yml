# --- Sources ----------------------------------------------------------------
sources:
  - id: 1
    type: book
    citation: |
      Russell, I. & Stewart, G., "Distilling yeast and
      fermentation", Chapter 7 in Russell, I. & Stewart, G.
      (eds.), Whisky: Technology, Production and Marketing,
      2nd edition, Academic Press (Elsevier), 2014, pp 123-145.
    accessed: 2026-06-15
    notes: |
      Russell & Stewart Ch 7: yeast strain selection, the
      distilling-versus-brewing distinction, congener development
      (p 139) and wort fermentation (p 141). Carried over from
      glossary/distillers-yeast, where this page's content
      previously lived.
  - id: 2
    type: book
    citation: |
      Miller, G.H., Whisky Science: A Condensed Distillation,
      2nd edition, Springer International Publishing, 2024.
      ISBN 978-3-031-50686-4.
    accessed: 2026-06-15
    notes: |
      Miller Ch 5 (Fermentation), section 5.1 Yeast, p 219:
      "The majority of scotch whisky distillers use a commercial
      yeast derived from the Distillers Company 'M' strain ...
      high-attenuating fast-fermenting." Distiller's wort retains
      residual amylase activity from malting whereas a brewer's
      boiled wort does not. LAB role in fruity-ester development
      pp 239-241.
  - id: 3
    type: peer_reviewed_paper
    citation: |
      Daute, M., Jack, F. & Walker, G.M., "The potential for Scotch
      Malt Whisky flavour diversification by yeast", FEMS Yeast
      Research, vol. 24, 2024, article foae017.
      DOI: 10.1093/femsyr/foae017.
    accessed: 2026-06-15
    notes: |
      Open-access (CC-BY) review co-authored by Frances Jack (Scotch
      Whisky Research Institute). Names the industry-standard strains:
      the M-type with MX (Kerry Bio-Science), Pinnacle (Mauri/AB
      Biotek), and DistillaMax (Lallemand); gives the M-type origin
      (an interspecies S. cerevisiae x S. cerevisiae var. diastaticus
      hybrid introduced by DCL Yeast Ltd in 1952, now Kerry); and
      reviews flavour diversification through strain choice. (The paper
      spells the Lallemand product "DistillaMax"; the producer brand
      spelling is "DistilaMax".)


