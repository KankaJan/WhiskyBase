sources:
  - id: 1
    type: book
    citation: |
      Russell, I., Stewart, G. & Kellershohn, J. (eds.), Whisky
      and Other Spirits: Technology, Production and Marketing,
      3rd edition, Academic Press (Elsevier), 2022.
    accessed: 2026-05-21
    notes: |
      Russell ed. 2022 covers the whole production chain across
      its chapters (raw materials and processing, water, distilling
      yeast and fermentation, batch and grain distillation,
      maturation, blending) — the structure this overview follows.
  - id: 2
    type: book
    citation: |
      Miller, G.H., Whisky Science: A Condensed Distillation,
      2nd edition, Springer International Publishing, 2024.
      ISBN 978-3-031-50686-4.
    accessed: 2026-05-21
    notes: |
      Miller Ch 3-8 trace the same chain — malting, mashing,
      fermentation, distillation, maturation — as a connected
      physical and chemical process.


