sources:
  - id: 1
    type: book
    citation: |
      Conner, J., "Maturation", Chapter 16 in Russell, I.,
      Stewart, G. & Kellershohn, J. (eds.), Whisky and Other
      Spirits: Technology, Production and Marketing, 3rd edition,
      Academic Press (Elsevier), 2022.
    accessed: 2026-06-14
    notes: |
      Russell ed. 2022 Ch 16 (Conner, Maturation), cooperage and
      cask-manufacture sections. Grounds: American oak (Quercus alba)
      and European oak (Q. robur / Q. petraea); most ex-bourbon barrels
      reaching Scotland as American Standard Barrels (~190 L) or rebuilt
      as hogsheads (~250 L); the shell being heated to set the staves and
      then charred, this firing being "probably the most important stage
      of barrel production as it defines the character the cask will
      confer"; and cask regeneration (scraping and re-charring). The same
      chapter is cited in glossary/oak and glossary/char-and-toast.
  - id: 2
    type: book
    citation: |
      Miller, G.H., Whisky Science: A Condensed Distillation,
      2nd edition, Springer International Publishing, 2024.
      ISBN 978-3-031-50686-4.
    accessed: 2026-06-14
    notes: |
      Miller Ch 8 (Maturation), "The Structure of Oak and Casks":
      quarter-sawing and the role of tyloses in making oak watertight;
      stave seasoning; and heat treatment of the cask interior raising
      the wood-derived flavour compounds available for later extraction.
  - id: 3
    type: trade_publication
    url: https://www.bestdrink.cz/news/proc-se-sudy-vypaluji/
    accessed: 2026-06-14
    notes: |
      Trade reference (in Czech) corroborating the practical
      refurbishment detail: a cask's charring/flavour capacity tires
      after about three to four refills for Scotch / Irish whiskey, after
      which "rejuvenation" — sanding/scraping the interior and
      re-charring — restores an active layer. Used for the
      refurbishment-cycle specifics rather than the cooperage chemistry,
      which rests on sources 1-2.


