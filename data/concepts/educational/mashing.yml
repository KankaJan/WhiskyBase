# --- Identity ---------------------------------------------------------------
id: mashing
title: Mashing
kind: educational


# --- Summary & Body ---------------------------------------------------------
summary: |
      Mashing is the stage that extracts fermentable sugars
      from the malt. The malt is milled to grist, mixed with hot water
      in a mash tun so its enzymes convert the starch to sugar, and the
      sweet liquid — wort — is drained off ready for fermentation.


body: |
      Mashing is where the malt's starch becomes the sugar that
      yeast will later ferment. This page is the overview.
      
      ## Milling
      
      First the malt is [milled](concept/glossary/milling) into grist —
      cracked into husk, grits and flour in a controlled ratio, the
      husk kept intact to form a filter bed later.
      
      ## In the mash tun
      
      The grist is mixed with hot water in the
      [mash tun](concept/equipment/mash-tun). At the mashing
      temperature the starch gelatinises and the malt's enzymes carry
      out [saccharification](concept/glossary/saccharification) — the
      conversion of starch into fermentable sugars. The conversion
      depends on the malt's [diastatic power](concept/glossary/diastatic-power).
      The general process is defined in [mashing](concept/glossary/mashing).
      
      ## Drawing off the wort
      
      The sweet liquid is separated from the spent grains by
      [lautering](concept/glossary/lautering) — drained through the
      husk filter bed — and further hotter [water](concept/glossary/water)
      sparges recover the remaining extract. The result is
      [wort](concept/glossary/wort), which is cooled and run to the
      washback for [fermentation](concept/educational/fermentation).
      
      ## See also
      
      - [whisky-production](concept/educational/whisky-production) —
        the master overview.
      - [malting](concept/educational/malting) — the stage before.



