# --- Sources ----------------------------------------------------------------
sources:
  - id: 1
    type: book
    citation: |
      Nicol, D.A., "Batch distillation", Chapter 14 in
      Russell, I., Stewart, G. & Kellershohn, J. (eds.),
      Whisky and Other Spirits: Technology, Production and
      Marketing, 3rd edition, Academic Press (Elsevier), 2022,
      pp 247-271.
    accessed: 2026-05-20
    notes: |
      Ch 14 (Nicol) reviews the history and design of stills, the
      construction of stills and ancillary equipment, and the
      operation of wash and spirit stills, including the
      double / triple distillation of fermented mash.
  - id: 2
    type: book
    citation: |
      Miller, G.H., Whisky Science: A Condensed Distillation,
      2nd edition, Springer International Publishing, 2024.
      ISBN 978-3-031-50686-4.
    accessed: 2026-05-20
    notes: |
      Miller Ch 6-7 treat distillation as a liquid-vapour phase
      separation: Ch 7 (Distillation Theory) develops the
      vapour-liquid equilibrium and batch (Rayleigh) distillation
      analysis; Ch 6 covers still shape and reflux. The
      ethanol-water azeotrope and the volatility basis of the
      separation are standard physical chemistry.


