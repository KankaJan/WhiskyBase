# --- Identity ---------------------------------------------------------------
id: single-cask
title: Single cask
kind: glossary


# --- Summary & Body ---------------------------------------------------------
summary: |
  A "single cask" release is a bottling drawn from one individual
  cask, with no vatting (combining of multiple casks) before
  bottling. The Scotch Whisky Regulations 2009 do not define
  "single cask" as a regulated label term [1]; the term is industry
  convention, used predominantly by independent bottlers (Cadenhead's
  Authentic Collection, Signatory Cask Strength Collection, Gordon
  & MacPhail Connoisseurs Choice, and many smaller IBs) and by
  distilleries for limited single-cask programmes. Single-cask
  releases typically disclose the cask number and the outturn
  (number of bottles produced from the cask); the small outturn
  (200-600 bottles is typical for a refill cask, larger for a
  first-fill) means each cask release is its own micro-edition
  rather than a reproducible product. The complementary concept is
  "vatting" (see glossary/vatting), in which multiple casks are
  combined to produce a larger, more consistent release.


