# --- Identity ---------------------------------------------------------------
id: fermentation
title: Fermentation
kind: glossary


# --- Summary & Body ---------------------------------------------------------
summary: |
  Fermentation in Scotch malt whisky production is the conversion
  of mash-derived sugars (predominantly maltose and other malt
  sugars from the barley) into ethanol and carbon dioxide by yeast
  (typically Saccharomyces cerevisiae cultivated as "distiller's
  yeast"). The fermentation takes place in washbacks — tanks of
  Oregon pine, larch, Douglas fir, or stainless steel — over
  periods conventionally between 48 and 100+ hours, producing a
  wash of around 7-9% ABV that is then distilled. Fermentation
  duration is a producer-controlled variable that materially
  affects the final spirit character: longer fermentations
  (notably 70+ hours) generate more secondary fruit-ester
  congeners through extended bacterial activity after the yeast
  has completed its primary work [1][2].

