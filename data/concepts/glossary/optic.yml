id: optic
title: Optic
kind: glossary


# --- Summary & Body ---------------------------------------------------------
summary: |
  Optic is a spring two-row malting barley variety bred by the
  Scottish Crop Research Institute (SCRI, now the James Hutton
  Institute) at Invergowrie, registered for UK commercial cultivation
  in the mid-1990s and approved by the Institute of Brewing &
  Distilling for malt distilling [1]. Optic was the dominant
  malting variety in Scotch malt production from the late 1990s
  through the 2000s before being displaced by Concerto from
  approximately 2012 onward. Optic remains in cultivation as a
  legacy / contractual variety at a smaller scale; some
  distilleries (including Springbank's Longrow and Hazelburn lines)
  retain Optic alongside Concerto.


