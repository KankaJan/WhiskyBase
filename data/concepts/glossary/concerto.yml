id: concerto
title: Concerto
kind: glossary


# --- Summary & Body ---------------------------------------------------------
summary: |
  Concerto is a spring two-row malting barley variety bred by
  Syngenta Seeds, registered for commercial use in the late 2000s
  and approved by the Institute of Brewing & Distilling (IBD) for
  malt distilling [1]. From roughly 2012 onward Concerto became
  the dominant variety in Scotch malt production, replacing Optic
  as the standard high-yield malting barley grown in Scotland and
  northern England. Concerto remains in commercial cultivation
  alongside newer varieties (Propino, Laureate) that compete or
  succeed it on yield, malting quality, and disease resistance.
  Concerto is the most common variety value in WhiskyBase
  production_line.malt.variety fields, recorded across 5+ lines
  (Bruichladdich Bruichladdich, Port Charlotte, Glenmorangie
  Original, Harris The Hearach, Lagavulin, Springbank's three
  lines).


