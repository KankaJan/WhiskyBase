# --- Sources ----------------------------------------------------------------
sources:
  - id: 1
    type: book
    citation: |
      Bringhurst, T.A. & Brosnan, J., "Scotch whisky: raw
      material selection and processing", Chapter 6 in
      Russell, I. & Stewart, G. (eds.), Whisky: Technology,
      Production and Marketing, 2nd edition, Academic Press
      (Elsevier), 2014, pp 49-121.
    accessed: 2026-05-19
    notes: |
      Kilning temperature for pot still malt grounded at p 58
      (max ~72 °C per Bringhurst & Brosnan, citing Dolan 2003);
      compared with brewing malt at 75-80 °C and grain-distilling
      malt much lower at 50 °C (citing Bathgate & Cook 1989).
      The peating subsection on pp 58-59 covers the
      cold-smoking-versus-drying interaction with kilning and
      the deposition of phenols, cresols, guaiacols, and
      polyphenols on the malt husk during the kilning stage.
  - id: 2
    type: book
    citation: |
      Miller, G.H., Whisky Science: A Condensed Distillation,
      2nd edition, Springer International Publishing, 2024.
      ISBN 978-3-031-50686-4.
    accessed: 2026-05-20
    notes: |
      Miller Chapter 3 (Malting), section 3.3 Kilning, pp 151-152.
      Independently corroborates the entry's core claims. States the
      purpose of kilning as terminating germination and removing
      moisture, and gives the staged kiln-air-temperature profile:
      50-60 C while malt moisture exceeds ~12% (the low-temperature,
      high-moisture regime in which phenol uptake from peat is most
      efficient), rising to 65-75 C until moisture reaches 5-8%, then
      85-105 C for final drying (moisture <=~4%) and curing. Miller's
      final-moisture figure (<=~4%) sits just below the entry's ~4-5%;
      both are within the disclosed range. Confirms kilning temperature
      and the timing of peat-smoke introduction as control variables.


