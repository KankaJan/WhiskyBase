# --- Sources ----------------------------------------------------------------
sources:
  - id: 1
    type: book
    citation: |
      Bringhurst, T.A. & Brosnan, J., "Scotch whisky: raw
      material selection and processing", Chapter 6 in
      Russell, I. & Stewart, G. (eds.), Whisky: Technology,
      Production and Marketing, 2nd edition, Academic Press
      (Elsevier), 2014, pp 49-121.
    accessed: 2026-05-19
    notes: |
      Kilning temperature for pot still malt grounded at p 58
      (max ~72 °C per Bringhurst & Brosnan, citing Dolan 2003);
      compared with brewing malt at 75-80 °C and grain-distilling
      malt much lower at 50 °C (citing Bathgate & Cook 1989).
      The peating subsection on pp 58-59 covers the
      cold-smoking-versus-drying interaction with kilning and
      the deposition of phenols, cresols, guaiacols, and
      polyphenols on the malt husk during the kilning stage.


