# --- Identity ---------------------------------------------------------------
id: kiln
title: Kiln
kind: glossary


# --- Summary & Body ---------------------------------------------------------
summary: |
  A kiln is the heated drying chamber in which germinated malted
  barley is dried at the end of the malting process. Kilning halts
  germination, drives moisture out of the green malt down to ~4-5%,
  and — when peat smoke is introduced into the air stream — deposits
  phenolic compounds on the husk that survive into the finished
  spirit as the source of "peated" character [1][2]. Kilning
  temperature, duration, and the timing of peat-smoke introduction
  are the principal control variables for the peating level of a
  Scotch malt and for the colour and roast notes that develop in
  the kilned malt. Modern industrial maltings use indirect-fired
  kilns with separately controlled peat-smoke generators; a small
  number of distilleries retain on-site floor-malting and operate
  traditional pagoda-roofed kilns directly above the malting floor.
  The surviving on-site malting practice is concentrated among older
  distilleries and revivalist operations; commonly-cited current
  examples include Springbank, Highland Park, Bowmore, Laphroaig,
  and Balvenie (the last for a small percentage of its malt only).

