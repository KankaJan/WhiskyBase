# --- Identity ---------------------------------------------------------------
id: wort
title: Wort
kind: glossary


# --- Summary & Body ---------------------------------------------------------
summary: |
      Wort is the sugary liquid drawn off the mash tun — the
      feedstock for fermentation. Milled malt (grist) is mixed with hot
      water in the mash tun, where the malt's enzymes convert starch
      into fermentable sugars; the resulting sweet liquid is drained
      off through the bed of spent grain husks, leaving the solids
      behind. Wort is cooled and run to the washback, where distiller's
      yeast ferments it into wash. Unlike brewing wort, malt-distilling
      wort is not boiled, so it carries active enzymes and live
      micro-organisms forward into fermentation [1][2].


body: null


