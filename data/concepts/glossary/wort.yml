# --- Sources ----------------------------------------------------------------
sources:
  - id: 1
    type: book
    citation: |
      Nicol, D.A., "Batch distillation", Chapter 14 in
      Russell, I., Stewart, G. & Kellershohn, J. (eds.),
      Whisky and Other Spirits: Technology, Production and
      Marketing, 3rd edition, Academic Press (Elsevier), 2022,
      pp 247-271.
    accessed: 2026-05-20
    notes: |
      Russell ed. 2022 Ch 14 (Nicol) describes wash, the
      fermented product of wort, charged to the wash still at an
      original gravity of 1050-1060 degrees (12.5-15 degrees Plato),
      p 257 — the gravity figure is the wort's fermentable-sugar
      content carried into the wash.

  - id: 2
    type: book
    citation: |
      Miller, G.H., Whisky Science: A Condensed Distillation,
      2nd edition, Springer International Publishing, 2024.
      ISBN 978-3-031-50686-4.
    accessed: 2026-05-20
    notes: |
      Miller Ch 4 (Mashing) defines wort as the sugar-rich
      fermentable liquid produced by mashing, the broken malt grist
      mixed with hot water to gelatinise and enzymatically convert the
      starch, with the wort then separated from spent grains by
      filtration through the husk bed (pp 187, 199). Miller Ch 5
      (Fermentation) notes distiller's wort retains residual amylase
      activity from malting whereas a brewer's boiled wort does not
      (p 219).


