# --- Identity ---------------------------------------------------------------
id: congener
title: Congener
kind: glossary


# --- Summary & Body ---------------------------------------------------------
summary: |
  A congener is any of the many compounds, other than ethanol and
  water, that occur in whisky and give it flavour, aroma and
  colour. Congeners include the higher (fusel) alcohols, esters,
  aldehydes, organic acids, phenols and sulphur compounds. They
  arise mainly from yeast metabolism during fermentation, are
  concentrated and sorted by volatility in the distillation cut,
  and are added to and transformed during maturation. It is
  the congener profile, far more than the ethanol, that gives a
  whisky its character and that maturation reshapes [1][2].

body: null


