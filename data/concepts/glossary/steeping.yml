# --- Identity ---------------------------------------------------------------
id: steeping
title: Steeping
kind: glossary


# --- Summary & Body ---------------------------------------------------------
summary: |
      Steeping is the first stage of malting: barley is soaked in
      water to raise its moisture content and trigger germination.
      Steeping lifts the grain from its roughly 12% storage moisture to
      about 42-48%; the grains swell, increasing in volume by some
      30-60%, and about 1% of the dry mass is lost to the steep liquor.
      It is normally carried out in alternating cycles of water
      immersion and air rest. Once the grain has taken up enough water
      it passes to the germination stage [1][2].


