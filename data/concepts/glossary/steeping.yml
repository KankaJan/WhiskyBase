    accessed: 2026-05-21
    notes: |
      Russell ed. 2022 Ch 10 (Bringhurst, Harrison & Brosnan):
      barley for pot still malt is generally steeped in water as the
      first step of malting, ahead of germination.

  - id: 2
    type: book
    citation: |
      Miller, G.H., Whisky Science: A Condensed Distillation,
      2nd edition, Springer International Publishing, 2024.
      ISBN 978-3-031-50686-4.
    accessed: 2026-05-21
    notes: |
      Miller Ch 3 (Malting), section 3.1: controlled germination
      begins by steeping the grain to raise its moisture content (about
      42-48% on a fresh-weight basis, up from roughly 12% storage
      moisture); the grains swell, volume increasing 30-60%, and about
      1% of the dry mass is lost to the steep liquor (dust, fragments,
      dissolved husk and pericarp matter).


