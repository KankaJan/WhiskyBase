# --- Identity ---------------------------------------------------------------
id: reflux
title: Reflux
kind: glossary


# --- Summary & Body ---------------------------------------------------------
summary: |
  Reflux is the partial condensation of spirit vapour back into
  liquid before it exits the still, returning the heavier
  components for re-distillation while the lighter, more volatile
  fractions continue forward to the condenser. Reflux is the
  principal mechanism through which still geometry shapes new make
  character: tall stills with long necks and ascending lyne arms
  generate substantial reflux and produce lighter, more
  ester-driven spirit; short stills with descending lyne arms
  minimise reflux and produce a heavier, more sulphury, more
  congener-rich spirit [1][2]. The Glenmorangie wash and spirit
  stills (16'10" tall, ascending lyne arms) and the Lagavulin
  pear-shaped stills with descending lyne arms exemplify the
  high-reflux and low-reflux ends of the spectrum. Reflux also
  extends spirit-copper contact time, amplifying the "copper
  conversation" effects on sulphur removal (see
  educational/copper-conversation).


