# --- Sources ----------------------------------------------------------------
sources:
  - id: 1
    type: book
    citation: |
      Nicol, D.A., "Batch distillation", Chapter 9 in
      Russell, I. & Stewart, G. (eds.), Whisky: Technology,
      Production and Marketing, 2nd edition, Academic Press
      (Elsevier), 2014, pp 155-177.
    accessed: 2026-05-19
    notes: |
      Nicol Ch 9 covers reflux through the still-geometry
      sections: pot (p 160) and lyne arm (p 161), with the
      observation that "the attitude of the head will dictate
      the degree of reflux within the still" (p 161). The role
      of reflux in middle-cut character is discussed under
      wash-still operation (p 165) and spirit-still operation
      (p 166).
  - id: 2
    type: book
    citation: |
      Miller, G.H., Whisky Science: A Condensed Distillation,
      2nd edition, Springer International Publishing, 2024.
      ISBN 978-3-031-50686-4.
    accessed: 2026-05-20
    notes: |
      Miller Chapter 6 (Distillation Experiments and Observations),
      section 6.1 The Shape of Stills, pp 253-255. Corroborates reflux
      as condensation on ascending vapour paths flowing back to the
      pot, and the dependence of reflux on still geometry - ascending
      lyne arms and purifiers provide controlled reflux, and the
      Hastie and Dick still-head experiments show increasing reflux
      altering congener recovery (furfural, total acids). Miller adds
      a caveat preserved here: "There is very little quantitative
      reasoning in the literature to explain the design of Scottish
      pot stills ... though there is much expressed belief in the
      importance of still design" (p 254).


