# --- Identity ---------------------------------------------------------------
id: outturn
title: Outturn
kind: glossary


# --- Summary & Body ---------------------------------------------------------
summary: |
  "Outturn" is the total number of bottles released from a single
  cask or small-batch vatting. The figure is producer-disclosed on
  the label for many single-cask releases and small-batch limited
  editions; this project records it on the bottling entry under
  `batch_or_cask.outturn_bottles`. Outturn is set by the volume of
  liquid remaining in the cask after the "angel's share" evaporation
  losses, the bottling strength chosen, and the bottle size.
  Independent bottlers commonly disclose outturn for single-cask
  releases as a transparency signal; large-volume core releases
  rarely do.

