# --- Identity ---------------------------------------------------------------
id: age-statement
title: Age statement
kind: glossary


# --- Summary & Body ---------------------------------------------------------
summary: |
      An age statement is the age declared on a whisky label.
      Under the Scotch Whisky Regulations 2009, where an age is stated
      it must be the age of the youngest whisky in the bottle — a blend
      or vatting labelled, say, "12 years old" contains nothing younger
      than twelve years, though it may contain older whisky. A whisky
      sold without an age on the label is termed "no age statement"
      (NAS). An NAS bottling is not younger or lesser by definition —
      all Scotch must still meet the three-year legal minimum — but the
      absence of a statement removes the youngest-component
      guarantee [1].


