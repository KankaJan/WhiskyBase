# --- Sources ----------------------------------------------------------------
sources:
  - id: 1
    type: book
    citation: |
      Bringhurst, T.A., Harrison, B.M. & Brosnan, J., "Scotch
      whisky: raw material selection and processing", Chapter 10
      in Russell, I., Stewart, G. & Kellershohn, J. (eds.),
      Whisky and Other Spirits: Technology, Production and
      Marketing, 3rd edition, Academic Press (Elsevier), 2022.
    accessed: 2026-05-21
    notes: |
      Russell ed. 2022 Ch 10 (Bringhurst, Harrison & Brosnan),
      pp 150-151: for distilling malt the barley is allowed to germinate
      for a longer period, typically 5-6 days; unkilned green malt
      preserves around 35-50% of the enzyme activity that kilning would
      reduce.

  - id: 2
    type: book
    citation: |
      Miller, G.H., Whisky Science: A Condensed Distillation,
      2nd edition, Springer International Publishing, 2024.
      ISBN 978-3-031-50686-4.
    accessed: 2026-05-21
    notes: |
      Miller Ch 3 (Malting), section 3.1 Germination: germination
      develops the grain's enzymes and modifies the endosperm;
      modification is tracked by Calcofluor and viscosity indicators.
      Green malt carries active beta-glucanase, which kilning above
      ~40 degrees C deactivates (p 181).


