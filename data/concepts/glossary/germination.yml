# --- Identity ---------------------------------------------------------------
id: germination
title: Germination
kind: glossary


# --- Summary & Body ---------------------------------------------------------
summary: |
      Germination is the controlled-sprouting stage of malting,
      between steeping and kilning. The steeped barley is held under
      cool, moist conditions and allowed to begin growing; this
      develops the starch-converting enzymes and "modifies" the
      endosperm — breaking down cell walls and proteins so the starch
      becomes accessible for mashing. For pot-still malt, germination
      typically runs five to six days. The germinated but not-yet-dried
      grain is called green malt; germination is then halted by
      kilning [1][2].


