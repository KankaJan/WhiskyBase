# --- Sources ----------------------------------------------------------------
sources:
  - id: 1
    type: book
    citation: |
      Nicol, D.A., "Batch distillation", Chapter 14 in
      Russell, I., Stewart, G. & Kellershohn, J. (eds.),
      Whisky and Other Spirits: Technology, Production and
      Marketing, 3rd edition, Academic Press (Elsevier), 2022,
      pp 247-271.
    accessed: 2026-05-20
    notes: |
      Russell ed. 2022 Ch 14 (Nicol): the spirit still is
      charged with low wines plus recycled foreshots and feints; it is
      controlled by two hydrometers in the spirit safe, the tailpipe
      outflow directed by a swivelling spout to one of two collecting
      bowls — one for foreshots and feints, one for the potable spirit
      (pp 255-256). A low-wines-and-feints still can carry an extra
      coil to distil the middle cut gently and promote reflux (p 252).

  - id: 2
    type: book
    citation: |
      Miller, G.H., Whisky Science: A Condensed Distillation,
      2nd edition, Springer International Publishing, 2024.
      ISBN 978-3-031-50686-4.
    accessed: 2026-05-20
    notes: |
      Miller Ch 7 models the second pot distillation in which
      the spirit cut is taken from the redistilled low wines; the cut
      points are operator choices set on the distillate strength.


