# --- Identity ---------------------------------------------------------------
id: spirit-still
title: Spirit still
kind: glossary


# --- Summary & Body ---------------------------------------------------------
summary: |
      The spirit still is the second pot still in Scotch malt
      whisky double distillation (in triple distillation it is the
      third). It is charged with low wines from the wash still together
      with the foreshots and feints recycled from the previous
      spirit-still run, and it is here that the spirit cut is made — the
      distiller diverts the early foreshots and the late feints away
      from the potable middle cut, which is the new-make spirit. Spirit
      stills are typically smaller than the wash still at the same site
      and are often run more gently to promote reflux and refine
      character [1][2].


body: null


