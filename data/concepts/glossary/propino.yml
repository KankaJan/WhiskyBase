id: propino
title: Propino
kind: glossary


# --- Summary & Body ---------------------------------------------------------
summary: |
  Propino is a spring two-row malting barley variety bred by KWS
  UK Ltd, registered for UK commercial cultivation in the early
  2010s and approved by the Institute of Brewing & Distilling for
  malt distilling [1]. Propino is grown alongside Concerto as a
  rotational alternative; its agronomic profile (yield, disease
  resistance, malting quality) is broadly comparable, allowing
  growers to spread varietal risk across the cropping season.
  Within WhiskyBase populated production-line entries, Propino is
  currently recorded only for Bruichladdich Port Charlotte (2014
  Islay Barley vintage); the variety appears more commonly in
  bottling-level disclosures for specific vintage releases than in
  ongoing core-line specifications.


