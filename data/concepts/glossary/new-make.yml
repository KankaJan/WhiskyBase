# --- Identity ---------------------------------------------------------------
id: new-make
title: New make
kind: glossary


# --- Summary & Body ---------------------------------------------------------
summary: |
  "New make" (also "new make spirit") is the unaged distillate
  collected from the spirit still as the middle cut, before any cask
  maturation. New make is colourless, typically at a strength of
  ~65–75% ABV depending on the producer's standard cut points, and
  carries the bulk of the congener profile (fruity esters, sulphury
  compounds, phenols if peated) that maturation will then modify
  through cask interaction and oxidative change. New make is the
  legal starting point for Scotch whisky maturation under the
  Scotch Whisky Regulations 2009 [1]; the spirit must be filled to
  cask at a strength not exceeding 94.8% ABV and matured in oak for
  at least three years in Scotland to qualify as Scotch.

