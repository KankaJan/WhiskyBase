sources:
  - id: 1
    type: book
    citation: |
      Russell, I., Stewart, G. & Kellershohn, J. (eds.),
      Whisky and Other Spirits: Technology, Production and
      Marketing, 3rd edition, Academic Press (Elsevier), 2022.
    accessed: 2026-05-21
    notes: |
      Russell ed. 2022 Ch 10 (Bringhurst, Harrison & Brosnan), p 173: in mashing the grist is mixed with liquor and infused at a specific temperature (typically 63.5-64 degrees C) so that the starch is gelatinised and malt enzymes hydrolyse it into fermentable sugars, which are extracted into the wort.

  - id: 2
    type: book
    citation: |
      Miller, G.H., Whisky Science: A Condensed Distillation,
      2nd edition, Springer International Publishing, 2024.
      ISBN 978-3-031-50686-4.
    accessed: 2026-05-21
    notes: |
      Miller Ch 4 (Mashing), section 4.3 Saccharification, p 193: the starch-reducing enzymes — alpha-amylase, beta-amylase, limit-dextrinase, alpha-glucosidase and maltase — hydrolyse the gelatinised starch; the iodine test confirms complete saccharification when no unconverted starch remains.


