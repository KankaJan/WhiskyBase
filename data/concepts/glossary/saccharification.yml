# --- Identity ---------------------------------------------------------------
id: saccharification
title: Saccharification
kind: glossary


# --- Summary & Body ---------------------------------------------------------
summary: |
      Saccharification is the conversion of the malt's starch
      into fermentable sugars during mashing. When the milled grist
      meets hot water the starch first gelatinises — the granules swell
      and the structure opens — and the malt's amylase enzymes then
      hydrolyse it into sugars, chiefly maltose, with glucose,
      maltotriose and dextrins; these dissolve into the wort. Because
      the conversion depends on the malt's diastase enzymes, mashing is
      held in the temperature band where those enzymes are active —
      around 63-65 degrees C for the first water [1][2].


body: null


