sources:
  - id: 1
    type: book
    citation: |
      Conner, J., "Maturation", Chapter 16 in Russell, I.,
      Stewart, G. & Kellershohn, J. (eds.), Whisky and Other
      Spirits: Technology, Production and Marketing, 3rd edition,
      Academic Press (Elsevier), 2022.
    accessed: 2026-05-21
    notes: |
      Russell ed. 2022 Ch 16 (Conner, Maturation), p 305: the
      cask is not an impermeable container — it allows the evaporation
      of spirit (both ethanol and water) and the ingress of air; "the
      loss of a small percentage of spirit has long been an accepted
      part of maturation (called the 'angels' share')", and these
      losses vary with warehouse environmental conditions.

  - id: 2
