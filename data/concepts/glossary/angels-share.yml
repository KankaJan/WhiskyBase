# --- Identity ---------------------------------------------------------------
id: angels-share
title: Angel's share
kind: glossary


# --- Summary & Body ---------------------------------------------------------
summary: |
      The angel's share is the portion of maturing spirit lost
      from the cask to evaporation. A cask is not an airtight container:
      through the years of maturation both ethanol and water evaporate
      out through the wood, while air (oxygen) enters. The loss runs at
      a few percent of the cask volume per year and varies with the
      warehouse environment — temperature and humidity govern both the
      rate of loss and whether the spirit weakens or holds its strength.
      The accumulated loss means an older whisky yields progressively
      less bottled volume from its original fill [1][2].


