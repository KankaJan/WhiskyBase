      2nd edition, Springer International Publishing, 2024.
      ISBN 978-3-031-50686-4.
    accessed: 2026-05-21
    notes: |
      Miller Ch 8 (Maturation) treats evaporative loss and
      seasonal variation in rack houses, corroborating that the
      warehouse environment governs the rate of evaporative loss.


