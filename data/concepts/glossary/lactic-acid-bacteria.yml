# --- Sources ----------------------------------------------------------------
sources:
  - id: 1
    type: book
    citation: |
      Russell, I., Stewart, G. & Kellershohn, J. (eds.),
      Whisky and Other Spirits: Technology, Production and
      Marketing, 3rd edition, Academic Press (Elsevier), 2022.
    accessed: 2026-05-21
    notes: |
      Russell ed. 2022 Ch 13 (Wilson, "Contamination: bacteria and wild yeasts"), p 239: LAB are classified by their carbohydrate metabolism — obligate homofermenting LAB produce lactic acid as the sole end product via glycolysis; obligate heterofermenting LAB use the 6-PG/PK pathway, producing lactic acid, carbon dioxide and ethanol or acetic acid; facultative heterofermenters use both.

  - id: 2
    type: book
    citation: |
      Miller, G.H., Whisky Science: A Condensed Distillation,
      2nd edition, Springer International Publishing, 2024.
      ISBN 978-3-031-50686-4.
    accessed: 2026-05-21
    notes: |
      Miller Ch 5 (Fermentation), p 239: lactobacilli enter the mash through raw materials, equipment, or wooden washbacks; lactobacillus-inoculated wash yields a spirit with higher fatty acids and esters, with one study finding lactobacilli "essential for the development of the perceived quality parameters of Scotch malt spirit".


