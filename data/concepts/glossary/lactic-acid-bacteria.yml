# --- Identity ---------------------------------------------------------------
id: lactic-acid-bacteria
title: Lactic acid bacteria
kind: glossary


# --- Summary & Body ---------------------------------------------------------
summary: |
      Lactic acid bacteria (LAB) — chiefly Lactobacillus species
      — are near-ubiquitous participants in whisky fermentation. They
      enter through the malt, the equipment and the non-sterile wooden
      washbacks, and become active particularly in longer fermentations
      once the yeast has completed its primary work. LAB are classified
      by their metabolism: homofermentative LAB produce lactic acid as
      the sole end product, while heterofermentative LAB also yield
      carbon dioxide and either ethanol or acetic acid. Their activity
      raises the levels of fatty acids and esters and is regarded as
      contributing positively to the character of Scotch malt
      spirit [1][2].


