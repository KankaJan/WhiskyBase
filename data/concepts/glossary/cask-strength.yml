# --- Identity ---------------------------------------------------------------
id: cask-strength
title: Cask strength
kind: glossary


# --- Summary & Body ---------------------------------------------------------
summary: |
  "Cask strength" describes a whisky bottled at the alcoholic
  strength at which it was withdrawn from the cask, without dilution
  to a fixed presentation strength. The term is industry convention
  rather than a regulated label term: the Scotch Whisky Regulations
  2009 do not define "cask strength" specifically [1], so producers
  apply it with some latitude. In contemporary use the figure is
  typically in the range 50–60% ABV, varying by age, climate, and
  cask history. Cask-strength releases sit at the higher-disclosure
  end of the presentation spectrum, generally also bottled non-chill-
  filtered and at natural colour. Compare against the standard
  flagship presentation strength of 40–46% ABV, which involves
  pre-bottling dilution with water to a fixed target.

