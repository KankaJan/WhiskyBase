# --- Sources ----------------------------------------------------------------
sources:
  - id: 1
    type: book
    citation: |
      Nicol, D.A., "Batch distillation", Chapter 9 in
      Russell, I. & Stewart, G. (eds.), Whisky: Technology,
      Production and Marketing, 2nd edition, Academic Press
      (Elsevier), 2014, pp 155-177.
    accessed: 2026-05-19
    notes: |
      Nicol Ch 9 covers worm-tub vs shell-and-tube condensers
      at p 162. The historical transition is recorded on p 155:
      "Worm tubs and eventually the shell-and-tube condenser
      superseded the original system" of cooling against air.
      The role of copper in spirit quality (sulphur removal,
      DMS chemistry) is treated separately on pp 176-177
      (NB: rummager-induced rejuvenation of copper p 196 in
      the Murray Ch 10 grain-distillation chapter for the
      column-still parallel).
  - id: 2
    type: peer_reviewed_paper
    citation: |
      Harrison, B., Fagnen, O., Jack, F. & Brosnan, J., "The Impact
      of Copper in Different Parts of Malt Whisky Pot Stills on New
      Make Spirit Composition and Aroma", Journal of the Institute
      of Brewing, vol. 117, no. 1, 2011, pp 106-112.
      DOI: 10.1002/j.2050-0416.2011.tb00450.x.
    accessed: 2026-06-12
    notes: |
      Peer-reviewed study from the Scotch Whisky Research Institute
      (Jack and Brosnan are SWRI). Corroborates the load-bearing
      mechanism behind the worm-tub / shell-and-tube character
      difference: in copper pot stills "the copper acts to reduce
      sulphury aromas in the resultant spirit by reducing the levels
      of sulphur compounds such as dimethyl trisulphide (DMTS)", and
      this effect is "more effective in this role in some parts of the
      pot stills than others". The condenser is a principal site of
      vapour-copper contact, so the high-surface-area shell-and-tube
      condenser strips more sulphur than a worm tub. Scope note: the
      paper studies copper placement within pot-still systems, not a
      direct worm-tub-versus-shell-and-tube head-to-head; the
      condenser-type contrast itself rests on source 1 (Nicol).
      Together the two are the basis for promoting the entry from
      medium to high (2026-06-12).


