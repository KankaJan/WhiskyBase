# --- Identity ---------------------------------------------------------------
id: peating-block
title: peating block
kind: glossary


# --- Summary & Body ---------------------------------------------------------
summary: |
  In WhiskyBase's schema, the `peating` block is the structured YAML
  field on `production_line` entries that records phenol PPM
  measurements with their full methodological context. It contains a
  list of `measurements` records (each with stage, value, unit,
  method, compounds, source_id, notes), a `peat_origin` field, and
  free-text `notes`. Defined in `schema/production_line.template.yml`
  v0.2.1. Distinct from the source-level `methodology.peating_ppm`
  block, which lives under each source entry (in production_line and
  bottling files) and records the methodology a given source uses
  for its PPM figures.

body: null


