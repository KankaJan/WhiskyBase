# --- Identity ---------------------------------------------------------------
id: milling
title: Milling
kind: glossary


# --- Summary & Body ---------------------------------------------------------
summary: |
      Milling is the crushing of malted barley into grist for
      mashing. Malt whisky distilleries generally use roller mills,
      which crack the grain into three fractions — husk, grits (coarse
      particles) and flour (fine) — in a controlled ratio. The husk is
      deliberately kept intact: in a traditional or lauter mash tun the
      husks form the filter bed through which the wort drains. Too much
      flour blocks the mash-tun plates and slows separation; too little
      gives a poor extract. Milling is the first of the three malt
      distillery processing stages, ahead of mashing and wort
      separation [1][2].


