# --- Identity ---------------------------------------------------------------
id: distillers-yeast
title: Distiller's yeast
kind: glossary


# --- Summary & Body ---------------------------------------------------------
summary: |
  "Distiller's yeast" is the colloquial industry term for the
  Saccharomyces cerevisiae strains selected and propagated for
  Scotch malt whisky fermentation. Distinct strains have been
  developed for distilling versus brewing applications: distilling
  strains are selected for high alcohol yield (high sugar-to-
  ethanol conversion efficiency at temperatures typical of
  Scotch washbacks, 18-32 °C across fermentation), tolerance to
  the higher gravity of distilling worts (often higher than ale
  brewing wort), and a tendency to produce ester profiles
  appropriate to spirit (rather than the more emphasised hop-
  derived aroma profiles selected for in brewing strains) [1].
  Two yeast houses dominate Scotch supply: Mauri Yeast (now part
  of AB Mauri) and Kerry Group's distilling yeast division
  (formerly Anchor / Lallemand), with Saf-Instant and other
  smaller suppliers serving niche segments. Distillery disclosure
  of specific yeast strains is uneven; most production_line
  entries currently record yeast: distillers (generic claim) or
  yeast: null (undisclosed).


