# --- Sources ----------------------------------------------------------------
sources:
  - id: 1
    type: book
    citation: |
      Russell, I. & Stewart, G., "Distilling yeast and
      fermentation", Chapter 7 in Russell, I. & Stewart, G.
      (eds.), Whisky: Technology, Production and Marketing,
      2nd edition, Academic Press (Elsevier), 2014, pp 123-145.
    accessed: 2026-05-19
    notes: |
      Russell & Stewart Ch 7 covers yeast strain selection and
      the distilling-yeast cell biology. Yeast sourcing
      discussed on p 123; nomenclature and structure pp 124-128;
      yeast-and-nitrogen metabolism p 134; distiller's yeast
      and oxygen p 136; commercial cultivation of distiller's
      yeast p 137; pitching rate p 138; fermentation congeners
      p 139; wort fermentation p 141. The named-supplier list is
      not directly Russell-attributed; it is corroborated by
      Daute, Jack & Walker 2024 (source 3).
  - id: 2
    type: book
    citation: |
      Miller, G.H., Whisky Science: A Condensed Distillation,
      2nd edition, Springer International Publishing, 2024.
      ISBN 978-3-031-50686-4.
    accessed: 2026-05-20
    notes: |
      Miller Chapter 5 (Fermentation), section 5.1 Yeast, p 219.
      Corroborates the distilling-specific commercial yeast and its
      selection for high attenuation and fast fermentation (high
      alcohol yield): "The majority of scotch whisky distillers use a
      commercial yeast derived from the Distillers Company 'M' strain
      ... high-attenuating fast-fermenting". Corroborates the
      distilling-versus-brewing distinction - distiller's wort retains
      residual amylase activity from malting whereas a brewer's boiled
      wort does not. Miller does NOT name the supplier list; it names
      the Distillers Company "M" strain instead. The supplier list is
      corroborated by source 3 (Daute, Jack & Walker 2024), which also
      identifies the DCL "M" strain origin; the producer / SWRI cross-
      check the entry previously lacked is satisfied by that paper
      (co-authored by F. Jack, SWRI).
  - id: 3
    type: peer_reviewed_paper
    citation: |
      Daute, M., Jack, F. & Walker, G.M., "The potential for Scotch
      Malt Whisky flavour diversification by yeast", FEMS Yeast
      Research, vol. 24, 2024, article foae017.
      DOI: 10.1093/femsyr/foae017.
    accessed: 2026-06-12
    notes: |
      Open-access (CC-BY) review co-authored by Frances Jack of the
      Scotch Whisky Research Institute - the producer / SWRI cross-
      check the named-supplier list previously lacked. Corroborates
      the supplier list directly: the M-type "is still declared as one
      of the standards in the Scotch Whisky industry together with MX
      (Kerry Bio-Science), Pinnacle (Mauri/AB Biotek), and DistillaMax
      (Lallemand Inc.)." Also gives the M-strain origin: the M-type
      (an interspecies S. cerevisiae x S. cerevisiae var. diastaticus
      hybrid) was "introduced ... by DCL Yeast Ltd (now Kerry
      Biosciences) in 1952". This corroboration is the basis for
      promoting the entry from medium to high (2026-06-12). (The paper
      spells the Lallemand product "DistillaMax"; the producer's own
      brand spelling is "DistilaMax".)


