# --- Sources ----------------------------------------------------------------
sources:
  - id: 1
    type: book
    citation: |
      Russell, I. & Stewart, G., "Distilling yeast and
      fermentation", Chapter 7 in Russell, I. & Stewart, G.
      (eds.), Whisky: Technology, Production and Marketing,
      2nd edition, Academic Press (Elsevier), 2014, pp 123-145.
    accessed: 2026-05-19
    notes: |
      Russell & Stewart Ch 7 covers yeast strain selection and
      the distilling-yeast cell biology. Yeast sourcing
      discussed on p 123; nomenclature and structure pp 124-128;
      yeast-and-nitrogen metabolism p 134; distiller's yeast
      and oxygen p 136; commercial cultivation of distiller's
      yeast p 137; pitching rate p 138; fermentation congeners
      p 139; wort fermentation p 141. The named-supplier list
      (Mauri / Kerry / Lallemand / Saf-Instant) is project-
      project specific rather than directly Russell-attributed
      and warrants cross-checking against producer disclosure
      and SWRI literature.
  - id: 2
    type: book
    citation: |
      Miller, G.H., Whisky Science: A Condensed Distillation,
      2nd edition, Springer International Publishing, 2024.
      ISBN 978-3-031-50686-4.
    accessed: 2026-05-20
    notes: |
      Miller Chapter 5 (Fermentation), section 5.1 Yeast, p 219.
      Corroborates the distilling-specific commercial yeast and its
      selection for high attenuation and fast fermentation (high
      alcohol yield): "The majority of scotch whisky distillers use a
      commercial yeast derived from the Distillers Company 'M' strain
      ... high-attenuating fast-fermenting". Corroborates the
      distilling-versus-brewing distinction - distiller's wort retains
      residual amylase activity from malting whereas a brewer's boiled
      wort does not. Miller does NOT corroborate the named yeast-house
      list (Mauri / Kerry / Lallemand / Saf-Instant); it names the
      Distillers Company "M" strain instead. That supplier-list claim
      remains uncorroborated, so the entry is held at
      confidence: medium pending producer / SWRI cross-check.


