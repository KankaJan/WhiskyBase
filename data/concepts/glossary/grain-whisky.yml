# --- Identity ---------------------------------------------------------------
id: grain-whisky
title: Grain whisky
kind: glossary


# --- Summary & Body ---------------------------------------------------------
summary: |
      Grain whisky is Scotch whisky distilled chiefly from
      cereals other than malted barley — principally wheat, or
      historically maize — together with a small proportion of malted
      barley that supplies the enzymes for starch conversion. It is
      distilled continuously in the column (Coffey) still rather than
      batch-wise in pot stills, yielding a lighter, higher-strength
      spirit. Most grain whisky is used in blended Scotch; bottled on
      its own from a single distillery it is "single grain Scotch
      whisky", one of the five categories defined by the Scotch Whisky
      Regulations 2009 [1][2].


