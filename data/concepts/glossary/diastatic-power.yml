sources:
  - id: 1
    type: book
    citation: |
      Bringhurst, T.A., Harrison, B.M. & Brosnan, J., "Scotch
      whisky: raw material selection and processing", Chapter 10
      in Russell, I., Stewart, G. & Kellershohn, J. (eds.),
      Whisky and Other Spirits: Technology, Production and
      Marketing, 3rd edition, Academic Press (Elsevier), 2022.
    accessed: 2026-05-21
    notes: |
      Russell ed. 2022 Ch 10 (Bringhurst, Harrison & Brosnan),
      p 164: diastatic power (DP) is described as a mixture of alpha-
      and beta-amylase activity, reported alongside dextrinising units
      (DU); enzyme levels are a malt-selection criterion.

  - id: 2
    type: book
    citation: |
      Miller, G.H., Whisky Science: A Condensed Distillation,
      2nd edition, Springer International Publishing, 2024.
      ISBN 978-3-031-50686-4.
    accessed: 2026-05-21
    notes: |
      Miller Ch 4 (Mashing), section 4.3 Saccharification, p 193:
      the principal starch-reducing enzymes of barley malt — alpha-
      amylase, beta-amylase, limit-dextrinase, alpha-glucosidase and
      maltase — are collectively known as diastase; beta-amylase
      activity peaks at 50 degrees C and alpha-amylase, alpha-
      glucosidase, maltase and total diastase at 60 degrees C. Miller
      Ch 3 notes kilning reduces diastatic power by roughly 10%.


