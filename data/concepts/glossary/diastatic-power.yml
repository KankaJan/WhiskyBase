# --- Identity ---------------------------------------------------------------
id: diastatic-power
title: Diastatic power
kind: glossary


# --- Summary & Body ---------------------------------------------------------
summary: |
      Diastatic power (DP) is the measure of a malt's capacity to
      convert starch into fermentable sugars — the combined activity of
      its starch-degrading enzymes. The principal enzymes are
      alpha-amylase and beta-amylase, with limit-dextrinase,
      alpha-glucosidase and maltase; collectively they are termed
      "diastase". Their activity is temperature-dependent — beta-amylase
      peaks near 50 degrees C and alpha-amylase and total diastase near
      60 degrees C — which sets the mashing temperature. Kilning
      deactivates part of the enzyme load, so green (unkilned) malt
      retains more diastatic power than kilned malt [1][2].


body: null


