kind: glossary


# --- Summary & Body ---------------------------------------------------------
summary: |
  Bairds Malt Ltd is a UK commercial maltster supplying Scotch
  malt distilleries from sites at Inverness (Scotland), Pencaitland
  (East Lothian, Scotland), and Witham (Essex, England). The
  Inverness site (Bairds of Inverness) is the most-referenced
  Bairds plant in WhiskyBase populated entries, supplying Harris
  Distillery (The Hearach core), Bruichladdich (Islay Barley
  releases and the Octomore 8.3 batch reported on Bairds malt),
  and others. Bairds operates HPLC-based phenol measurement for
  peated specifications, providing the spec-stage ppm values
  cited by Harris and Bruichladdich [1]. The company is one of
  several principal commercial maltsters serving the Scotch
  industry alongside Crisp Malt, Simpsons Malt, Muntons, and
  Boortmalt (see practice/external-malting).


