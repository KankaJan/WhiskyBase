# --- Identity ---------------------------------------------------------------
id: vatting
title: Vatting
kind: glossary


# --- Summary & Body ---------------------------------------------------------
summary: |
  Vatting is the combination of mature whisky from multiple casks
  into a single batch before bottling. Within a single distillery,
  vatting smooths out cask-to-cask variation to produce a
  reproducible release (the standard practice for distillery core
  releases such as Lagavulin 16 and Glenmorangie Original). Across
  distilleries, vatting of single-malt Scotch from multiple
  distilleries produces "blended malt Scotch whisky" — one of the
  five regulated Scotch categories defined by the Scotch Whisky
  Regulations 2009 [1]. The complementary concept is "single cask"
  (see glossary/single-cask), where one cask is bottled without
  vatting. The term is industry convention; the 2009 Regulations
  do not define "vatting" itself but the resulting categories
  (single malt, blended malt, blended Scotch) are regulated.


