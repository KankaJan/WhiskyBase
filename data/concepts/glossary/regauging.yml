# --- Identity ---------------------------------------------------------------
id: regauging
title: Regauging
kind: glossary


# --- Summary & Body ---------------------------------------------------------
summary: |
      Regauging is the re-measurement of a maturing cask's
      contents — its volume and alcoholic strength — after a period in
      the warehouse. A cask is gauged when it is filled; because the
      angel's share steadily removes spirit, the contents are
      re-gauged later to establish the current volume and strength,
      historically for excise-duty assessment and for stock control.
      Gauging itself is the long-established discipline of calculating
      a cask's contents from its dimensions and ullage [1][2].


