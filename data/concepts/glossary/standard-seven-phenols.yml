# --- Identity ---------------------------------------------------------------
id: standard-seven-phenols
title: standard seven phenols
kind: glossary


# --- Summary & Body ---------------------------------------------------------
summary: |
  The "standard seven" is the conventional set of seven phenolic
  compounds summed in modern Scotch industry HPLC measurement of
  malt PPM: phenol, o-cresol (2-methylphenol), m-cresol
  (3-methylphenol), p-cresol (4-methylphenol), guaiacol
  (2-methoxyphenol), 4-methylguaiacol (2-methoxy-4-methylphenol),
  and 4-ethylguaiacol (2-methoxy-4-ethylphenol). The seven-compound
  sum is what published producer PPM figures refer to unless an
  alternative methodology is explicitly stated. The selection of
  these particular seven compounds is industry convention rather
  than chemical inevitability — other phenolic compounds are
  present in peat-smoked malt but are not typically reported in
  PPM disclosures.

