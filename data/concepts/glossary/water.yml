    accessed: 2026-05-21
    notes: |
      Miller Ch 4 (Mashing) treats the mashing liquor — the hot
      water combined with the grist — and the energy balance of
      heating it; reduction water for bringing spirit to fill and
      bottling strength is treated alongside gauging. Corroborates the
      production roles of water.


