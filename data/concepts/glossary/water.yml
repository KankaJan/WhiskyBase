id: water
title: Water
kind: glossary


# --- Summary & Body ---------------------------------------------------------
summary: |
      Water is used at several points in Scotch whisky
      production: most importantly as the hot mashing liquor that
      extracts sugars from the grist, and as the reduction water that
      brings spirit down to cask-fill and bottling strength; it is also
      the cooling medium in condensers. Distilleries draw water from
      boreholes, springs and surface sources (streams and lochs) or
      from the public mains, and many hold their own private supply.
      Surface water may carry organic character from peat and
      vegetation, while groundwater reflects the local geology. Summer
      drought can limit supply — historically one reason for the
      distilling "silent season" [1][2].


