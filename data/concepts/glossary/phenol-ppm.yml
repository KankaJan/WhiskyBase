# --- Identity ---------------------------------------------------------------
id: phenol-ppm
title: phenol PPM
kind: glossary


# --- Summary & Body ---------------------------------------------------------
summary: |
  Phenol PPM (parts per million) is the measure of phenolic compound
  concentration in malted barley used for peated whisky production.
  The figure is typically measured by high performance liquid
  chromatography (HPLC) summing the seven "standard 7" phenolic
  compounds: phenol, the three cresols (o-, m-, p-cresol), guaiacol,
  4-methylguaiacol, and 4-ethylguaiacol. The measurement is taken on
  the kilned malt before mashing. The same abbreviation is sometimes
  used at later stages (new-make spirit, bottled liquid), where it
  refers to the same compound set but at substantially lower
  concentrations.

body: null


