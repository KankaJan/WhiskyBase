id: cresol
title: cresol
kind: glossary


# --- Summary & Body ---------------------------------------------------------
summary: |
  Cresol is the common name for a methylphenol — a phenol ring with
  one methyl (CH3) substituent. Three positional isomers exist,
  named for the position of the methyl group relative to the
  hydroxyl: o-cresol (2-methylphenol) [1], m-cresol (3-methylphenol)
  [2], and p-cresol (4-methylphenol) [3]. In whisky chemistry, all
  three isomers are counted among the seven compounds summed in the
  standard HPLC measurement of malt PPM. Sensory associations in the
  whisky context cover a range from phenolic-medicinal to tarry,
  varying by isomer.

