# --- Identity ---------------------------------------------------------------
id: sulphur-in-new-make
title: sulphur in new make
kind: glossary


# --- Summary & Body ---------------------------------------------------------
summary: |
  "Sulphur in new make" refers to the residual content of volatile
  sulphurous compounds in the new make spirit immediately after
  distillation, before maturation. The principal compounds in this
  category are dimethyl sulphide (DMS) [1] and dimethyl trisulphide
  (DMTS) [2], generated during fermentation and partially carried
  through distillation. New make sulphur content is the principal
  target of copper-catalysed removal during distillation; see
  `educational/copper-conversation`. Distilleries using equipment
  configurations that reduce copper-spirit contact (notably worm-tub
  condensers) typically produce new make spirit with higher residual
  sulphur, which contributes to characteristic weight and meatiness
  in the matured whisky.

