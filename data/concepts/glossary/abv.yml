    notes: |
      Alcoholic Liquor Duties Act 1979 (as amended). The Act and the
      HMRC notices issued under it set out the UK measurement
      framework for spirit strength, including the 20 °C reference
      temperature for declared ABV. The EU spirit drinks regulation
      (Regulation (EU) 2019/787) carries the same 20 °C convention.


