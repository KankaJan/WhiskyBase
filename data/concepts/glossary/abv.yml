# --- Identity ---------------------------------------------------------------
id: abv
title: ABV
kind: glossary


# --- Summary & Body ---------------------------------------------------------
summary: |
  ABV (alcohol by volume) is the volumetric concentration of ethanol
  in a finished spirit, expressed as a percentage at a standard
  reference temperature of 20 °C in the UK and EU [1]. ABV is the
  measure printed on Scotch whisky labels; it is the figure used in
  this project's `abv:` fields on bottling entries. Spirit-strength
  measurement is regulated in the UK by the alcoholometry provisions
  carried over from the Alcoholic Liquor Duties Act 1979 and
  associated Customs and Excise notices, which prescribe 20 °C as
  the reference temperature for declared ABV [1].

body: null


