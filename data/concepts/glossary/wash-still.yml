# --- Identity ---------------------------------------------------------------
id: wash-still
title: Wash still
kind: glossary


# --- Summary & Body ---------------------------------------------------------
summary: |
  The wash still is the first of two (or three) pot stills used in
  Scotch malt whisky distillation. It is charged with fermented
  wash at ~7-9% ABV and distils that wash into "low wines" at
  ~20-25% ABV; the entire wash-still output passes to the next
  still in the sequence (the spirit still in a double-distillation
  regime, or an intermediate still in triple distillation), where
  the spirit cut is made. The wash still therefore performs a bulk
  concentration step rather than a flavour-shaping cut. Wash stills
  are typically larger than the spirit still at the same site
  (capacity ratios of 1.5:1 to 2:1 are common); shape, height,
  lyne-arm angle, and condenser type contribute to the spirit's
  character via the "copper conversation" (see
  educational/copper-conversation) before the second distillation
  refines it further [1].

body: null


