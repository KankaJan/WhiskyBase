# --- Sources ----------------------------------------------------------------
sources:
  - id: 1
    type: book
    citation: |
      Russell, I., Stewart, G. & Kellershohn, J. (eds.),
      Whisky and Other Spirits: Technology, Production and
      Marketing, 3rd edition, Academic Press (Elsevier), 2022.
    accessed: 2026-05-21
    notes: |
      Russell ed. 2022 Ch 10 (Bringhurst, Harrison & Brosnan), pp 169-181: wort separation is one of the three malt distillery processing stages; the grain husk forms the filter bed, and lauter / semi-lauter tuns use movable knives to control the run-off.

  - id: 2
    type: book
    citation: |
      Miller, G.H., Whisky Science: A Condensed Distillation,
      2nd edition, Springer International Publishing, 2024.
      ISBN 978-3-031-50686-4.
    accessed: 2026-05-21
    notes: |
      Miller Ch 4 (Mashing), section 4.5 Lautering, pp 198-199: "Lautering is the process in which wort is drained from the mash"; the cake of grist particles forms a filter bed, and the lautering rate is governed by bed permeability and wort viscosity (an abundance of beta-glucans prolongs it).


