# --- Identity ---------------------------------------------------------------
id: lautering
title: Lautering
kind: glossary


# --- Summary & Body ---------------------------------------------------------
summary: |
      Lautering is the separation of the sweet wort from the
      spent grains at the end of mashing — draining the liquid through
      a filter bed that the grain husks form on the slotted false floor
      of the mash tun. The first wort runs off, then the grain bed is
      sparged with further hot water to rinse out the remaining
      extract. The lautering rate depends on the grist carrying enough
      intact husk to keep the bed porous, and on the wort's viscosity;
      a lauter tun's movable knives can cut the bed to keep the run-off
      fast and even [1][2].


