# --- Summary & Body ---------------------------------------------------------
summary: |
  "Classic Malts of Scotland" (or "Classic Malts") is the trade
  name for a marketing portfolio of single malt Scotch whiskies
  introduced by United Distillers in the late 1980s (commonly
  reported as 1988, though the specific launch date is not
  currently sourced in this entry) and continued by its successor
  companies (UDV, Diageo). The portfolio's original six malts —
  Glenkinchie, Cragganmore, Dalwhinnie, Oban, Talisker, and
  Lagavulin — were selected by United Distillers to represent six
  regional styles within the company's portfolio at the time, not
  by independent expert curation. The portfolio has been expanded
  and rebranded several times since. References to the "Classic
  Malts" in third-party Scotch coverage usually mean the original
  six or some superset, but the precise composition has shifted
  with corporate marketing changes.

