    citation: |
      Conner, J., "Maturation", Chapter 16 in Russell, I.,
      Stewart, G. & Kellershohn, J. (eds.), Whisky and Other
      Spirits: Technology, Production and Marketing, 3rd edition,
      Academic Press (Elsevier), 2022.
    accessed: 2026-05-21
    notes: |
      Russell ed. 2022 Ch 16 (Conner, Maturation): American oak
      for tight cooperage is predominantly Quercus alba (with related
      species); most former bourbon barrels reach Scotland as American
      standard barrels (190 L) or are rebuilt as hogsheads (250 L).
      European oak (Quercus robur and Q. petraea) is used for the
      casks seasoned with sherry; American-oak casks produce relatively
      light, floral whiskies.

  - id: 2
    type: book
    citation: |
      Miller, G.H., Whisky Science: A Condensed Distillation,
      2nd edition, Springer International Publishing, 2024.
      ISBN 978-3-031-50686-4.
    accessed: 2026-05-21
    notes: |
      Miller Ch 8 (Maturation), "The Structure of Oak and Casks":
      the species and grain of the oak govern the wood's permeability
      and its extractable-compound content, and so the character it
      confers.


