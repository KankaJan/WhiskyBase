id: oak
title: Oak
kind: glossary


# --- Summary & Body ---------------------------------------------------------
summary: |
      Oak is the wood from which whisky casks are made; Scotch
      must by law be matured in oak. Two species groups dominate. American
      white oak — predominantly Quercus alba — is the wood of the
      ex-bourbon barrels that supply most Scotch casks. European oak —
      Quercus robur and Q. petraea — is the wood of sherry-seasoned
      casks, traditionally grown in northern Spain. The two groups
      differ in grain, density and extractable-compound profile and so
      contribute different flavour and colour: American oak is
      associated with lighter, vanilla-led character, European oak with
      more tannic, dried-fruit and spice character [1][2].


