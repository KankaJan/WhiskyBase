id: heaven-hill
title: Heaven Hill
kind: glossary


# --- Summary & Body ---------------------------------------------------------
summary: |
  Heaven Hill is a Kentucky bourbon distillery and one of the
  largest US producers of straight bourbon whiskey. Its
  significance to Scotch whisky is as a source of ex-bourbon
  barrels: US federal regulation (27 CFR §5.143(c)) requires
  straight bourbon to be aged in new charred-oak barrels, which
  means each barrel is used once for bourbon and then exported
  for further use [1]. Heaven Hill is among the most commonly
  cited named providers of ex-bourbon barrels to Scotch
  distilleries that disclose cooperage provenance, appearing in
  WhiskyBase populated bottling and cask entries (Harris Hearach
  Batch 1 batches; Bruichladdich Octomore 8.1 cooperage
  disclosure). The company has operated since 1935 from
  Bardstown, Kentucky.


