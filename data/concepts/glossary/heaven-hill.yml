    notes: |
      US Code of Federal Regulations, Title 27, Part 5
      (Labeling and Advertising of Distilled Spirits).
      §5.143(c) defines "straight bourbon" and requires
      maturation in new charred-oak barrels — the regulatory
      basis for the single-use barrel supply that feeds the
      ex-bourbon cask trade. See also the bourbon-barrel cask
      entry (data/casks/bourbon-barrel.yml) which cites the
      same CFR section.


