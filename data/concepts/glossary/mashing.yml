# --- Sources ----------------------------------------------------------------
sources:
  - id: 1
    type: book
    citation: |
      Bringhurst, T.A. & Brosnan, J., "Scotch whisky: raw
      material selection and processing", Chapter 6 in
      Russell, I. & Stewart, G. (eds.), Whisky: Technology,
      Production and Marketing, 2nd edition, Academic Press
      (Elsevier), 2014, pp 49-121.
    accessed: 2026-05-19
    notes: |
      Mashing section pp 88-95 of Bringhurst & Brosnan. First-water
      strike temperature 63.5-64 °C (p 88); subsequent waters at
      70-90 °C; sparge tank held >70 °C with the final mash
      reaching ~90 °C (p 91). Three mash tun types are described:
      traditional, semi-lauter, and full lauter (pp 88-90), with
      a small number of distilleries using mash filters (p 88,
      with a fuller discussion of mash filters on p 95).
      Approximate first/second/third/fourth water ratio for a
      traditional tun is 4:2:2:4 m³ per tonne of malt (p 89).
  - id: 2
    type: book
    citation: |
      Miller, G.H., Whisky Science: A Condensed Distillation,
      2nd edition, Springer International Publishing, 2024.
      ISBN 978-3-031-50686-4.
    accessed: 2026-05-20
    notes: |
      Miller Chapter 4 (Mashing), pp 187 (definition), 193 (enzyme
      activity), 197 (mashing-water schedule), 199 (mash filters).
      Corroborates grist mixed with hot water in the mash tun,
      gelatinisation and enzymatic conversion of starch to fermentable
      sugars, the multi-water schedule at rising temperature, and wort
      drawn off with the residue sparged. Miller gives the first
      mashing water at ca. 70 C and the second at ca. 80 C (p 197);
      Russell's note on this entry records a first-water strike
      temperature of 63.5-64 C. The two first-water figures genuinely
      differ and both are preserved per the source-conflict policy,
      not smoothed; Russell's subsequent-water range (70-90 C) and
      Miller's second water (ca. 80 C) do agree. The rake /
      semi-lauter / full-lauter tun taxonomy
      remains Russell-specific; Miller covers lautering and mash
      filters without that three-way naming.


