# --- Identity ---------------------------------------------------------------
id: low-wines
title: Low wines
kind: glossary


# --- Summary & Body ---------------------------------------------------------
summary: |
  Low wines are the product of the first (wash-still)
  distillation in Scotch malt whisky production: the wash, at
  7-9% ABV, distilled to a partial concentration in the
  low-twenties percent ABV. No cut is made at this stage — the
  entire wash-still output is collected as low wines, a bulk
  concentration step. The low wines are then redistilled in the
  spirit still, where the spirit cut is made. In double
  distillation the low wines are combined with the foreshots and
  feints recycled from the previous spirit-still run to form the
  spirit-still charge [1][2].

body: null


