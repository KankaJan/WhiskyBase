# --- Sources ----------------------------------------------------------------
sources:
  - id: 1
    type: book
    citation: |
      Nicol, D.A., "Batch distillation", Chapter 14 in
      Russell, I., Stewart, G. & Kellershohn, J. (eds.),
      Whisky and Other Spirits: Technology, Production and
      Marketing, 3rd edition, Academic Press (Elsevier), 2022,
      pp 247-271.
    accessed: 2026-05-20
    notes: |
      Russell ed. 2022 Ch 14 (Nicol): the wash still produces
      low wines, whose strength and temperature are recorded by
      hydrometer in the spirit safe, corrected to 20 degrees C,
      every 15 minutes through the cycle (p 257); the spirit safe
      monitors "the strength of low wines from a wash still"
      distinct from the foreshots, middle cut and feints from the
      spirit still (p 255). Russell gives the combined
      spirit-still charge — low wines plus recycled foreshots and
      feints — as not exceeding 30% ABV (p 261); a
      low-wines-alone strength is not separately stated, hence the
      soft "low-twenties percent" figure used here.
  - id: 2
    type: book
    citation: |
      Miller, G.H., Whisky Science: A Condensed Distillation,
      2nd edition, Springer International Publishing, 2024.
      ISBN 978-3-031-50686-4.
    accessed: 2026-05-20
    notes: |
      Miller Ch 7 models the first pot distillation producing
      strong then weak low wines as the distillate strength falls
      (p 332); the combined low-wines strength depends on the cut
      scheme. Confirms low wines as the intermediate charge for
      the second distillation.


