# --- Identity ---------------------------------------------------------------
id: bere
title: Bere
kind: glossary


# --- Summary & Body ---------------------------------------------------------
summary: |
  Bere is a six-row landrace barley cultivated in Scotland for
  several centuries, predating the modern two-row malting barleys
  bred from the 19th century onward. It is a six-row Hordeum
  vulgare landrace, distinct from contemporary
  malting varieties; field cultivation persists at small scale,
  primarily on Orkney where it is grown for the Birsay (Barony)
  Mill and used by local breweries and distilleries (including
  Highland Park's experimental releases and Bruichladdich's Bere
  Barley series). Bere yields lower than modern varieties (typical
  yields ~2-3 t/ha versus 6-8 t/ha for Concerto), gives lower
  extract during mashing, and produces a spirit profile described
  in trade reviews as more grain-forward and rustic compared with
  modern-variety equivalents [1]. Agronomic and malting-relevant
  work on Bere has been published by researchers at Orkney
  College / UHI (Wishart and others) and the Scottish Agricultural
  College / SRUC; the variety is recorded in the European
  Cooperative Programme for Plant Genetic Resources (ECPGR) barley
  landrace inventories as a heritage genetic resource.


