    notes: |
      Representative peer-reviewed source on Bere as a cultivated
      grain. The paper covers compositional analysis rather than
      malting / distilling specifically, but is one of the
      few primary-literature references on Bere in current
      cultivation. Specific distilling-relevant claims (lower
      extract, distinctive spirit character) require further
      sourcing — Wishart's later work at Orkney College / UHI is
      the natural follow-up. See TODO §Cross-cutting research
