# --- Identity ---------------------------------------------------------------
id: marrying
title: Marrying
kind: glossary


# --- Summary & Body ---------------------------------------------------------
summary: |
      Marrying is the resting of a blended or vatted whisky —
      left together, usually in cask or vat, for a period after
      blending — to let the component whiskies' flavours integrate
      before bottling. It is the integration step that follows
      vatting (the combining of the casks together), not the combining
      itself. It is not a legal requirement of Scotch whisky.
      Producers that practise it hold that marrying yields a more
      rounded, smoother result, and tasting panels can often
      distinguish married from unmarried blends; the effect is not,
      however, currently explained by chemical analysis [1]. A continuous,
      perpetual form is Glenfiddich's Solera Vat (see the
      glenfiddich-15-solera bottling), a large vatting vessel kept
      always partly full so that each new batch marries with the
      residue of earlier fillings before bottling.


