    notes: |
      Ch 17 (Macleod, Blending), "Marrying and finishing":
      marrying is a traditional industry term for a specified period
      of maturation or resting carried out immediately after blending,
      allowing the component whiskies' flavour profiles to interact. It
      is not a legal requirement; producers that practise it hold it
      yields a more rounded, smoother blend, and tasting panels can
      often distinguish married from unmarried blends — but the
      perception "cannot currently be explained through chemical
      analysis". Single-source and carrying that documented hedge, so
      the entry is held at confidence: medium.


