id: guaiacol
title: guaiacol
kind: glossary


# --- Summary & Body ---------------------------------------------------------
summary: |
  Guaiacol is 2-methoxyphenol — a phenol ring with a methoxy
  (OCH3) substituent in the position adjacent to the hydroxyl
  (molecular formula C7H8O2) [1]. In whisky chemistry, guaiacol
  reaches the spirit through two distinct production pathways: as
  one of the seven phenolic compounds deposited on malt during
  peat-fired kilning (counted in standard HPLC PPM measurement),
  and separately from oak lignin degradation during cask charring
  and maturation. Sensory associations in the whisky context are
  with smoke and sweet-woody character.

