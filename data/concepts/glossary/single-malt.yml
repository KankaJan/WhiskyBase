# --- Identity ---------------------------------------------------------------
id: single-malt
title: Single malt Scotch whisky
kind: glossary


# --- Summary & Body ---------------------------------------------------------
summary: |
  "Single malt Scotch whisky" is one of the five protected category
  designations under the Scotch Whisky Regulations 2009. The
  regulation defines it as a Scotch whisky produced from only water
  and malted barley at a single distillery by batch distillation in
  pot stills [1]. "Single" refers to single-distillery origin, not
  to a single cask or single batch; a standard single malt release
  typically vats spirit from many casks at the distillery, all
  produced from the same recipe. The other four protected
  categories under the 2009 Regulations are single grain, blended
  malt, blended grain, and blended Scotch whisky.

