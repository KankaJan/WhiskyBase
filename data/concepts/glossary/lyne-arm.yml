id: lyne-arm
title: lyne arm
kind: glossary


# --- Summary & Body ---------------------------------------------------------
summary: |
  The lyne arm is the pipe carrying spirit vapour from the head of a
  pot still to the condenser. Its geometry — particularly the angle
  it leaves the still at (ascending, horizontal, or descending) and
  any bends or downward kinks — influences how much vapour falls
  back into the still as reflux versus continuing to the condenser.
  Ascending lyne arms increase reflux and produce lighter spirit
  with more copper-spirit contact; descending lyne arms reduce
  reflux and produce heavier spirit. The lyne arm is also one of
  the surfaces over which the copper conversation continues.

