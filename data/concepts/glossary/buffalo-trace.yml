# --- Summary & Body ---------------------------------------------------------
summary: |
  Buffalo Trace is a Kentucky bourbon distillery operated by
  Sazerac Company at Frankfort, Kentucky, and one of the most
  prominent US producers of premium and limited-release bourbon.
  As with Heaven Hill (see glossary/heaven-hill), Buffalo Trace's
  relevance to Scotch is as a source of ex-bourbon barrels — US
  federal regulation requires straight bourbon to be aged in new
  charred-oak barrels [1], releasing single-use barrels to the
  international whisky cooperage market. Buffalo Trace is among
  the named providers of ex-bourbon barrels in WhiskyBase
  populated entries (Bruichladdich Octomore 8.1, Harris Hearach
  Batch 1 batches at substantial proportions), where producers
  have chosen to disclose cooperage origin. The distillery is
  also notable for its experimental product lines (Antique
  Collection, Single Oak Project) but these are not directly
  relevant to Scotch ex-bourbon supply.


