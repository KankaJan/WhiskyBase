# --- Identity ---------------------------------------------------------------
id: caramel-colouring
title: Caramel colouring
kind: glossary


# --- Summary & Body ---------------------------------------------------------
summary: |
  Caramel colouring (E150a, "plain caramel" or "spirit caramel")
  is the only colouring permitted in Scotch whisky. Under the
  Scotch Whisky Regulations 2009 nothing may be added to Scotch
  whisky except water and plain caramel colouring. It is used in
  small quantities to even out the natural colour variation
  between casks and batches, so a brand presents a consistent
  appearance; at the quantities used it is regarded as
  flavour-neutral. Producers that decline to use it describe a
  bottling as natural-colour [1]. The fuller presentation
  context — natural colour, chill-filtering, bottling strength —
  is covered by the scotch-presentation-conventions page.

