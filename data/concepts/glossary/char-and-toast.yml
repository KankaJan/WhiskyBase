# --- Identity ---------------------------------------------------------------
id: char-and-toast
title: Charring and toasting
kind: glossary


# --- Summary & Body ---------------------------------------------------------
summary: |
      Charring and toasting are the heat treatments applied to
      the inside of a cask during its manufacture — the step that most
      strongly determines the character the cask will give a maturing
      spirit. After the staves are bent to shape, the cask interior is
      heated: toasting is slower, lower-temperature heating that
      develops flavour compounds in a layer below the wood surface;
      charring is the brief setting-alight of the interior to produce a
      carbonised surface layer. The char layer also adsorbs and removes
      harsher spirit compounds during maturation. Bourbon barrels are
      charred, and by US law must be new charred oak [1][2].


