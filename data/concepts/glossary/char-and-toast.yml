# --- Sources ----------------------------------------------------------------
sources:
  - id: 1
    type: book
    citation: |
      Conner, J., "Maturation", Chapter 16 in Russell, I.,
      Stewart, G. & Kellershohn, J. (eds.), Whisky and Other
      Spirits: Technology, Production and Marketing, 3rd edition,
      Academic Press (Elsevier), 2022.
    accessed: 2026-05-21
    notes: |
      Russell ed. 2022 Ch 16 (Conner, Maturation), cask-manufacture
      section: heating the inside of the cask shell is "probably the
      most important stage of barrel production as it defines the
      character the cask will confer". The shell is first heated to
      230-260 degrees C for about 15 minutes to set the staves, then
      charred by setting the interior alight until the required degree
      of char is reached; the char and toast layers govern the
      maturation character. Char-mediated reduction of sulphur
      compounds (e.g. dimethyl disulphide) occurs largely in the early
      maturation period.

  - id: 2
    type: book
    citation: |
      Miller, G.H., Whisky Science: A Condensed Distillation,
      2nd edition, Springer International Publishing, 2024.
      ISBN 978-3-031-50686-4.
    accessed: 2026-05-21
    notes: |
      Miller Ch 8 (Maturation): cask charring and toasting raise
      the concentration of wood-derived flavour compounds available for
      extraction (e.g. vanillin is greatly increased by heat
      treatment), and the carbonised layer contributes the subtractive,
      adsorptive side of maturation.


