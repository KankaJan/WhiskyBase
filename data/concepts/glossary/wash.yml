# --- Identity ---------------------------------------------------------------
id: wash
title: Wash
kind: glossary


# --- Summary & Body ---------------------------------------------------------
summary: |
      The wash is the fermented liquid produced in the
      washback and charged to the wash still for the first
      distillation. It is cooled wort fermented with distiller's yeast,
      typically reaching 7-9% ABV from an original gravity of about
      1050-1060 degrees. The wash is, in effect, an unhopped beer
      brewed for distillation rather than for drinking; it carries the
      alcohol, the fermentation congeners, and (after longer
      fermentations) the products of lactic-acid-bacteria activity that
      the still will concentrate into low wines [1][2].


body: null


