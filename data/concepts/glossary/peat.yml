# --- Identity ---------------------------------------------------------------
id: peat
title: Peat
kind: glossary


# --- Summary & Body ---------------------------------------------------------
summary: |
      Peat is partially decomposed organic matter — mosses,
      grasses and other plants accumulated over long periods under
      waterlogged, oxygen-poor conditions. In Scotch whisky it is
      burned as a kiln fuel during malting: peat smoke deposits
      phenolic compounds on the malt that survive into the spirit as
      "peated" character. Peat for the whisky industry is cut at a
      small number of sites, notably on Islay, Orkney and at St Fergus
      on the mainland; the source peat's composition and degree of
      decomposition affect the phenols produced. Peatlands are a major
      carbon store, and the industry's extraction is a small fraction
      of total UK peat use [1][2].


