# --- Sources ----------------------------------------------------------------
sources:
  - id: 1
    type: book
    citation: |
      Russell, I., Stewart, G. & Kellershohn, J. (eds.),
      Whisky and Other Spirits: Technology, Production and
      Marketing, 3rd edition, Academic Press (Elsevier), 2022.
    accessed: 2026-05-21
    notes: |
      Russell ed. 2022 Ch 10 (Bringhurst, Harrison & Brosnan),
      p 146: peat is "organic sediment formed under waterlogged
      conditions from the partial decomposition of mosses and other
      bryophytes, grasses, shrubs, or trees"; in Scotland peatlands
      cover more than 20% of the land surface; extraction for the
      whisky industry is carried out at a small number of sites
      (notably Islay, Orkney, St Fergus), at less than 1% of UK peat
      extraction; peatlands are a significant carbon store.

  - id: 2
    type: book
    citation: |
      Miller, G.H., Whisky Science: A Condensed Distillation,
      2nd edition, Springer International Publishing, 2024.
      ISBN 978-3-031-50686-4.
    accessed: 2026-05-21
    notes: |
      Miller Ch 3 (Malting): phenols from peat combustion enter
      the process during kilning; peatiness correlates with phenol,
      cresols and guaiacols deposited on the malt (pp 149, 166, 173).


