# --- Identity ---------------------------------------------------------------
id: bairds-malt
name: Bairds Malt Ltd
also_known_as:
  - Bairds
  - Bairds of Inverness
website: https://www.bairds-malt.co.uk/


# --- Type -------------------------------------------------------------------
type: maltster


# --- Location ---------------------------------------------------------------
country: United Kingdom              # Operates across Scotland and
                                     # England; Inverness is the
                                     # most-referenced site for Scotch
                                     # supply.
region: null                         # Multi-region operator; the
                                     # `sites:` list below provides
                                     # the regional breakdown.


# --- Sites ------------------------------------------------------------------
sites:
  - id: inverness
    name: Bairds of Inverness
    country: Scotland
    locality: Inverness
    capabilities: |
      Drum malting, peated and unpeated capability, HPLC-based
      phenol measurement for the peated specification range used
      by Scotch distillery customers. The Inverness site is the
      most-referenced Bairds plant in WhiskyBase populated data:
      named maltster for Harris Distillery's Hearach core line
      and for several Bruichladdich peated releases (Islay Barley
      vintages, Octomore 8.3) [1][2].

  - id: pencaitland
    name: Bairds Pencaitland
    country: Scotland
    locality: Pencaitland, East Lothian
    capabilities: |
      Malting site in the Scottish Lowlands; serves Scotch and
      English whisky operations. Specific customer relationships
      are not consistently disclosed [1].

  - id: witham
    name: Bairds Witham
    country: England
    locality: Witham, Essex
    capabilities: |
      English malting site; supplies English distillers and
      brewing operations. Less commonly cited in Scotch-specific
      sourcing disclosures because of distance from Scottish
      distillery sites [1].


# --- Status & Timeline ------------------------------------------------------
status: operating
founded: null                        # Bairds malting has a long history
                                     # (the family malting business dates
                                     # to the 19th century, but the modern
                                     # corporate form has shifted across
                                     # parent groups). A precise founding
                                     # year for the current corporate
                                     # entity is not currently sourced
                                     # in this entry — see SCHEMA-GAPS.


# --- Ownership --------------------------------------------------------------
ownership:
  current: Bairds Malt Ltd            # Operating-company name; the
                                      # company has historically been
                                      # part of larger malting / food-
                                      # ingredient groups.
  parent: null                        # Specific parent group / holding-
                                      # company structure varies over
                                      # time; not currently sourced
                                      # against primary records.
  history: []                         # Ownership-history reconstruction
                                      # requires Companies House filings
                                      # or sector-history sources;
                                      # deferred.


# --- Products / Capabilities ------------------------------------------------
products:
  - type: unpeated_malt
    description: |
      Standard unpeated malted barley to customer-specified
      varieties (Concerto, Optic, and others) and standard
      brewing / distilling specifications.

  - type: peated_malt
    description: |
      Peated malted barley at customer-specified phenol levels,
      measured by HPLC. Spec ppm range covers the Scotch malt
      industry's peated-style needs from lightly peated
      (~5-20 ppm) through heavily peated (~50-80 ppm) and the
      extreme-peating segment (~100-260 ppm for the Octomore
      sub-series). Methodology cross-reference:
      `methodology/harris-published-ppm` documents the HPLC
      standard-seven-phenols approach as used at the Inverness
      site [2].


# --- Supplies to ------------------------------------------------------------
supplies_to:
  - harris                            # Harris Distillery (Hearach core
                                      # line) — confirmed via the
                                      # production_line.malt.maltster
                                      # field on harris-the-hearach.
  - bruichladdich                     # Bruichladdich Distillery — for
                                      # Islay Barley series and Octomore
                                      # 8.3 batch (confirmed via
                                      # production_line maltster fields
                                      # and bottling notes [3]).


# --- Description ------------------------------------------------------------
description: |
  Bairds Malt Ltd is a UK commercial maltster operating from sites
  at Inverness (Scotland), Pencaitland (East Lothian, Scotland),
  and Witham (Essex, England). The Inverness site supplies peated
  and unpeated malt to Scotch malt distilleries including Harris
  and Bruichladdich; Bairds operates HPLC-based phenol measurement
  for the peated specifications and reports spec-stage ppm values
  to customer distilleries [1][2]. The company is one of the
  principal commercial maltsters serving the Scotch industry
  alongside Crisp Malt, Simpsons Malt, Muntons, and Boortmalt (see
  `practice/external-malting`).


