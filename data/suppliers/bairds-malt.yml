# =============================================================================
# SCHEMA-GAPS observed during this pressure-test
# =============================================================================
# Notes for a possible v0.1 → v0.2 promotion. Mirrors the Cadenhead's
# pressure-test pattern that drove bottler v0.1 → v0.2.
#
# 1. **Products list shape works adequately.** The free-text `products:`
#    list with `type:` + `description:` accommodates Bairds's two
#    principal output classes (peated and unpeated malt) cleanly.
#    The `type:` field is left freeform (not enum-restricted) on the
#    v0.1 design; this is the right call for now because product
#    categorisation differs across supplier types (a yeast supplier's
#    products wouldn't fit a maltster's enum). When 3-4 supplier
#    entries are populated, consider adding an OPTIONAL per-type
#    enum that activates based on the supplier's `type` field.
#
# 2. **Capabilities at site level vs product level.** Currently the
#    HPLC phenol measurement capability is recorded both in
#    `sites[0].capabilities` (free text) and via the `products[]`
#    entry for peated malt. This duplication is unavoidable while
#    the products list is supplier-level rather than site-level.
#    The schema could add an OPTIONAL `produced_at_sites:` field on
#    each product entry, listing the site IDs where that product is
#    produced. Defer until a multi-site supplier with site-specific
#    products forces the pattern.
#
# 3. **Founding year hedge.** Bairds Malt's founding year is not
#    currently sourced. The v0.1 schema accepts `founded: null`
#    cleanly, so the schema isn't blocking — but the gap reflects
#    a general need for company-history primary sources (Companies
#    House filings, sector histories like Moss & Hume 1981).
#
# 4. **Site-specific external_ids.** The current schema has
#    `external_ids:` at the supplier level only. Multi-site
#    suppliers may have per-site identifiers (Companies House
#    plant registrations, environmental-permit numbers). Defer
#    until a real entry requires this.
#
# 5. **No `notes` field at top level.** The bottler and distillery
#    schemas don't have top-level `notes:` either; consistency
#    preserved. SCHEMA-GAPS / SCHEMA-OBSERVATIONS comment blocks
#    (as used here) handle the same role.
#
# 6. **`supplies_to:` list captures distillery slugs without
#    relationship metadata.** Bairds supplies Harris on what
#    appears to be a primary / exclusive basis for the Hearach
#    core line, but Bruichladdich on a partial / vintage-batch
#    basis. The schema cannot currently distinguish these supply
#    relationship types. If a future entry requires this, the
#    `supplies_to:` shape could change from a list of slugs to a
#    list of objects: `{distillery: <slug>, relationship_type:
#    primary|batch|trial, notes: ...}`. Defer until concrete need.
#
# Overall: v0.1 schema accommodates Bairds adequately. None of the
# observed gaps require a v0.2 promotion at this point. The schema
# stays at v0.1 with Bairds Malt as its first populated entry; the
# next pressure-test (a yeast supplier or a cooperage source entry)
# will provide further data for a possible promotion.
