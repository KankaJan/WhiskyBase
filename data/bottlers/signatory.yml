# --- Historical note: v0.2 schema rationale -------------------------------
# This entry's pressure-test against bottler v0.1 surfaced two gaps
# that drove the v0.2 schema bump (applied 2026-05-15):
#
# 1. Series with consistent presentation rules (CSC, UCF, 100 Proof)
#    forced bottlings to redundantly restate the same fields
#    (cask_strength, non_chill_filtered, etc.) on every entry.
#    v0.2 fix: `presentation_defaults:` block per series.
#
# 2. The Decanter Collection is a presentation variant of CSC
#    rather than a wholly separate series, but v0.1's flat list
#    modelled all series as peers. v0.2 fix: optional `parent:`
#    field on the series shape.
#
# Both features are now in active use in this entry's series
# block. The bottler v0.1 stub schema's pre-promotion design
# carried hypotheses about what these features should look like
# (see the Cadenhead's SCHEMA-GAPS block at the end of
# `data/bottlings/cadenheads-bunnahabhain-stub.yml`); the v0.2
# design as applied here is data-driven from Signatory's actual
# series structure rather than from the Cadenhead's hypotheses
# alone.


# --- Metadata ---------------------------------------------------------------
schema_version: 0.2
confidence: medium
last_reviewed: 2026-05-15
contributors: []
