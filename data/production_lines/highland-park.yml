  peat_origin: local                  # Local Orkney peat cut at
                                      # Hobbister Moor (south-west of
                                      # the distillery). Heather-
                                      # dominated peat composition
                                      # distinct from mainland-
                                      # Scotland and Islay
                                      # moss-dominated peat;
                                      # producer-attributed aromatic
