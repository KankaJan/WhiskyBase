    The Highland Park spirit's peated character is at the
    moderate end of the Scotch peating spectrum (around 20 ppm
    spec); the line is not heavily peated in the Islay sense.
    Producer-attributed character notes ("heather honey",
    "smoky") cite the heather-peat composition; specific phenol
    profiling against the standard-seven-phenols HPLC framework
    is not currently sourced.


