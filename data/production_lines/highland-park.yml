# --- Description ------------------------------------------------------------
description: |
  The Highland Park production line operates at the namesake
  distillery on Mainland Orkney, producing a single moderately-
  peated malt that has been the site's sole spirit recipe
  throughout its operational history [1]. Partial on-site floor
  malting (commonly cited at around 20% of grain requirement)
  uses local Orkney peat from Hobbister Moor; the heather-
  dominated peat composition gives the spirit's smoky component
  a producer-attributed character distinct from moss-dominated
  Islay and mainland-Scotland peat, though the specific
  phenol-profile differences are not separately quantified
  against the standard-seven-phenols HPLC framework in current
  sourcing. The maturation programme is sherry-cask-heavy
  (oloroso ex-sherry butts predominantly, with ex-bourbon
  barrels supplementing) and uses coastal dunnage warehousing
  on the Orkney site [1][2].


