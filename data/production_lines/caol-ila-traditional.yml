# --- Identity ---------------------------------------------------------------
id: caol-ila-traditional
name: Caol Ila (traditional, heavily-peated default)
distillery: caol-ila


# --- Status & Timeline ------------------------------------------------------
status: active
first_produced: 1846                  # Concurrent with distillery
                                      # founding. Equipment configuration
                                      # post-1974 reconstruction; the
                                      # production recipe itself has
                                      # remained the heavily-peated
                                      # default throughout.
discontinued: null


# --- Recipe: Malt -----------------------------------------------------------
malt:
  source: bought_in
  maltster: Port Ellen Maltings       # Diageo-operated Port Ellen
                                      # Maltings on Islay supplies the
                                      # peated malt for Caol Ila as
                                      # for the other Diageo Islay
                                      # distilleries (Lagavulin etc.).
                                      # See lagavulin production_line
                                      # for the parallel supply chain.
  variety: null                       # Variety not consistently
                                      # disclosed at the line level.


# --- Recipe: Peating --------------------------------------------------------
peating:
  measurements:
    - stage: spec
      value:
        - 30
        - 35                          # Range commonly cited in
                                      # trade press; Caol Ila spec
                                      # phenol is similar to
                                      # Lagavulin and at the
                                      # moderate-to-heavy end of the
                                      # Islay peating spectrum.
                                      # Specific producer disclosure
                                      # for a precise ppm figure not
                                      # consistently sourced.
      unit: ppm
      method: unspecified
      compounds: unspecified
      source_id: 1
      notes: |
        Spec-stage figure inherited from the Port Ellen Maltings
        supply specification. As with other Diageo Islay
        distilleries (Lagavulin), the producer-disclosed ppm
        figure represents the maltster's spec rather than the
        in-bottle phenol concentration; see
        methodology/scotch-whisky-published-ppm for the
        general methodology-disclosure pattern.
  peat_origin: local                  # Islay peat supplied via Port
                                      # Ellen Maltings; the
                                      # maltings cut peat from
                                      # Castlehill bog and Glenmachrie
                                      # bog on Islay.
  notes: |
    Caol Ila is moderately-to-heavily peated, sharing the broad
    spec-ppm range of Lagavulin and other Diageo Islay
    distilleries. Trade-press characterisation of the resulting
    spirit usually emphasises a cleaner, less briny profile than
    the south-coast Islay producers — attributed in producer
    materials to the tall lantern stills and the east-coast site
    exposure rather than to a different peating regime.


