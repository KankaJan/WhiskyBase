  hours_min: null
  hours_max: null
  hours_typical: null
  yeast: null
  notes: null


# --- Recipe: Distillation ---------------------------------------------------
distillation:
  regime: double                      # Conventional double
                                      # distillation.
  spirit_cut:
    start_abv: null
    end_abv: null
    notes: |
      Specific cut points not disclosed in current sourcing.
  new_make_abv: null


# --- Recipe: Maturation -----------------------------------------------------
default_fill_strength_abv: null
typical_cask_program:
  - bourbon-barrel                    # Ex-bourbon barrels predominate
                                      # in the core Caol Ila programme,
                                      # consistent with the Diageo
                                      # cask strategy for heavily-
                                      # peated Islay spirit.
  - oloroso-sherry-butt               # Sherry-cask component appears
                                      # in some limited releases
                                      # and in the Distillers Edition
                                      # programme (which uses a
                                      # secondary finish in fortified
                                      # Moscatel casks rather than
                                      # primary sherry-cask
                                      # maturation).


# --- Bottlings --------------------------------------------------------------
bottlings:
  - caol-ila-12
  - caol-ila-distillers-edition


# --- Description ------------------------------------------------------------
description: |
  The Caol Ila Traditional production line is the distillery's
  predominant output: a heavily-peated Islay single malt at
  spec phenol level in the 30-35 ppm range, supplied with peated
  malt from Diageo's Port Ellen Maltings on Islay [1][2].
  Distilled in six large pot stills (three wash + three spirit,
  lantern-shape, indirect-steam-heated, shell-and-tube
  condensers) in the post-1974-reconstruction configuration.
  The maturation programme is ex-bourbon-led for the core
  releases, with sherry-cask and fortified-wine-cask components
  appearing in limited and special releases. The bulk of the
  production line's output historically supplies Diageo blends
  (notably the Johnnie Walker family); the single-malt release
  programme expanded materially with the 2002 Hidden Malts
  launch and now includes the Caol Ila 12 Year Old flagship
  alongside annual Distillers Edition and Special Releases
  programmes.


