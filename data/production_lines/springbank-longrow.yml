        compounds: standard_7
        basis_concept: methodology/scotch-whisky-published-ppm
        notes: |
          Springbank does not publish an explicit methodology
          attribution. Inherits the broader Scotch industry
          convention.
    notes: |
      Springbank's own website. Used for malt specification,
      Longrow line characterisation, and 1973 first-distillation
      date.

  - id: 2
