# --- Description ------------------------------------------------------------
description: |
  Sole production line at Ardnahoe: a peated Islay single malt (~40 ppm)
  [2] distilled on one wash and one spirit still and condensed through worm
  tubs with unusually long lye pipes [1]. Maturation is in ex-bourbon and
  oloroso sherry casks. The first whisky, the 2024 five-year-old Inaugural
  Release, was bottled at 50% ABV.


