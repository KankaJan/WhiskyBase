# --- Description ------------------------------------------------------------
description: |
  Sole production line at the Macallan distillery: an unpeated Speyside
  single malt distilled on short, squat copper pot stills (3,900 L
  spirit-still charge volume per Wikipedia [1]), among the smallest in
  Scotland — a configuration the producer treats as central to the rich,
  mid-weight spirit character. The defining maturation choice is
  sherry-cask-led: the Sherry Oak core range (12, 18, 25, 30, 40 Year
  Old) is matured exclusively in oloroso-seasoned oak sherry casks
  sourced from Jerez de la Frontera, historically a mix of European oak
  (Quercus robur) and American oak (Quercus alba) [1]. The 2004 Fine Oak
  range — renamed Triple Cask Matured in 2018 — added ex-bourbon
  American-oak casks alongside the European-oak and American-oak sherry
  casks, giving a three-cask programme [1]. The Double Cask range vats
  two oloroso-seasoned cask types (European-oak and American-oak) with no
  ex-bourbon component. In September 2023 Edrington acquired the
  Vasyma cooperage in Jerez, extending the sherry-cask supply chain
  vertically [2].


