# --- Description ------------------------------------------------------------
description: |
  The Glenfarclas production line is the single recipe run at
  the namesake Speyside distillery: an unpeated single malt with
  a sherry-cask-led house style, distilled in six direct-fired
  pot stills (three wash + three spirit) [1][2]. The direct-
  fired distillation is the line's defining process feature —
  gas heating applied directly under the still copper rather
  than the modern indirect-steam standard — contributing to a
  heavier-bodied, more sulphury new make than the indirect-
  steam-heated Speyside norm. The cask programme predominantly
  uses oloroso ex-sherry butts (with ex-bourbon barrels
  supplementing in younger and limited releases), producing
  the characteristic dark-fruit / dried-fruit / nutty profile
  the line is known for. The family-tree core range spans 10 to
  40 year age statements, with the separate Family Casks vintage-
  specific cask-strength programme covering distillation years
  back to the 1950s.


