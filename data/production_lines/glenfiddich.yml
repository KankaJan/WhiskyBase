# Glenfiddich (default production line)
# =============================================================================
# Schema: production_line.template.yml v0.2.1
# Entry confidence: medium — line-level identity, unpeated default
# and broad production characteristics are well-grounded. Specific
# fermentation, spirit-cut, and yeast figures hedged pending direct
