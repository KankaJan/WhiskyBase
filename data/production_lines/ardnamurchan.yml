# --- Description ------------------------------------------------------------
description: |
  Sole production line at Ardnamurchan: a west-Highland make distilled on
  one wash and one spirit still, run as alternating peated and unpeated
  campaigns. The core single malt vats the two styles roughly 50:50 and is
  matured in ~65% ex-bourbon and ~35% sherry casks, bottled non-chill-
  filtered and naturally coloured at 46.8% ABV [2]. The distillery
  publishes the full cask composition of each release.


