# --- Description ------------------------------------------------------------
description: |
  Sole production line at Aberlour: one unpeated Speyside single malt
  distilled on two wash and two spirit stills [1]. The bottlings are
  maturation variants of this single make. The core range is built on
  "double cask" maturation — ex-bourbon American oak married with
  oloroso-seasoned sherry casks (the 12 and 16 Double Cask Matured) —
  while A'bunadh is matured exclusively in first-fill oloroso sherry butts
  at cask strength.


