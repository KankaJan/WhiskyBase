# --- Recipe: Maturation -----------------------------------------------------
default_fill_strength_abv: null            # Not surveyed.
typical_cask_program:
  - bourbon-barrel                          # American-oak ex-bourbon — the
                                            # backbone of the core range
                                            # (12 Year Old).
  - oloroso-sherry-butt                     # European-oak sherry component
                                            # (12 Year Old's European oak;
                                            # Nadurra Oloroso).
  - french-oak-cask                         # New French (Limousin) oak,
                                            # selective — the 15 Year Old
                                            # French Oak Reserve.


# --- Bottlings --------------------------------------------------------------
bottlings:
  - glenlivet-12-year-old
  - glenlivet-15-french-oak-reserve
  - glenlivet-nadurra-oloroso


# --- Description ------------------------------------------------------------
description: |
  Sole production line at The Glenlivet distillery: one unpeated, light
  Speyside single malt distilled on tall, lantern-shaped copper pot
  stills with long necks, a geometry that promotes high reflux and a
  clean, floral, fruity spirit [1]. The bottlings are maturation variants
  of this single make rather than distinct production regimes. The core
  range is American-oak (ex-bourbon) led, with a European-oak sherry
  component in the 12 Year Old; the 15 Year Old French Oak Reserve adds
  selective maturation in new French (Limousin) oak, and the cask-strength
  Nadurra Oloroso is matured in first-fill oloroso sherry casks. Malt is
  bought in from Crisp Maltings at Portgordon [1].


