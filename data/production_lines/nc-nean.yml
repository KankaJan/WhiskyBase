# --- Description ------------------------------------------------------------
description: |
  Sole production line at Nc'nean: an unpeated, organic single malt
  distilled on one wash and one spirit still. Maturation leans on STR
  (shaved, toasted, re-charred) red-wine casks alongside ex-bourbon and a
  little oloroso sherry — an unusually wine-cask-led programme for a
  Scotch single malt — and the spirit is bottled non-chill-filtered at
  46% ABV [1].


