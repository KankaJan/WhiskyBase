# =============================================================================
# Cameronbridge (production line)
# =============================================================================
# Schema: production_line.template.yml v0.2.1
# Sole production line at Cameronbridge: a continuous (column / Coffey)
# grain-whisky make from a wheat-led cereal bill. First `regime: continuous`
# line in the project (CHANGELOG [0.8.6]). The cereal bill is captured in
# prose (the malt block is barley-centric) — see cameronbridge.NOTES.md.
# =============================================================================


# --- Identity ---------------------------------------------------------------
id: cameronbridge
name: Cameronbridge
distillery: cameronbridge


# --- Status & Timeline ------------------------------------------------------
status: active
first_produced: null
discontinued: null


# --- Recipe: Malt -----------------------------------------------------------
malt:
  source: bought_in                        # The malted-barley component (used
                                           # for its enzymes) is bought in.
  maltster: null
  variety: null                            # The malt block covers only the
                                           # malted-barley component. The full
                                           # cereal bill (wheat-led, with malted
                                           # barley for enzymes) is in the
                                           # structured `cereal_bill` block
                                           # below. Exact proportions for
                                           # Cameronbridge are not sourced.


# --- Recipe: Peating --------------------------------------------------------
peating:
  measurements: []                         # Unpeated grain whisky.
  peat_origin: none
  notes: |
    Cameronbridge grain whisky is unpeated.


# --- Recipe: Fermentation ---------------------------------------------------
fermentation:
  hours_min: null
  hours_max: null
  hours_typical: null
  yeast: null
  notes: null


# --- Recipe: Distillation ---------------------------------------------------
distillation:
  regime: continuous                       # Continuous column / Coffey
                                           # distillation, not batch pot
                                           # stills [1] — the first
                                           # `continuous` line in the data set.
  spirit_cut:
    start_abv: null                        # The pot-still cut concept does not
    end_abv: null                          # apply to a continuous column.
    notes: |
      Continuous column distillation has no batch "cut" in the
      pot-still sense; collection strength is set by the column rather
      than by a stillman selecting heads/heart/tails.
  new_make_abv: null                       # Grain new-make comes off at a high
                                           # strength (close to the 94.8% ABV
                                           # regulatory ceiling above which a
                                           # Scotch spirit is no longer
                                           # whisky) — far lighter / more
                                           # neutral than malt new make. A
                                           # Cameronbridge-specific figure is
                                           # not in the surveyed sources.


# --- Recipe: Maturation -----------------------------------------------------
default_fill_strength_abv: null
typical_cask_program:
  - bourbon-barrel                          # Grain whisky is matured
                                            # predominantly in refill /
                                            # ex-bourbon American oak.


# --- Bottlings --------------------------------------------------------------
bottlings:
  - cameron-brig
  - haig-club
  - haig-club-clubman


# --- Cereal bill ------------------------------------------------------------
cereal_bill:
  - cereal: wheat
    proportion: null                       # Wheat-led; exact proportion not
    malted: false                          # sourced for Cameronbridge.
  - cereal: malted_barley
    proportion: null
    malted: true
    notes: |
      A smaller malted-barley fraction supplies the enzymes that convert
      the wheat starch. Proportions not sourced (cf. North British, where
      the maize / malted-barley split is disclosed as 85/15).


# --- Description ------------------------------------------------------------
description: |
  Sole production line at Cameronbridge: a continuous (column / Coffey)
  grain-whisky make from a wheat-led cereal bill, with a smaller malted-
  barley fraction for enzymic conversion [1]. The spirit is distilled to a
  high strength (close to the 94.8% ABV regulatory ceiling), giving the
  light, neutral character typical of Scotch grain whisky. Most output goes
  to Diageo blends; the single-grain bottlings carrying the distillery's own
  identity are Cameron Brig (the long-standing official bottling) and the
  Haig Club range (premium, from 2014), both matured in American oak.


