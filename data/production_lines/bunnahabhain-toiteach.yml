# --- Recipe: Maturation -----------------------------------------------------
default_fill_strength_abv: null
typical_cask_program:
  - bourbon-barrel                    # Ex-bourbon barrels predominate
                                      # in the Toiteach / Moine core
                                      # releases.
  - oloroso-sherry-butt               # Sherry-cask component appears
                                      # in some Toiteach limited
                                      # editions; less prominent than
                                      # in the older expressions of the
                                      # Traditional line.


# --- Bottlings --------------------------------------------------------------
bottlings:
  - bunnahabhain-toiteach


# --- Description ------------------------------------------------------------
description: |
  The Bunnahabhain Toiteach production line is the distillery's
  peated sub-line, running periodically alongside the
  predominant lightly-peated Bunnahabhain Traditional production
  using the same equipment and process but with a peated
  commercial malt at substantially higher spec phenol level
  (commonly cited in the 35-40 ppm range, contrasting with the
  Traditional line's 1-2 ppm) [1]. The peated programme is a
  21st-century development at Bunnahabhain, emerging in the
  mid-2000s and consolidated under successive labellings
  (Toiteach, then Moine, then Toiteach again across release
  windows). The line is bottled separately as Toiteach /
  Toiteach a Dha core releases; ex-bourbon barrels predominate
  in the maturation programme.


