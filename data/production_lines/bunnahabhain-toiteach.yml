  source: bought_in
  maltster: null                      # Commercial maltster supplier(s)
                                      # not consistently disclosed.
  variety: null


# --- Recipe: Peating --------------------------------------------------------
peating:
  measurements:
    - stage: spec
      value:
        - 35
        - 40                          # Trade-press characterisation
                                      # of the Toiteach / Moine
                                      # programme as in the 35-40 ppm
                                      # spec range; specific producer
                                      # disclosure for a numeric
                                      # phenol-spec figure not
                                      # consistently sourced. Treated
                                      # as a disclosed range rather
                                      # than a precise figure.
      unit: ppm
      method: unspecified
      compounds: unspecified
      source_id: 1
      notes: |
        Range-form disclosure consistent with producer
        characterisation of Toiteach as "peated" (versus the
        default Bunnahabhain "lightly peated") but without a
        precise ppm number routinely on label. Specific
        measurement method and compound-set not directly
        sourced.
  peat_origin: unknown                # Peat origin for the Toiteach
                                      # malt not consistently disclosed
                                      # in current sources; commercial
                                      # malt supply.
  notes: |
    The Toiteach (Gaelic for "smoky") production runs use a
    peated commercial malt at a substantially higher spec ppm
    than the default Bunnahabhain Traditional production
    (~1-2 ppm). The same equipment, water source, and core
    process are used for both lines; the differentiating
    variable is the malt spec. Successive labellings have
    used "Toiteach" and "Moine" (Gaelic for "peat") across
    release windows; the underlying production line is the
    same.


