# --- Description ------------------------------------------------------------
description: |
  Wine cask previously used to age Amarone della Valpolicella DOCG,
  the dry powerful red wine of the Veneto produced by the appassimento
  method (partial drying of Corvina, Rondinella, and Molinara grapes
  before fermentation). The wine's high alcohol and dense extract
  carry into Scotch maturation as substantial dark-fruit and dried-
  fruit character. Used in Octomore 8.2 as the 2-year finishing cask
  following 6 years of primary maturation in French/Austrian wine
  casks [1].


