# --- Prior Contents ---------------------------------------------------------
prior_contents:
  category: red_wine
  specifics: |
    Amarone della Valpolicella DOCG red wine from the Veneto region of
    northern Italy. Made by drying Corvina, Rondinella, and Molinara
    grapes for ~120 days (the appassimento process) to concentrate
    sugars before fermentation, producing a dry, powerful wine of
    ~15-16% abv with substantial residual extract.


