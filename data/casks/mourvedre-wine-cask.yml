# --- Description ------------------------------------------------------------
description: |
  Wine cask previously used to age wine made predominantly from the
  Mourvèdre grape (also known as Monastrell or Mataró). Mourvèdre is
  the principal grape of Bandol AOC in Provence and a major component
  in southern Rhône blends; the variety produces dark, structured,
  spice-forward wines. The unusual slug — naming a variety rather than
  an appellation — reflects how the cask is most often disclosed
  ("Mourvèdre wine cask") without further regional specification. Used
  in Octomore 8.2 as one of three primary 6-year maturation cask
  types [1].


