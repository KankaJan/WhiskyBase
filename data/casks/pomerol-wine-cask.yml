# --- Description ------------------------------------------------------------
description: |
  225-litre French oak barrique previously used to age Pomerol AOC
  red wine from the Right Bank of Bordeaux. Pomerol wine is Merlot-
  dominant, typically blended with Cabernet Franc, from a small
  appellation east of the Dordogne river. Used in Port Charlotte
  PMC:01 as the second-maturation cask (4 years bourbon + 5 years
  Pomerol), described by the producer as the line's first Pomerol
  release [1].


