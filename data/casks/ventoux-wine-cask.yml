# --- Description ------------------------------------------------------------
description: |
  Wine cask previously used to age Ventoux AOC red wine from the
  southern Rhône Valley. The appellation surrounds Mont Ventoux in
  the Vaucluse; the wines are Grenache and Syrah-led blends, generally
  lighter than Châteauneuf-du-Pape and other better-known southern
  Rhône AOCs. Used in Octomore 8.3 as one of the four named French-
  red-wine cask types in the 44% European-oak share [1].


