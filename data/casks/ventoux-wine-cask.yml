  category: red_wine
  specifics: |
    Ventoux AOC red wine from the southern Rhône, named for Mont
    Ventoux which dominates the appellation geographically. Grenache,
    Syrah, Mourvèdre, and Carignan are the principal grapes;
    blending rules require minimum percentages of Grenache and Syrah.


