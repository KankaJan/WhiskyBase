# --- Description ------------------------------------------------------------
description: |
  Sherry butt previously used to age or season Pedro Ximénez (PX)
  sherry, the sweetest style of the Jerez-Xérès-Sherry DO in
  southern Spain. PX is made from the eponymous grape variety,
  sun-dried before pressing to concentrate the sugars; the
  finished wine is fortified, aged oxidatively in a solera, and
  bottled at very high residual sugar (commonly ~400-500 g/L) —
  producing a near-black, intensely sweet wine with raisin,
  date, fig, and molasses character [1][2]. Vessel capacity is
  conventionally around 500 litres, made from European oak.
  PX-seasoned casks are used in the Scotch industry predominantly
  as finishing casks rather than for full primary maturation:
  the intense residual sweetness of the wood-bound PX sugars
  delivers a strong, fast flavour overlay, and a short finish
  period is usually sufficient. The PX contribution is
  distinctly sweeter and darker than the oloroso contribution
  that the project's `oloroso-sherry-butt` entry covers — PX and
  oloroso are both oxidatively-aged sherry styles, but PX's
  raisined-grape sugar load sets it apart. The project's
  Auchentoshan Three Wood entry exercises this cask type as the
  third stage of its bourbon → oloroso → PX maturation sequence.
  As with the other sherry-cask entries, the seasoning-vs-
  transport-butt distinction and the first-fill / refill
  depletion pattern apply (see
  [cask maturation kinetics](concept/educational/cask-maturation-kinetics)).


