# --- Prior Contents ---------------------------------------------------------
prior_contents:
  category: sherry
  specifics: |
    Pedro Ximénez sherry — the sweetest of the Jerez DO styles,
    made from the Pedro Ximénez grape [1][2]. The grapes are
    sun-dried (raisined) on esparto-grass mats before pressing,
    concentrating the sugars; the resulting wine is fortified and
    aged oxidatively in a solera system. Finished PX is bottled
    at very high residual sugar — commonly in the region of
    400-500 g/L — giving a near-black, treacle-and-raisin wine.
    As with the other Scotch-industry sherry casks, the butt is
    "seasoned" with PX for a period (typically 18-36 months)
    specifically to prepare it for whisky-industry sale; modern
    seasoning practice is distinct from the historical practice
    of using genuinely spent transport butts.


