# --- Description ------------------------------------------------------------
description: |
  Generic sweet wine cask reference, used when the producer's
  disclosure specifies sweet wine but not the appellation. The
  category covers botrytised wines, late-harvest wines, ice wines,
  straw wines, and dried-grape sweet wines (passito) — wines with
  substantial residual sugar from interrupted fermentation rather
  than from fortification. Used in Octomore 8.2 as one of three
  primary 6-year maturation cask types (Mourvèdre, Austrian sweet
  wine, Sauternes); the Austrian sweet wine component is the
  instance for which this slug is used [1].


