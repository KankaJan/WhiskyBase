# --- Prior Contents ---------------------------------------------------------
prior_contents:
  category: sweet_wine
  specifics: |
    Sweet wine of unspecified origin. The category covers
    botrytised wines (Sauternes, Tokaji, Auslese), late-harvest
    wines, ice wines (Eiswein), straw wines (vin de paille,
    Strohwein), and dried-grape sweet wines (passito). Sweetness
    is from residual sugar (interrupted fermentation) rather than
    fortification — fortified sweet wines have their own categories
    (Port, Madeira, sherry).


