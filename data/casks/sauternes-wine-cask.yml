# --- Prior Contents ---------------------------------------------------------
prior_contents:
  category: sweet_wine
  specifics: |
    Sauternes AOC sweet white wine from south of the city of
    Bordeaux, on the left bank of the Garonne river (Sauternes is a
    separate appellation from the neighbouring Graves AOC and is
    not formally part of Graves under the modern Bordeaux AOC
    structure, though the two areas are geographically adjacent).
    Made from Sémillon, Sauvignon Blanc, and Muscadelle grapes
    affected by noble rot (Botrytis cinerea), which concentrates
    sugars and produces a sweet wine with high residual extract.


