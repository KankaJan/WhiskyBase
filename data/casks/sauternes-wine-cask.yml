# --- Description ------------------------------------------------------------
description: |
  225-litre French oak barrique previously used to age Sauternes
  AOC sweet white wine from south of the city of Bordeaux, on the
  left bank of the Garonne river [2]. The base wine is made from
  Sémillon-led blends affected by noble rot, producing a sweet wine
  with high residual sugar. Used in Octomore 8.2 as one of the
  three primary 6-year maturation cask types (Mourvèdre, Austrian
  sweet wine, Sauternes) [1].


