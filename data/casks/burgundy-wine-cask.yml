# --- Description ------------------------------------------------------------
description: |
  228-litre French oak pièce previously used to age Burgundy AOC
  wine from the Côte d'Or. The major Burgundy appellations are
  principally single-variety — Pinot Noir for reds, Chardonnay for
  whites — with limited exceptions for Aligoté, Gamay, and a few
  older varieties. The pièce vessel is slightly larger than the
  Bordeaux barrique (228 L versus 225 L). Used in Octomore 8.3 as
  one of the four named French-red-wine cask types in the 44%
  European-oak share (Pauillac, Ventoux, Rhône, Burgundy) [1].


