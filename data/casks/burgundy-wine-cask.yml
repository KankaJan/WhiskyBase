  specifics: |
    Burgundy AOC wine from the Côte d'Or in eastern France. The
    major Burgundy appellations are principally single-variety by
    AOC rules — Pinot Noir for most reds, Chardonnay for most
    whites — with limited exceptions: Aligoté has its own
    appellation (Bourgogne Aligoté), Gamay appears in some regional
    Bourgogne wines, and older varieties such as César and Sacy
    persist in a small number of northern Burgundy appellations.
    The region's classification system distinguishes Bourgogne
    (regional) from Village, Premier Cru, and Grand Cru
    designations; the specific quality tier of the prior fill is
    rarely disclosed in Scotch industry sourcing.


