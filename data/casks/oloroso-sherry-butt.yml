  - id: 2
    type: regulatory_text
    url: https://www.sherry.wine/documents/487/PLIEGO_CONDICIONES_JEREZ_ACTUALIZADO_2024.pdf
    accessed: 2026-05-18
    citation: |
      Reglamento de la Denominación de Origen "Jerez-Xérès-Sherry"
      and "Manzanilla-Sanlúcar de Barrameda", Consejo Regulador
      del Vino de Jerez, published in the Boletín Oficial del
      Estado (BOE) of Spain. The reglamento defines the
      geographical "Marco de Jerez" production zone (Jerez de la
      Frontera, El Puerto de Santa María, Sanlúcar de Barrameda),
      the permitted grape varieties (Palomino Fino predominantly,
      with Pedro Ximénez and Moscatel for sweet styles), the
      solera and criadera ageing system, and the stylistic
      classification (fino, manzanilla, amontillado, oloroso,
      palo cortado, etc.).
    notes: |
      Primary regulatory text for the Jerez DO (which encompasses
      oloroso as one of its styles). Consejo Regulador del Vino de
      Jerez is the authoritative regulatory body; the
      Boletín Oficial del Estado publishes the formal text.
      URL points to the consolidated Pliego de Condiciones PDF (2024 update) published by the Consejo Regulador on sherry.wine.


