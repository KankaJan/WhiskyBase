# --- Description ------------------------------------------------------------
description: |
  Sherry butt previously used to age oloroso sherry, a fortified
  wine from the Jerez DO in southern Spain. Vessel capacity is
  conventionally around 500 litres, made from European oak (most
  likely Quercus robur or Q. petraea — the trade typically refers
  to "Spanish oak" without specifying species). The cask is seasoned
  with oloroso for 18-36 months specifically for Scotch industry
  sale [1]. Oloroso is aged oxidatively — without the flor yeast
  cap that defines fino styles — producing a darker, nuttier base
  wine. The Scotch industry distinguishes "first-fill" oloroso
  butts (their first whisky fill) from "refill" butts (second or
  later whisky use); first-fill contains more residual sherry and
  imparts correspondingly more sherry character. European-oak
  sherry casks contribute different chemical signatures to
  maturation than American-oak ex-bourbon casks: tannin and
  ellagitannin profiles differ between the wood sources, and the
  cis-/trans-oak-lactone isomer ratio diverges systematically
  across the two oak geographies (see
  [cask maturation kinetics](concept/educational/cask-maturation-kinetics)).
  Specific quantitative claims about colour development or
  extraction rates remain attribution-required between trade and
  academic sources.


