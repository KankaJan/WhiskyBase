# --- Prior Contents ---------------------------------------------------------
prior_contents:
  category: sherry
  specifics: |
    Oloroso sherry — a fortified wine from the Jerez-Xérès-Sherry DO
    in southern Spain, aged oxidatively (without a flor yeast cap)
    in a solera system [1]. The cask is "seasoned" with oloroso for
    a period (typically 18-36 months) specifically to prepare it
    for Scotch industry sale; modern seasoning practice is distinct
    from the historical practice of using genuinely spent transport
    butts.


