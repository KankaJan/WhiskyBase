# --- Description ------------------------------------------------------------
description: |
  Sherry butt previously used to age fino sherry, the dry
  biologically-aged style of Jerez fortified wine [1]. Vessel of
  ~500 L in European oak (most likely Quercus robur or Q. petraea).
  Unlike oloroso, fino is aged under a flor yeast cap that limits
  oxidation; the cask therefore carries less oxidative residue into
  the whisky. Sensory differences between fino-cask and oloroso-cask
  matured whisky are routinely described in trade press, with fino
  casks commonly characterised as imparting drier and more saline
  character than oloroso; the underlying difference in prior-
  contents chemistry (fino's flor-mediated reduction versus
  oloroso's oxidative ageing) is well-documented, but the specific
  spirit-side flavour contributions remain attribution-required
  rather than universal cask-type properties (see
  [cask maturation kinetics](concept/educational/cask-maturation-kinetics)). Less commonly used
  than oloroso in Scotch maturation; appears in releases that
  explicitly contrast fino with oloroso (such as the Jose Miguel
  Martin casks used in the Hearach releases at Isle of Harris [2]).


