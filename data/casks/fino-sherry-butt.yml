      Reglamento de la Denominación de Origen "Jerez-Xérès-Sherry"
      and "Manzanilla-Sanlúcar de Barrameda", Consejo Regulador
      del Vino de Jerez, published in the Boletín Oficial del
      Estado (BOE) of Spain. Defines the Marco de Jerez
      geographical area, Palomino Fino as the principal grape,
      the flor-yeast biological ageing requirement for fino
      style, and the contrast with manzanilla (similar
      flor-aged wine produced in Sanlúcar de Barrameda).
    notes: |
      Primary regulatory text for the Jerez DO. The reglamento
      defines the fino style specifically; manzanilla is the
      Sanlúcar-only equivalent under the same regulatory
      framework. See oloroso-sherry-butt for the matching
      citation on the oxidative-aged style.


