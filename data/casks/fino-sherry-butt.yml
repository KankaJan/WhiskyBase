# --- Prior Contents ---------------------------------------------------------
prior_contents:
  category: sherry
  specifics: |
    Fino sherry from the Jerez-Xeres-Sherry DO, aged under a layer
    of flor yeast (a film-forming Saccharomyces yeast population,
    sometimes designated S. beticus), which protects the wine from
    oxidation and produces the pale colour and yeasty-saline
    character of fino. Casks are seasoned with fino for Scotch
    industry use under similar terms as oloroso butts.


