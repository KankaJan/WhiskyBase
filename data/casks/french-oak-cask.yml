# --- Description ------------------------------------------------------------
description: |
  A virgin (new) cask coopered from French oak rather than American
  oak. Like all virgin oak it has held no prior fill, so it presents
  the full extractive reservoir to the spirit (see
  [cask maturation kinetics](concept/educational/cask-maturation-kinetics)
  for the kinetic-phase model). The species contrast with virgin
  American oak is the load-bearing distinction: French oak
  (Quercus robur and Quercus petraea) is more tannic and carries a
  different lactone and spice profile than American white oak
  (Quercus alba), so a new French oak component contributes a deeper,
  more tannic and spicy character. Used as a component in a multi-cask
  programme rather than as a sole maturation vessel; Ardbeg Corryvreckan
  is a populated example, combining an ex-bourbon backbone with a new
  French oak component.


