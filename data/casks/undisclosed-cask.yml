# --- Disclosure Status ------------------------------------------------------
disclosure_status: undisclosed
disclosure_notes: |
  This entry represents the producer's deliberate withholding of cask
  details as a feature of the release, distinct from missing data.
  Releases referencing this slug carry their own notes on what IS
  publicly stated (e.g. that maturation took place on Islay, or that
  the spirit is from pre-2001 distillation) versus what is withheld
  (cask types, fill numbers, proportions, finishing). The canonical
  example is the Bruichladdich Black Art series, where the recipe is
  held only by the head distiller [1].


# --- Description ------------------------------------------------------------
description: |
  Reserved slug for cask references where the producer has deliberately
  withheld cask information as a defining feature of the release.
  Distinct from `disclosure_status: unknown`, which indicates absence
  of data that may be discoverable with more research. The two cases
  are recorded separately so that "X bottlings have producer-secret
  cask provenance" is queryable as a distinct category from "X
  bottlings lack data we should track down" [1]. The category is a
  positive declaration about producer practice. Each release
  referencing this slug carries its own per-bottling notes on what is
  publicly known versus actively withheld.


