# --- Prior Contents ---------------------------------------------------------
prior_contents:
  category: red_wine
  specifics: |
    Rhône Valley AOC red wine. The Rhône divides into northern Rhône
    (Syrah-dominated, single-variety in most appellations) and southern
    Rhône (Grenache-dominated blends with Syrah, Mourvèdre, Cinsault,
    and others). The generic Rhône slug covers either; appellation-
    specific slugs distinguish where disclosed (e.g.
    ventoux-wine-cask for the Mont Ventoux foothills).


