# --- Description ------------------------------------------------------------
description: |
  Rhône Valley French oak wine cask. Rhône wines are most commonly
  Grenache or Syrah-led red blends (southern Rhône) or single-variety
  Syrah (northern Rhône). Used in Octomore 8.3 as one of the four
  named French-red-wine cask types in the 44% European-oak share
  (Pauillac, Ventoux, Rhône, Burgundy) [1]. Ventoux is technically
  within the southern Rhône area and is recorded separately as
  ventoux-wine-cask.


