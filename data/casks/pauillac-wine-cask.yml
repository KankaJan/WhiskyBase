# --- Description ------------------------------------------------------------
description: |
  225-litre French oak barrique previously used to age Pauillac AOC
  red wine from the Médoc, the Left Bank of the Gironde estuary.
  Pauillac wine is Cabernet Sauvignon-dominant and known for its
  structure and tannin. Used in Octomore 8.3 as one of the four named
  French-red-wine cask types contributing to the 44% European-oak
  share of the cask programme (Pauillac, Ventoux, Rhône, Burgundy) [1].


