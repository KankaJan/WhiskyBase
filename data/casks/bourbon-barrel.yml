# --- Prior Contents ---------------------------------------------------------
prior_contents:
  category: bourbon
  specifics: |
    Bourbon whiskey from US distilleries, predominantly Kentucky-
    based. The barrel is charred on the interior (Char #3 or Char #4
    most common in industry practice) before bourbon use, and filled
    with new-make bourbon at the producer's standard entry proof. US
    federal regulations require bourbon to be aged in new charred
    oak, so each barrel can be used only once for bourbon — driving
    the supply of ex-bourbon barrels to the Scotch industry [1]. The
    same vessel specification (charred new American oak, 53 US
    gallons) is used for Tennessee whiskey, which is separately
    regulated from bourbon; ex-Tennessee-whiskey barrels reach Scotch
    maturation through the same supply chain.


# --- Origin -----------------------------------------------------------------
origin:
  country: United States
  region: Kentucky                  # Predominant. Tennessee, Indiana, and
                                    # other US states also supply.
  appellation: null
  producer: null                    # Multiple, vary by source. Named
                                    # producers commonly cited in Scotch
                                    # disclosures include Heaven Hill,
                                    # Buffalo Trace, Four Roses, and
                                    # Jim Beam (bourbon), plus Jack
                                    # Daniel's (Tennessee whiskey — the
                                    # barrel specification is equivalent
                                    # to bourbon barrels, though Jack
