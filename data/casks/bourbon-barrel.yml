# --- Vessel Characteristics --------------------------------------------------
typical_volume_litres: [190, 200]   # The American Standard Barrel is
                                    # standardised around 53 US gallons
                                    # (200.6 L); industry references
                                    # commonly state 190-200 L for the
                                    # post-rebuild Scotch fill capacity.

wood_species: american_oak          # Quercus alba (American white oak),
                                    # the species used for bourbon barrel
