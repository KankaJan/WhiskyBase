# --- Description ------------------------------------------------------------
description: |
  The American Standard Barrel used for ageing bourbon whiskey,
  recovered after bourbon ageing and shipped to Scotland for whisky
  maturation. Constructed from American white oak (Quercus alba),
  charred on the interior before bourbon use, with capacity of 53
  US gallons (about 200 litres). US federal regulations require
  bourbon to be aged in new charred oak, so each barrel can be used
  only once for bourbon production [1]; this single-use rule
  supplies the ex-bourbon barrels that dominate Scotch whisky
  maturation. The barrel is the most common cask type in modern
  Scotch maturation. The same vessel specification is used for
  Tennessee whiskey (separately regulated, but charred new American
  oak of the same dimensions); ex-Tennessee-whiskey barrels —
  including those from Jack Daniel's, which is the largest single
  Tennessee whiskey producer — enter the Scotch supply chain
  alongside ex-bourbon and are functionally interchangeable.
  Named producers cited in Scotch industry disclosures include
  Heaven Hill, Buffalo Trace, Four Roses, and Jim Beam (bourbon),
  plus Jack Daniel's (Tennessee whiskey); more often the source is
  recorded as generic "first-fill bourbon" or "refill bourbon"
  without naming the supplier.


