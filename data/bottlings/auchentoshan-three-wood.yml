# --- Description ------------------------------------------------------------
description: |
  Auchentoshan Three Wood is a NAS premium core release matured
  sequentially through three different cask types: ex-bourbon
  American oak first, then Spanish oloroso sherry oak, then Pedro
  Ximénez (PX) sherry oak [1]. Bottled at 43 % ABV, chill-filtered
  with caramel colouring per industry-typical practice at this
  presentation tier. The three-cask sequence is the structural
  feature the release is built on; producer materials describe it
  in those terms. The PX stage is the differentiating element —
  PX sherry's higher residual-sugar load (PX is bottled
  approximately 400-500 g/L residual sugar, versus oloroso's
  near-dry profile) makes the PX-cask contribution distinctly
  sweeter and darker than the oloroso stage that precedes it.
  In the project's voice the release is a triple-distilled
  Lowland NAS in a three-stage maturation sequence; the
  light-bodied triple-distilled base spirit is the substrate
  that the heavily-flavoured PX-cask sweetness sits on top of.


