# --- Maturation -------------------------------------------------------------
maturation:
  - cask_type: bourbon-barrel
    fill_number: null
    proportion: null
    duration_years: null
    cooperage: null
    notes: |
      First-stage maturation in ex-bourbon American oak.
      Producer describes the Three Wood as
      "first matured in ex-bourbon casks, then finished in
      Spanish Oloroso sherry casks, and finally in Pedro
      Ximénez sherry casks" — a three-stage sequence rather
      than a primary-plus-finish pattern [1]. Specific
      duration in each stage not disclosed.
  - cask_type: oloroso-sherry-butt
    fill_number: null
    proportion: null
    duration_years: null
    cooperage: null
    notes: |
      Second-stage maturation in Spanish oloroso sherry oak.
      Producer's "finished in" terminology is loose; the
      project records this as a second maturation stage
      rather than as a `finish:` block because the producer
      describes three sequential cask exposures rather than
      a short terminal finish after primary maturation.
  - cask_type: oloroso-sherry-butt
    fill_number: null
    proportion: null
    duration_years: null
    cooperage: null
    notes: |
      Third-stage maturation in Pedro Ximénez (PX) sherry
      oak. The project's cask-type vocabulary does not yet
      have a separate `px-sherry-butt` entry — PX shares
      construction with oloroso but is sweeter and darker
      due to PX's higher residual-sugar content. Recorded
      here as `oloroso-sherry-butt` with the PX-specific
      character noted explicitly; see TODO §Schema work
      §Cask schema for a possible future split. The producer
      sometimes describes this stage as a finish; the
      project keeps the three stages on the maturation list
      for consistency with the producer's "Three Wood"
      framing.

