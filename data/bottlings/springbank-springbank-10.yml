description: |
  Core 10-year-old release of the Springbank line, bottled at 46%
  ABV non-chill-filtered with natural colour [1]. Vatted from
  Springbank's typical cask programme (predominantly ex-bourbon
  with an ex-sherry component, proportions varying batch to
  batch). 2.5×-distilled and lightly peated to the Springbank
  line's malt specification; produced from floor-malted barley
  on the Springbank site in Campbeltown. The core 10 is the
  reference expression of the Springbank line.


