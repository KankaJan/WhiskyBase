# --- Description ------------------------------------------------------------
description: |
  The first commercial bottling of single malt whisky produced on the
  Isle of Harris, released September 2023 [1][2]. Vatted from first-fill
  ex-bourbon (Heaven Hill, Buffalo Trace) and first-fill oloroso and fino
  sherry butts (José Miguel Martín) [2]. Bottled at 46% abv,
  non-chill-filtered, natural colour [1][2]. The release is a numbered
  batch rather than a fixed-recipe core sku; subsequent batches follow
  the same cask-composition principles with varying proportions.


# --- Tasting Notes ----------------------------------------------------------
notes_official: |
  Head Blender's notes (as published by the distillery) [2]:
  "Gentle peat smoke on the first sip, reminiscent of island home fires;
  toasted maltiness; homemade apple sauce; machair flowers, particularly
  white clover; mixed spices; an old-fashioned sweetness from candied
  ginger, vanilla, and honeycomb; a long, clotted-cream note mixed with
  a lasting sense of new leather."
                                  # Note: the producer's own description
                                  # is florid by the standards of this
                                  # knowledge base; it is preserved here
                                  # as attributed quotation rather than
                                  # restated as fact.

notes_independent:
  - reviewer: Two Whisky Bros
    url: https://twowhiskybros.co.uk/blogs/blog/the-hearach-first-release-batch-1-the-hearach-first-release-batch-5
    date: 2024
    nose: null                    # Detailed nose/palate/finish not parsed
    palate: null                  # individually in source — see summary.
    finish: null
    summary: |
      Sherbet and green apple sweetness; reviewers rated 7/10 and noted
      the release as "older than a lot of inaugural releases" and well
      below £100, calling it a strong start while suggesting additional
      maturation would benefit future batches.


