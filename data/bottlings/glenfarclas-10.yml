# --- Description ------------------------------------------------------------
description: |
  Glenfarclas's entry-level core release, 10 years matured
  predominantly in oloroso ex-sherry butts (with ex-bourbon
  barrels supplementing) and bottled at 40% ABV [1]. The 10 Year
  Old sits at the entry point of the Glenfarclas family-tree
  range that runs from 10 through to 40 year age statements at
  this tier, and is the most-volume of the core releases. Chill-
  filtered with caramel colouring per industry-typical practice
  at this ABV tier (see educational/chill-filtering and
  educational/scotch-presentation-conventions). The direct-fired
  distillation that defines the Glenfarclas house style is
  consistently applied across all core-range bottlings; see the
  distillery entry for the equipment-level treatment.


