# --- Description ------------------------------------------------------------
description: |
  Annual cask-strength 12-year-old release from Lagavulin under
  Diageo's Special Releases programme [1]. The 12 Year Old Cask
  Strength has been released annually since approximately 2002;
  each year's release uses refill ex-bourbon casks with the same
  age statement and presentation philosophy (cask strength,
  non-chill-filtered, natural colour) but with year-specific ABV,
  outturn, and minor cask-programme variation. The cask-strength
  format provides a less filtered window onto the Lagavulin
  spirit than the 43% ABV chill-filtered 16 Year Old core
  release — a complementary expression rather than a substitute.


