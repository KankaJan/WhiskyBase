# --- Description ------------------------------------------------------------
description: |
  Glenfarclas's most-cited premium core release, 15 years
  matured predominantly in oloroso ex-sherry butts and bottled
  at 46% ABV non-chill-filtered at natural colour [1]. The
  Glenfarclas 15 Year Old is unusual at its price tier in
  combining a 15-year age statement with the higher-ABV NCF
  natural-colour presentation pattern that other producers
  adopted only in the 2010s; the Glenfarclas 15 has held this
  presentation for decades. The 15-year maturation deepens the
  sherry-cask character of the 10 Year Old without yet reaching
  the slow-exchange phase that characterises the older
  expressions in the family-tree range. The 15 Year Old is the
  most widely cited Glenfarclas expression in trade-press
  writing and is the natural reference point for the
  distillery's house style.


