    fill_number: null
    proportion: null                  # Base spirit drawn from the
                                      # core ex-bourbon Glenkinchie
                                      # programme before the
                                      # secondary cask period.
    duration_years: null              # Typically ~12 years before
                                      # transfer to the secondary
                                      # casks per producer description
                                      # of the Distillers Edition
                                      # method [1].
