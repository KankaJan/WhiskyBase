    notes: |
      Primary maturation in ex-bourbon refill American oak —
      the same base as the Glenkinchie 12 Year Old core
      release. Specific bourbon-cask provenance and
      proportions not disclosed.

finish:
  cask_type: oloroso-sherry-butt      # Diageo's Distillers Edition
                                      # casks are recharred American
                                      # oak hogsheads "seasoned" with
                                      # Amontillado sherry for the
                                      # finish-cask period (a
                                      # programme-specific build
                                      # rather than authentic
                                      # ex-bodega Amontillado casks).
                                      # The project's cask-type
                                      # vocabulary uses
                                      # oloroso-sherry-butt as the
                                      # broader oxidative-style
                                      # parent; Amontillado is an
                                      # oxidative oloroso-style after
                                      # the flor dies. The
                                      # bespoke-cask construction is
                                      # noted explicitly in the
                                      # description.
  duration_months: null               # Typically a few months in the
                                      # secondary cask; producer
                                      # describes the secondary
                                      # period as a "finish" rather
                                      # than a full second
                                      # maturation [2].
  duration_years: null
  cooperage: null
  notes: |
    The Distillers Edition secondary casks are recharred American
    oak with new American oak heads, "seasoned" with Amontillado
    sherry for a finite period before being filled with the base
    Glenkinchie spirit [2]. The finish is therefore not an
    authentic ex-bodega Amontillado cask in the way that an
    ex-bodega oloroso-sherry-butt would be; the wine-cask
    contribution is producer-controlled bespoke seasoning over a
    bourbon-cask body. See cask-maturation-kinetics for the
    extraction-phase framework that applies to this short-finish
    pattern.


