# cask numbers.
# =============================================================================
# Third populated bottling exercising the Diageo Distillers Edition
# cross-distillery programme (after Lagavulin Distillers Edition and
# Caol Ila Distillers Edition). The DE programme applies a
# distillery-specific secondary fortified-wine finish over the
# distillery's core spirit; Glenkinchie's secondary cask is
# Amontillado-sherry-seasoned American oak.
# =============================================================================


