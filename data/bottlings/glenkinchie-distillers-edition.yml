# --- Description ------------------------------------------------------------
description: |
  The Glenkinchie Distillers Edition is the Lowland entry in
  Diageo's cross-distillery Distillers Edition programme — an
  annual recurring release that finishes the distillery's core
  spirit in a programme-bespoke secondary cask. For Glenkinchie
  the secondary cask is American oak recharred and seasoned with
  Amontillado sherry; the finish period is short (a finite
  secondary-cask exposure rather than a full second maturation)
  [1][2]. Bottled at 43% ABV without an age statement; vintages
  (distillation year + bottling year) are disclosed on the label.
  The project entry treats the Distillers Edition as a
  programme-level release pattern: each annual vintage has
  specific cask details that are not modelled at the entry level
  here. The same Distillers Edition programme pattern is recorded
  for Caol Ila (Moscatel finish) and Lagavulin (PX sherry
  finish) — the three populated Distillers Edition entries
  exercise three secondary-cask styles against a common
  programme architecture. Glenkinchie's Amontillado finish is
  the lightest of the three secondary styles (Amontillado is the
  driest of the three, having lost its flor and oxidatively
  aged); the marriage of the light Lowland base spirit with
  the lightest secondary cask makes the Glenkinchie DE the most
  restrained of the three in the comparative cross-distillery
  pattern.


