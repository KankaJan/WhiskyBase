# --- Description ------------------------------------------------------------
description: |
  Highland Park's 18 Year Old (modern livery "Viking Pride")
  matures the same sherry-cask-led programme as the 12 Year Old
  flagship for an additional six years, producing a darker-
  coloured, more sherry-intensive spirit at the elevated 43% ABV
  presentation [1]. As with the 12 Year Old, the spirit is
  chill-filtered with caramel colouring per industry-typical
  practice for this ABV tier. The 18-year age statement sits in
  Scotch's mid-premium core range; the modern "Viking Pride"
  marketing treatment is a producer-side rebrand applied to a
  long-standing release.


