# --- Description ------------------------------------------------------------
description: |
  Highland Park's annual cask-strength release programme bottles
  small-batch vattings of sherry-cask-matured spirit at the
  spirit's actual cask-withdrawal strength (typically in the
  60-65% ABV range; specific Release No. ABV published per
  release). The series is bottled non-chill-filtered at natural
  colour by convention, contrasting with the chill-filtered
  caramel-coloured 40% ABV 12 Year Old flagship (see
  educational/scotch-presentation-conventions for the producer
  positioning framework). Each annual release carries its own
  Release No. labelling rather than a vintage; the underlying
  cask programme remains broadly consistent across the series
  (oloroso ex-sherry butts predominantly). The 2017 launch of
  the current Cask Strength series succeeded the older "Dark
  Origins" and similar earlier NAS premium expressions.


