# --- Description ------------------------------------------------------------
description: |
  Worked-example entry for a Cadenhead's Authentic Collection
  Bunnahabhain release. Cadenhead's Authentic Collection is an
  independent-bottler single-cask programme presenting bottlings
  at cask strength, non-chill-filtered, natural colour, in 500ml
  bottles with cask number disclosed on the label [1]. For
  Bunnahabhain releases specifically, ex-bourbon casks predominate;
  the spirit is the Bunnahabhain Traditional (lightly-peated)
  production line, since Cadenhead's predates Bunnahabhain's
  peated Toiteach programme in cask circulation. The Authentic
  Collection's presentation conventions align with the project's
  "craft transparency" presentation cluster (see
  educational/scotch-presentation-conventions): cask strength,
  NCF, natural colour, single-cask disclosure with cask number.
  Specific cask-identifier fields (vintage year, cask number,
  outturn, exact ABV) in this entry are left null at the
  template-form level; populating them requires selecting a
  specific Cadenhead's release for cataloguing and verifying
  the per-release values against the label and auction-archive
  documentation [2].


