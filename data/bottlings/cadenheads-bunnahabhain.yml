  outturn_bottles: null                     # Single-cask outturn,
                                            # typically 150-300 bottles
                                            # for a Cadenhead's
                                            # Bunnahabhain release
                                            # depending on cask volume
                                            # and angel's share.
  cask_numbers: []                          # Per-release values.


# --- Maturation -------------------------------------------------------------
# Cadenhead's Authentic Collection presents the spirit's cask history
# with the cask type disclosed on the label. For Bunnahabhain releases,
# ex-bourbon casks are the most common, with occasional refill sherry
# butts; the worked example here records the typical ex-bourbon case.
maturation:
  - cask_type: bourbon-barrel
    fill_number: null                       # Cadenhead's typically
                                            # discloses fill state
                                            # (first-fill / refill /
                                            # hogshead) on the label.
    proportion: 1.0                         # Single-cask release —
                                            # 100% of the bottling
                                            # is from the one cask.
    duration_years: null                    # Per-release.
    cooperage: null
    notes: |
      Ex-bourbon cask, single-cask presentation. Cadenhead's
      Bunnahabhain releases have used a mix of bourbon barrels
      and refill hogsheads across vintages; the worked example
      records the predominant ex-bourbon case. A specific real
      release may instead carry a refill ex-sherry hogshead or
      similar; the cask_type field should be updated per the
      specific release.

finish: null


