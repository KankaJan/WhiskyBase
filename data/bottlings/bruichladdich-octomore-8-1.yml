# --- Description ------------------------------------------------------------
description: |
  Backbone of the Octomore Edition 8 series: distilled 2008 from
  Scottish barley peated to 167 ppm specification, matured for 8 years
  in first-fill American oak ex-bourbon casks (Buffalo Trace, Clermont
  Springs, Four Roses, Heaven Hill, Jack Daniels) [1][3]. Bottled at
  cask strength of 59.3% ABV [1][2][3]. The .1 release in each Octomore
  edition serves as the bourbon-led reference point against which the
  .2 (wine-cask) and .3 (Islay-barley) variants in the same edition can
  be compared — shared spirit, different maturation [4]. Edition 8.1
  is unusual within the .1 sub-series in being 8 years old rather than
  the typical 5.


# --- Tasting Notes ----------------------------------------------------------
notes_official: |
  Producer-stated character notes [2]: smoke, tar, peat ash, and a hint
  of muddiness/wet peat moss; candied orange, pepper, chocolate,
  macaroon, vanilla fudge, and lemon meringue pie. The producer
  characterises this release as "a single malt masterclass" with
  "structural brilliance" and notes that "a little extra age has
  tempered some of the vitality" relative to the typical 5-year-old
  Octomore .1.

notes_independent:
  - reviewer: Drinkhacker (Christopher Null)
    url: https://www.drinkhacker.com/2018/02/22/review-bruichladdich-octomore-8-1-8-2-and-8-3/
    date: 2018-02
    nose: null
    palate: null
    finish: |
      Squeeze of lemon atop a core of intense and lingering peat smoke.
    summary: |
      Reviewer score B+. Characterises 8.1 as "relatively light on its
      feet" compared to the heavier 8.2.

  - reviewer: The Whiskyphiles
    url: https://thewhiskyphiles.com/2018/02/04/octomore-masterclass_08-1-167ppm-59-3-bruichladdich/
    date: 2018-02
    nose: null
    palate: null
    finish: null
    summary: |
      Independent review noting "Sauternes wine gold" colour, refined
      character, and good integration of cask, age, and peat compared
      to earlier .1 releases.


