# --- Description ------------------------------------------------------------
description: |
  Glenkinchie's flagship core release, 12 years matured
  predominantly in ex-bourbon refill American oak and bottled
  at 43% ABV [1]. The 12 Year Old replaced the earlier
  Glenkinchie 10 Year Old as the Lowland representative in
  Diageo's Classic Malts of Scotland series; the Glenkinchie
  10 had been the original Classic Malts release for
  Glenkinchie since the series launched in 1988, and the
  10 → 12 transition followed the wider Diageo move toward
  12-year-old core releases in the 2000s [1][2].
  Chill-filtered with caramel colouring per industry-typical
  practice at this ABV tier — consistent with the Diageo
  core-release presentation convention also applied to
  Caol Ila 12 and Lagavulin 16. The producer's positioning
  emphasises a light Lowland character; in the project's
  voice, the release is an unpeated, ex-bourbon-led core
  bottling at the introductory tier of the Lowland category.


