# --- Description ------------------------------------------------------------
description: |
  The flagship core release of Glenmorangie, 10 years matured in
  ex-bourbon American oak casks, bottled at 40% ABV [1]. The
  Original (formerly "Original 10 Year Old") is among the
  best-selling single-malt Scotch whiskies. Chill-filtered with
  caramel colouring per the industry-standard convention at this
  ABV level. The reference expression of the Glenmorangie line
  before any cask-finishing or special-edition variation.


