# --- Description ------------------------------------------------------------
description: |
  The Glenlivet 15 Year Old French Oak Reserve is the core-range
  expression built around oak selection: the American-oak-matured
  Glenlivet spirit is selectively finished or part-matured in new
  French oak casks (commonly cited as Limousin oak), which add spice
  and tannic structure to the distillery's characteristically light,
  fruity make [1]. It sits between the bourbon-led 12 Year Old and the
  older sherry- and oak-led expressions, and is the clearest expression
  of The Glenlivet using cask type rather than age or strength as the
  point of difference. Bottled at 40% ABV.


