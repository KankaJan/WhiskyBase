# --- Description ------------------------------------------------------------
description: |
  Nc'nean Organic Single Malt is the distillery's flagship: an unpeated,
  certified-organic single malt matured in an unusually wine-cask-led
  programme — roughly 55% STR (shaved, toasted, re-charred) red-wine casks,
  43% ex-bourbon and 2% oloroso sherry — bottled non-chill-filtered at 46%
  ABV [2]. It is the project's first organic whisky and its first
  wine-cask-led core single malt.


