# --- Description ------------------------------------------------------------
description: |
  Flagship 10-year-old expression of the Port Charlotte line, introduced
  2018 [3]. Distilled, matured, and bottled exclusively on Islay [1].
  Made from 100% Scottish barley peated to 40 ppm specification [1][2],
  bottled at 50% ABV non-chill-filtered with natural colour [1]. The
  cask programme combines first-fill and second-fill American whiskey
  casks with second-fill French wine casks; specific proportions are
  not publicly disclosed for the core SKU [1][2]. The release serves
  as the line's stable reference expression alongside the vintage-
  dated Islay Barley series and the Cask Exploration finishes.


# --- Tasting Notes ----------------------------------------------------------
notes_official: |
  Producer-stated character: "barbeque smoke" with "elegance and
  finesse" [1]. The line is described as "the canonical Islay style"
  in independent coverage [4].

notes_independent:
  - reviewer: The Whiskey Wash (Margarett Waterbury)
    url: https://thewhiskeywash.com/reviews/whisky-review-port-charlotte-10/
    date: 2025-08
    nose: |
      Balanced and harmonious, with bright tangerine, cereal grains,
      and a madeira-like nuttiness; almond, allspice, and lime;
      neutral wood-fire smoke rather than antiseptic industrial peat.
    palate: |
      Dry, dense, and woodsy, with deep nutty caramelised flavours;
      dark caramel and chocolate; smouldering incense-like smoke;
      savoury meatiness.
    finish: null
    summary: |
      Reviewer characterises the release as a "canonical Islay style"
      smoky maritime malt, well-balanced rather than aggressive.


