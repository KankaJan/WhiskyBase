# --- Description ------------------------------------------------------------
description: |
  The Glenlivet Nàdurra Oloroso is the cask-strength, non-chill-filtered,
  natural-colour tier of the range — "Nàdurra" is Gaelic for "natural",
  and the line is positioned on minimal intervention. The Oloroso Matured
  expression, launched September 2014, is matured entirely in first-fill
  oloroso sherry casks from Jerez and bottled at cask strength, so its ABV
  varies by batch (around 60-61%) [2]. It carries no age statement. Within
  The Glenlivet range it is the sharpest contrast to the 40% chill-filtered
  core: the same light distillery spirit taken into heavy first-fill
  sherry wood and bottled without dilution, chill-filtration or colouring.


# --- Tasting Notes ----------------------------------------------------------
notes_official: null
notes_independent: []


# --- Sources ----------------------------------------------------------------
sources:
  - id: 1
    type: wikipedia
    url: https://en.wikipedia.org/wiki/The_Glenlivet_distillery
    accessed: 2026-06-12
    notes: |
      Wikipedia's article on The Glenlivet distillery, which lists the
      Nàdurra in the core range (as the Nàdurra 16 Year Old) and
      establishes the Nàdurra as the distillery's cask-strength line.
      It does not detail the Oloroso Matured variant specifically — see
      source 2.
  - id: 2
    type: trade_publication
    url: https://www.masterofmalt.com/whiskies/the-glenlivet/-the-glenlivet-nadurra-oloroso-batch-ol1015-whisky/
    accessed: 2026-06-12
    notes: |
      Specialist-retailer / review listings corroborating the Nàdurra
      Oloroso specifications (cask strength with batch-varying ABV,
      non-chill-filtered, natural colour, first-fill oloroso sherry
      maturation, no age statement, September 2014 launch). These
      facts are consistent across Master of Malt (batch OL1015,
      60.3%), The Whisky Exchange (batch OLO614) and Distiller, found
      by web search on 2026-06-12. The pages return HTTP 403 to
      automated fetch and the producer's theglenlivet.com page is
      JS-rendered / not directly fetchable, so these specifications
      are flagged for direct producer confirmation (see TODO.md
      Research Requests).


