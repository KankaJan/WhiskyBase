# =============================================================================
# The Glenlivet Nàdurra Oloroso
# =============================================================================
# Schema: bottling.template.yml v0.2
# The cask-strength, non-chill-filtered, natural-colour tier of the range
# ("Nàdurra" is Gaelic for "natural"): first-fill oloroso sherry
# maturation at cask strength. The transparency / minimal-intervention
# counterpart to the 40% chill-filtered core. See glenlivet.NOTES.md.
# =============================================================================


# --- Identity ---------------------------------------------------------------
id: glenlivet-nadurra-oloroso
name: The Glenlivet Nàdurra Oloroso
produced_at_distillery: glenlivet
production_line: glenlivet
bottled_by: glenlivet                      # Official distillery bottling.
bottler_type: distillery
bottler_series: null                       # The Nàdurra "Oloroso Matured"
                                           # line is batch-released (batch
                                           # codes prefixed OL); the project
                                           # does not yet model it as a
                                           # bottler_series.


# --- Release & Availability -------------------------------------------------
release_date: '2014-09'                     # Nàdurra Oloroso Matured launched
                                           # September 2014 [2].
discontinued: false
availability: core                         # An ongoing, repeatedly-batched
                                           # range tier rather than a one-off
                                           # limited release; recorded as core
                                           # with batch variation noted below.


# --- Liquid Specifications --------------------------------------------------
abv: 60.3                                   # Cask strength, so ABV varies by
                                           # batch (e.g. batch OL1015 60.3%,
                                           # OL0816 61.3%) [2]. 60.3% recorded
                                           # as a representative documented
                                           # batch; see batch note below.
age_statement: null                         # No age statement (NAS) [2].
vintage: null
cask_strength: true
non_chill_filtered: true                    # Non-chill-filtered — a defining
                                           # claim of the Nàdurra line [2].
natural_colour: true                        # No added colouring [2].
bottle_size_ml: 700


# --- Batch / Cask Identity --------------------------------------------------
batch_or_cask:
  type: batch
  number: null                              # Varies by release (OL-prefixed
                                            # batch codes); no single number.
  outturn_bottles: null
  cask_numbers: []


