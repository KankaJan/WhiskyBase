# --- Description ------------------------------------------------------------
description: |
  Aberlour A'bunadh ("the original" in Gaelic) is the distillery's
  cask-strength sherry expression: a no-age-statement single malt matured
  exclusively in first-fill Spanish oloroso sherry butts, bottled without
  chill-filtration or added colour in individually numbered batches, each
  at its own cask strength (typically ~59-61% ABV) [2]. It is the sharpest
  contrast to the 40% double-cask core range — the same Aberlour spirit
  taken into heavy first-fill sherry wood and bottled undiluted.


