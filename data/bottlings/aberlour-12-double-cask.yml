# --- Description ------------------------------------------------------------
description: |
  Aberlour 12 Year Old Double Cask Matured is the distillery's flagship
  core expression and the archetype of its house style: twelve years
  across both ex-bourbon American oak and oloroso-seasoned sherry casks,
  married and bottled at 40% ABV [2]. It is the 40% counterpart to the
  cask-strength, sherry-only A'bunadh, and the reference point for the
  16 Year Old Double Cask.


