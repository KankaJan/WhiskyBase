# --- Description ------------------------------------------------------------
description: |
  Highland Park's flagship core release, 12 years matured with a
  sherry-cask-led programme (predominantly oloroso ex-sherry
  butts, with ex-bourbon barrels supplementing) and bottled at
  40% ABV [1]. The "Viking Honour" suffix in the modern
  livery is a producer-marketing rebrand applied to the
  long-standing 12 Year Old release; the underlying spirit
  specification has remained at 12 years and 40% ABV through
  the rebrand. Chill-filtered with caramel colouring per
  industry-typical practice at this ABV (see
  educational/chill-filtering and
  educational/scotch-presentation-conventions for the producer-
  positioning context).


