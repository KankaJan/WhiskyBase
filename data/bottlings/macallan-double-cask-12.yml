# --- Description ------------------------------------------------------------
description: |
  The Macallan Double Cask 12 Year Old vats two oloroso-seasoned cask
  types — European-oak sherry casks and American-oak sherry casks, both
  seasoned with oloroso — at twelve years' age, at 43% ABV. The Double
  Cask range (Gold, 12, 15, 18, 30) is the middle position in the
  cask-programme spectrum: between the single-style Sherry Oak
  (European-oak oloroso dominant) and the tripartite Triple Cask Matured
  (sherry + sherry + ex-bourbon). Both Double Cask components are
  oloroso-seasoned; the differentiation is oak species — European
  (Quercus robur) versus American (Quercus alba).


