# --- Description ------------------------------------------------------------
description: |
  Travel-retail edition in the Octomore 8 series, distilled 2008 from
  Scottish barley peated to 167 ppm specification (the same malt as
  Octomore 8.1) [3]. The defining recipe variable versus 8.1 is
  maturation: 6 years across three European wine cask types
  (Mourvedre, Austrian sweet wine, Sauternes), followed by 2 years
  finishing in Amarone casks [3][7]. Bottled at 58.4% ABV [1][2][3]
  with an outturn of 36,000 bottles [2][3]. Within the Octomore series
  taxonomy, the .2 sub-series is the European-wine-cask comparator to
  the bourbon-led .1; this release is a particularly elaborate example
  of that pattern.


# --- Tasting Notes ----------------------------------------------------------
notes_official: |
  Producer-stated character (per release announcement and product page)
  [3]: deep fruit and satin-like smoke on the palate; oak that lifts to
  toasted bread, bubble-gum sweetness, and strawberry jam; rose petal,
  Turkish delight, praline, and more strawberry jam emerging with
  water; the smoke holding everything together in the background.

notes_independent:
  - reviewer: Drinkhacker (Christopher Null)
    url: https://www.drinkhacker.com/2018/02/22/review-bruichladdich-octomore-8-1-8-2-and-8-3/
    date: 2018-02
    nose: |
      Camphor, sea spray, and dried fruit; aromatic and well-weighted.
    palate: |
      Citrus notes, sweet custard, and fruits in syrup (with water).
    finish: |
      Less smoky than expected, with a clear citrus thread.
    summary: |
      Reviewer score A-. Characterises 8.2 as "intense, but really
      quite lovely" — substantially weightier than 8.1.

  - reviewer: Whiskybase (community aggregate)
    url: https://www.whiskybase.com/whiskies/whisky/99306/octomore-edition-082-masterclass-167-ppm
    date: 2017-08
    nose: null
    palate: null
    finish: null
    summary: |
      Aggregate community ratings positive but not standout for the
      series; reviewers noting the alcohol presence and recommending
      water.


