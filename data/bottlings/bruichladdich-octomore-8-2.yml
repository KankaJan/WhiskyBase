# --- Maturation -------------------------------------------------------------
# Octomore 8.2 used a complex multi-stage maturation distinctive within
# the .2 sub-series: 6 years across three different European wine cask
# types, then 2 years finishing in Amarone [3][7].
maturation:
  - cask_type: mourvedre-wine-cask
    fill_number: 1
    proportion: null              # Producer doesn't disclose split between
                                  # the three primary wine-cask types;
                                  # described as "a combination" [2][3].
    duration_years: 6
    cooperage: null
    notes: French Mourvedre wine cask. Part of the 6-year primary phase.

  - cask_type: sweet-wine-cask
    fill_number: 1
    proportion: null
    duration_years: 6
    cooperage: null
    notes: |
      Austrian sweet wine casks. The producer specifies these as
      "full-bodied and charming with an ability to challenge
      convention with innovative techniques" [3].

  - cask_type: sauternes-wine-cask
    fill_number: 1
    proportion: null
    duration_years: 6
    cooperage: null
    notes: |
      French Sauternes casks from the Graves section in Bordeaux [3].

finish:
  cask_type: amarone-wine-cask
  duration_months: 24
  duration_years: 2
                                  # Italian Amarone casks for the final
                                  # 2 years [3][7]. Long enough to question
                                  # whether this is really a "finish"
                                  # rather than a third maturation stage,
                                  # but the producer presents it as a
                                  # finishing phase.


