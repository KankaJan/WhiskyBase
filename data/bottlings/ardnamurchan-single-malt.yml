# --- Description ------------------------------------------------------------
description: |
  Ardnamurchan AD Single Malt is the distillery's core release: a roughly
  50:50 vatting of peated and unpeated Ardnamurchan, matured in about 65%
  ex-bourbon and 35% sherry casks, bottled non-chill-filtered and naturally
  coloured at 46.8% ABV [2]. It is issued under "AD" batch codes that carry
  the full cask composition — the distillery's signature transparency.


