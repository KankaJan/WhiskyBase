# --- Description ------------------------------------------------------------
description: |
  Haig Club is Diageo's premium single-grain Scotch from Cameronbridge,
  launched in 2014 as a high-profile collaboration with David Beckham and
  marketed in a distinctive square blue bottle [2]. Bottled at 40% ABV from
  ex-bourbon American oak, it positions single grain — historically a
  blending component — as a stand-alone premium category, contrasting with
  the long-standing, value-oriented Cameron Brig from the same distillery.


