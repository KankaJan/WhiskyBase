# --- Description ------------------------------------------------------------
description: |
  Vintage release in the Barley Exploration series, distilled 2014 from
  the 2013 Islay barley harvest and bottled at 8 years old [1][2].
  Distinguished from the Classic Laddie by its single-vintage,
  single-region barley provenance: 100% Concerto and Propino barley grown
  on eight Islay farms within an 11-mile radius of the distillery
  (Cruach, Craigens, Island, Dunlossit, Coull, Rockside, Sunderland, and
  Mulindry Farms) [1][3]. Maturation profile is 80% first-fill bourbon,
  5% refill sherry butts, and 15% second-fill wine casks [3]. Bottled at
  50% ABV, non-chill-filtered with natural colour [1]. The release tests
  the producer's terroir thesis by holding everything constant except
  barley origin.


# --- Tasting Notes ----------------------------------------------------------
notes_official: |
  Producer-stated character notes [1]: a cereal-forward single malt with
  notes of apricot and peach, malty digestive biscuit, and a hint of
  fresh grass; a subtle maritime note also lingers, attributed to all-
  Islay harvest, distillation, and maturation.

notes_independent:
  - reviewer: Dramface (Wally MacAulay)
    url: https://www.dramface.com/all-reviews/bruichladdich-islay-barley-2014
    date: 2023-10
    nose: |
      Very malty; sour milk, fleeting; savoury cereal notes; pepper
      and herbs (rocket); fresh coast — wood, sandy beach; weeds in
      summer; bright yellow and white fruit; physalis; sherry note,
      unripe banana with a hint of earthy farmyard.
    palate: null
    finish: null
    summary: |
      Reviewer rates the release positively, framing it as "Very Good
      Indeed" and as essentially "a Classic Laddie in transparent
      clothing" — i.e. recipe overlap with the core SKU but with
      explicit farm-level barley provenance disclosure.

  - reviewer: Whisky Art (whiskyart.blog)
    url: https://whiskyart.blog/en/2024/08/12/bruichladdich-islay-barley-2014-2/
    date: 2024-08
    nose: null
    palate: null
    finish: null
    summary: |
      Score 88/100; reviewer notes the release as "multifaceted" and
      "agricultural" with the raw material taking centre stage and
      harmonising with cask influence. Approximate retail €100.


