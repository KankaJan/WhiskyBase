# --- Description ------------------------------------------------------------
description: |
  Glenfiddich's flagship core release — the producer markets it
  as "Our Original Twelve" — 12 years matured in a marriage of
  ex-bourbon American oak and ex-oloroso European oak, bottled at
  40% ABV [1][2]. As the entry-level expression of one of the
  world's best-selling single malts, the Glenfiddich 12 Year Old
  is one of the most widely distributed single malts globally; it
  is the release most consumers encounter as their introduction
  to the category. Chill-filtered with caramel colouring per
  industry-typical practice at this ABV tier. The producer's
  positioning emphasises a fruity, pear-led house character; in
  the project's voice, the release is an unpeated, bourbon-and-
  sherry-cask-married Speyside core bottling at the introductory
  tier. It sits at the same nominal age and ABV-tier as the
  project's other 40% chill-filtered Speyside / Lowland flagship
  cores (Auchentoshan 12, Glenfarclas 10).


