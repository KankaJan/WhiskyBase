# --- Description ------------------------------------------------------------
description: |
  The Ardnahoe Inaugural Release (2024) is the distillery's first whisky: a
  five-year-old peated Islay single malt (~40 ppm) matured in a combination
  of ex-bourbon and ex-oloroso sherry casks, bottled non-chill-filtered and
  naturally coloured at 50% ABV [2]. As a young, limited first release it
  marks the arrival of Islay's newest distillery rather than a standing
  core expression.


