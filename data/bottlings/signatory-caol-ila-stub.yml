# --- Description ------------------------------------------------------------
description: |
  Schema-pressure-test placeholder for an Independent Bottling under
  the Signatory Vintage Cask Strength Collection. Production-line
  and distillery references point at Caol Ila (not yet populated,
  exercising the forward-reference pattern per handover §8); the
  bottler reference resolves to `data/bottlers/signatory.yml`. The
  four IB discriminator fields all carry resolvable values, with
  the `bottler_series` field pointing at the
  `cask-strength-collection` sub-series defined in the bottler
  entry.

  The four `[v0.1 redundancy]` markers in the fields above (
  cask_strength: true, non_chill_filtered: true, natural_colour:
  true, batch_or_cask.type: single_cask) are present because the
  bottler v0.1 schema has no way for the series declaration to
  express presentation defaults that all bottlings under that
  series automatically inherit. In a v0.2 schema with
  `series.presentation_defaults`, these fields could be omitted
  from individual bottlings under the CSC and inherited from the
  series declaration, with bottling-level overrides where a
  specific release deviates.


