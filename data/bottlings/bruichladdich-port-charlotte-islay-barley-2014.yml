# --- Description ------------------------------------------------------------
description: |
  Vintage release in the Port Charlotte line, distilled 2014 from the
  2013 Islay barley harvest and bottled at 7 years old [1][2]. Made
  from 100% Islay-grown Concerto and Propino barley sourced from eight
  Islay farms (Cruach, Craigens, Island, Dunlossit, Coull, Rockside,
  Sunderland, Mulindry) [2][3]. Peated to the line's 40 ppm
  specification, with maturation split 84% first-fill bourbon, 8%
  second-fill virgin oak, and 8% second-fill Bordeaux wine casks [1][2].
  Bottled at 50% ABV, non-chill-filtered with natural colour [1]. The
  release pairs with the unpeated Bruichladdich Islay Barley series in
  testing the producer's terroir thesis on peated spirit.


# --- Tasting Notes ----------------------------------------------------------
notes_official: |
  Producer-stated character notes [2]: "Malty digestive biscuits and
  peat embers" on the nose; "an initial citrus tang" with "sweet ripe
  fruit and gentle peat smoke" on the palate; "subtle marine character"
  with "sandy minerality" and "toasted oak"; "a medley of apricot,
  peach and ripe melon delicately wrapped in charred heather and peat
  embers".

notes_independent:
  - reviewer: Drinkhacker (Christopher Null)
    url: https://www.drinkhacker.com/2023/07/02/review-bruichladdich-port-charlotte-islay-barley-2014-heavily-peated-islay-single-malt/
    date: 2023-07
    nose: |
      Lightly smoky rather than heavy; sweet, with honey and stone
      fruit touched with spices (red pepper, saffron); melon notes
      emerging with time, almost Midori-like.
    palate: null
    finish: null
    summary: |
      Reviewer characterises the release as well-rounded despite the
      "heavily peated" designation; notes lower wine-cask proportion
      vs. the previous (2012) release.

