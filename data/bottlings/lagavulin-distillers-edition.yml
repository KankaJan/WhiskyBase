# --- SCHEMA-OBSERVATION (PX cask slug + Distillers Edition series) -------
# Two small observations surfaced by this entry:
#
# 1. **Pedro Ximénez sherry cask vocabulary.** The project's cask
#    entries include `fino-sherry-butt` and `oloroso-sherry-butt`
#    but not `pedro-ximenez-sherry-butt`. PX is structurally
#    distinct from fino and oloroso (sweet rather than dry, made
#    from sun-dried Pedro Ximénez grapes, very high residual
#    sugar) and is a common finishing cask in Scotch — Lagavulin
#    Distillers Edition, Glendronach PX-finished, Glenfarclas
#    105, etc. all use PX casks. Candidate addition to
#    /data/casks/ when PX-finished bottlings accumulate.
#
# 2. **Diageo Distillers Edition as a cross-distillery series.**
#    The Distillers Edition isn't a Lagavulin-specific marketing
#    line; it's a Diageo-internal series spanning multiple
#    distilleries. The project's `bottler_series` field (designed
#    for IB bottler series) doesn't naturally fit Diageo's
#    multi-distillery cross-cut. Two design options when this
#    matters: (a) populate Diageo as a bottler entity (even
#    though it's a corporate parent rather than a distinct
#    bottling operation) and use the existing bottler_series
#    mechanism; (b) introduce a separate `corporate_series` or
#    `cross_distillery_series` field for OB-series spanning
#    multiple distilleries within one corporate owner. Deferred
#    until more such cross-cuts surface (Diageo Special Releases,
#    Pernod Ricard / Chivas Brothers cross-distillery series,
#    etc.).


