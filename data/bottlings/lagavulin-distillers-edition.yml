# --- Description ------------------------------------------------------------
description: |
  Lagavulin Distillers Edition, an annual recurring release with
  a Pedro Ximénez (PX) sherry-cask finish over Lagavulin's
  standard ex-bourbon primary maturation, bottled at 43% ABV
  [1]. The Distillers Edition is a Diageo-internal series
  spanning multiple distilleries (Lagavulin, Talisker, Oban,
  Cragganmore, Dalwhinnie, Glenkinchie); each distillery's
  Distillers Edition uses a finishing-cask type characteristic
  of the distillery's regional or stylistic identity (the
  Lagavulin DE uses PX). Each year's release carries a distinct
  vintage and bottling year; the presentation specs (43% ABV,
  PX finish, batch vatting) are stable across years.


