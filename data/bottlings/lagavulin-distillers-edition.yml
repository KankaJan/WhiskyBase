# --- Maturation -------------------------------------------------------------
# Lagavulin Distillers Edition: primary maturation in ex-bourbon
# American oak (typical Lagavulin core programme), with a
# secondary maturation in PX (Pedro Ximénez) sherry casks for the
# finish. The PX exposure is substantial enough to be borderline
# between "finish" and "secondary maturation" by the project's
# convention; the producer markets it as a finish and the duration
# (commonly ~6-12 months) is at the boundary.
maturation:
  - cask_type: bourbon-barrel
    fill_number: null
    proportion: 1.0
    duration_years: null          # Varies per year; typically
                                  # 13-16 years primary maturation
                                  # before transfer.
    cooperage: null
    notes: |
      Primary maturation in ex-bourbon American oak per the
      Lagavulin standard programme.

