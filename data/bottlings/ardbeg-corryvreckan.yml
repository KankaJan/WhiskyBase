# --- Description ------------------------------------------------------------
description: |
  A core no-age-statement release, named after the Corryvreckan
  whirlpool off the north of Islay's neighbouring island of
  Jura. Corryvreckan is a vatting of Ardbeg matured in ex-bourbon
  American oak with a French-oak component, bottled at a
  consistent 57.1% ABV, non-chill-filtered and at natural
  colour [1]. The French-oak component gives it a deeper, more
  tannic and peppery character than the ex-bourbon 10 Year Old
  or the sherry-influenced Uigeadail, and it is the
  highest-strength release of the three core Ardbeg expressions
  modelled here. As a no-age-statement bottling it carries no
  age on the label (see glossary/age-statement).


