# --- Description ------------------------------------------------------------
description: |
  Released globally September 2017 [1], this Octomore release holds the
  publicly-claimed record for the highest PPM Scotch single malt as of
  2026-05. The malt was specified at 309.1 ppm phenols using HPLC
  measurement, explicitly disclosed by the producer at release [1].
  Distilled 2011 from 100% Islay barley grown on Octomore Farm in 2010
  and malted at Bairds in Inverness [2][3]. Aged 5 years — younger than
  the rest of the Octomore 8 series — and bottled at cask strength
  61.2% ABV with an outturn of 18,000 bottles [1][2][3]. The cask
  programme is 56% first-fill ex-bourbon American oak and 44%
  European oak from Pauillac, Ventoux, Rhône, and Burgundy
  appellations [1][2][3]. Within the Octomore series taxonomy this is
  the .3 (Islay barley terroir) variant of Edition 8; it is also the
  defining stress-test for any data model attempting to record peating
  measurement honestly, because the producer's explicit method
  disclosure makes the figure unambiguously interpretable.


# --- Tasting Notes ----------------------------------------------------------
notes_official: |
  Producer-attributed framing at release [1]: "We believe it to be the
  peatiest Scotch ever produced, but then we are not some omnipotent,
  all-knowing Yoda" (Bruichladdich spokesperson). The producer also
  noted that "the nature and variety of Octomore depends on far more
  than simply numbers, but these were staggering" [1].

notes_independent:
  - reviewer: Peated Perfection (blog)
    url: http://peatedperfection.blogspot.com/2018/05/octomore-83-whisky-review.html
    date: 2018-05
    nose: |
      Sweet, creamy, and herbal; lightly medicinal; smoky salted
      toffee with subtle dry earthy peat; smoked bacon and freshly
      opened bandages; sweet vanilla cream, drying seaweed, subtle
      sweet stone fruits (apricot, plum, cherry jam).
    palate: |
      Big explosion of bitter, crumbly, earthy, spicy peat with a
      lovely creamy and fruity sweetness behind; more sweet vanilla
      cream, spicy ashy herbal smoke, rock salt, sweet stone fruit
      jam.
    finish: |
      Long; massively peaty, spicy, and creamy initially; peat tapers
      but lasts for "eons", remaining lightly bitter, earthy, crumbly,
      and spicy; salty sea breezes, freshly opened bandages, herbal
      and leathery smoke, lactic dairy notes, farmyard barley, ashy
      smoke.
    summary: Score 4.5/5; "Outstanding. Wonderful. Delicious."

  - reviewer: Distilled Sunshine (José Massú Espinel)
    url: https://distilledsunshine.wordpress.com/2020/09/18/octomore-08-3-309ppm/
    date: 2020-09
    nose: |
      Fresh, perfumed peat; mint; melted chocolate fudge; smoke from
      a scented candle; naphthalene; nice buttery chocolate.
    palate: null
    finish: null
    summary: |
      Score 80/100. A dissenting view — reviewer self-identifies as a
      "hardcore peat head" but characterises the dram as "too young,
      too simple, and too powerful to be truly enjoyable", and
      sceptical of the "peatiest whisky ever" framing. Useful as a
      counterweight to overwhelmingly positive coverage.

  - reviewer: Whiskybase (community aggregate)
    url: https://www.whiskybase.com/whiskies/whisky/99307/octomore-edition-083-masterclass-309-ppm
    date: 2017-08
    nose: null
    palate: null
    finish: null
    summary: |
      High community engagement (430+ ratings); aggregate score
      reflects polarised reception typical of extreme-PPM releases.


