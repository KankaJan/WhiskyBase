# --- Description ------------------------------------------------------------
description: |
  Lagavulin's flagship core release, 16 years matured predominantly
  in ex-bourbon American oak with a refill ex-sherry component,
  bottled at 43% ABV [1]. The 16 Year Old was established as
  Lagavulin's reference expression at the launch of Diageo's
  (then United Distillers') Classic Malts portfolio in the late
  1980s and has been continuously available since. Chill-filtered
  with caramel colouring per industry-typical practice at this
  ABV. The 16-year age statement at the core-range level is
  longer than the modern norm — most Scotch flagship cores sit
  at 10-12 years; Lagavulin 16 reflects the older default
  established before "no-age-statement" releases became
  widespread.


