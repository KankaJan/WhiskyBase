  ean: null


# --- Description ------------------------------------------------------------
description: |
  The eleventh edition of the Black Art series, released 1 November 2023
  [3], and the seventh under Head Distiller Adam Hannett [4]. The series
  is structured around producer-held secrecy: cask types, barley
  provenance, and maturation details are deliberately undisclosed, with
  the recipe known only to the head distiller [1][3]. What is publicly
  stated is that all spirit is drawn from "pre-renaissance" casks —
  Bruichladdich-distilled before the 2001 Reynier-led reopening — and
  that maturation has taken place on Islay [3]. The release is a 24-year-
  old vatting, bottled at the natural strength of 44.2% ABV, non-chill-
  filtered with natural colour [1][2]. The release exemplifies a category
  of producer-secret bottling that the schema must accommodate without
  fabricating undisclosed values.


# --- Tasting Notes ----------------------------------------------------------
notes_official: |
  Producer's characterisation [1]: "An enigmatic alchemy which relies on
  nature, craftsmanship and the quiet passing of time." Stated character
  notes vary by retail listing and are not consistently published in a
  single producer document for this edition; available reseller listings
  cite dried fruits, honeyed caramel, rich oak, and gentle spice [2].

