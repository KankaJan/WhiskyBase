# --- Description ------------------------------------------------------------
description: |
  Bunnahabhain's flagship core release, 12 years matured in a
  bourbon-barrel-led programme with an oloroso ex-sherry
  component, bottled at 46.3% ABV non-chill-filtered at natural
  colour [1]. The current presentation has been in place since
  Bunnahabhain's 2010 transparency-positioning transition: prior
  to 2010 the release was bottled at 40% ABV chill-filtered with
  caramel colouring, in the conventional industrial-core
  presentation. The post-2010 livery places Bunnahabhain 12 in
  the "craft / transparency" presentation cluster (NCF, natural
  colour, ≥46% ABV) — see educational/scotch-presentation-
  conventions — and is notable as one of the early high-volume
  core releases to make that transition. The lightly-peated
  Bunnahabhain spirit (around 1-2 ppm at malt spec) carries
  the maritime Islay influence from coastal warehousing without
  the heavy-peating character of the south-Islay producers.


