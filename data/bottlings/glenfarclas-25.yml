# --- Description ------------------------------------------------------------
description: |
  Glenfarclas's luxury core release at the 25-year age tier,
  matured predominantly in oloroso ex-sherry butts and bottled
  at 43% ABV [1]. The 25 Year Old reaches the slow-exchange
  phase of cask maturation kinetics (see educational/cask-
  maturation-kinetics §3), with extended sherry-cask character
  development and cumulative oxidative changes characterising
  the spirit. Chill-filtered with caramel colouring at the
  43% ABV presentation per industry-typical practice for the
  luxury-core tier — contrasting with the Glenfarclas 15 Year
  Old's higher-ABV NCF natural-colour presentation. The
  Glenfarclas family-tree range continues beyond the 25 Year
  Old with 30 and 40 Year Old expressions at higher price
  tiers and longer maturation depths.


