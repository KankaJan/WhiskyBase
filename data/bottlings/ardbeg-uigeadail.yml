# --- Description ------------------------------------------------------------
description: |
  A core no-age-statement release, named after Loch Uigeadail —
  the hill loch that is the distillery's water source. Uigeadail
  is a vatting of Ardbeg matured in ex-bourbon American oak with
  a portion from ex-oloroso sherry casks, bottled at a consistent
  54.2% ABV, non-chill-filtered and at natural colour [1]. The
  sherry-cask component sets it apart from the predominantly
  ex-bourbon 10 Year Old, layering dried-fruit richness over the
  heavy peat. As a no-age-statement vatting it carries no age
  on the label (see glossary/age-statement); it is a fixed
  higher-strength bottling rather than a single-cask
  cask-strength release.


