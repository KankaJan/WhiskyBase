# --- Description ------------------------------------------------------------
description: |
  Core no-age-statement release of the Longrow line, bottled at
  46% ABV non-chill-filtered with natural colour [1]. Heavily-
  peated (50-55 ppm malt spec) and double-distilled, in contrast
  to Springbank's lightly-peated 2.5×-distilled core. The
  Longrow line was first distilled at Springbank in 1973
  reviving the name of an earlier 19th-century Campbeltown
  distillery. The core peated NAS release is the most accessible
  Longrow expression; aged and special releases (Longrow 18, 21,
  Red, etc.) sit alongside it.


