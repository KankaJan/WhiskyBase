# --- Maturation -------------------------------------------------------------
# Distillers Edition format: primary ex-bourbon maturation, then
# transferred to fortified-wine casks for a substantive secondary
# maturation. For Caol Ila specifically the secondary cask is
# Moscatel (Spanish fortified Muscat-grape wine cask), distinguishing
# the Caol Ila Distillers Edition from the Lagavulin Distillers
# Edition's PX (Pedro Ximénez) secondary finish.
maturation:
  - cask_type: bourbon-barrel
    fill_number: null
    proportion: null                # Primary maturation phase.
    duration_years: null            # Vintage-specific.
    cooperage: null
    notes: |
      Ex-bourbon barrels for the primary maturation. The
      ex-bourbon component dominates the spirit's character
      development before the Moscatel-cask secondary phase.

  - cask_type: wine-cask              # Moscatel secondary cask. The
                                      # project's cask vocabulary
                                      # currently uses the generic
                                      # wine-cask slug for fortified
                                      # Moscatel; a specific
                                      # `moscatel-wine-cask` slug
                                      # could be added if frequency
                                      # justifies it (currently this
                                      # is the only WhiskyBase entry
                                      # citing Moscatel finishing).
    fill_number: null
    proportion: null
    duration_years: null
    cooperage: null
    notes: |
      Moscatel ex-wine cask secondary maturation. Moscatel is
      a fortified Spanish wine produced from Muscat / Moscatel
      grapes, predominantly in Andalusia. The secondary
      maturation duration for Distillers Edition releases is
      typically 12-24 months — long enough to qualify as a
      substantive secondary maturation rather than a short
      "finish" (per the project's convention; see
      data/bottlings/lagavulin-distillers-edition.yml for the
      parallel PX-finish discussion).

finish: null


