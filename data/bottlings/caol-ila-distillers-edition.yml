# --- Description ------------------------------------------------------------
description: |
  Caol Ila's annual Distillers Edition release within Diageo's
  cross-distillery Distillers Edition programme, distinguished
  by a secondary Moscatel-cask maturation following primary
  ex-bourbon maturation [1]. The Moscatel finish layers
  fortified-Muscat-wine character (dried-fruit and grape
  sweetness) over the underlying Caol Ila peated profile,
  producing a contrast that the Distillers Edition format
  exploits across the Diageo malt portfolio (each participating
  distillery uses a different secondary cask: Lagavulin uses
  PX, Talisker uses Amoroso sherry, Glenkinchie uses Amontillado,
  etc.). The Distillers Edition releases are bottled at 43%
  ABV; not formally a "Special Releases" Diageo programme but a
  parallel annual recurring series running since the late 1990s.


