# --- Description ------------------------------------------------------------
description: |
  Ardbeg's flagship core release: 10 years matured predominantly
  in ex-bourbon American oak and bottled at 46% ABV,
  non-chill-filtered and at natural colour [1]. The 10 Year Old
  is the entry-level age-statemented core release in the Ardbeg
  range and the most widely-distributed heavily-peated Islay
  single malt at its tier. Its 46% non-chill-filtered,
  natural-colour presentation is a deliberate departure from the
  40%-ABV chill-filtered convention common at the core-range tier
  of some other Islay distilleries (Laphroaig 10, Caol Ila 12) —
  see educational/scotch-presentation-conventions.


