# --- Description ------------------------------------------------------------
description: |
  Cameron Brig is the long-standing official single-grain bottling of the
  Cameronbridge distillery, bottled at 40% ABV [2]. For many years it was
  the distillery's only single grain on the market — a light, soft style
  reflecting the high-strength continuous distillation — and remained so
  until Diageo launched the premium Haig Club range in 2014. It is the
  project's first single-grain entry, the counterpart to the single malts
  that dominate the rest of the data set.


