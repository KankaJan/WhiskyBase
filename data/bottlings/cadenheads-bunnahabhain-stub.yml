# --- SCHEMA-GAPS observed during this pressure-test ------------------------
# This block is non-schema content for the bottler v0.2 promotion
# discussion. It documents what surfaced as a gap during the exercise.
#
# 1. **Sub-series support.** Cadenhead's Authentic Collection has had
#    informal sub-categories over the years (early small-batch wine
#    finishes, the "small bottlings" subset). The bottler v0.1 schema's
#    series block is a flat list — no parent/child relationship. For
#    Cadenhead's specifically, the flat list works because the
#    sub-categories are minor; for Signatory Vintage (with its multiple
#    formal sub-series: Cask Strength Collection, Un-Chillfiltered
#    Collection, etc., each with consistent presentation rules) the
#    flat list will not work. Defer sub-series modelling until
#    Signatory or a similarly-structured bottler is populated.
#
# 2. **Series presentation rules.** Cadenhead's Authentic Collection
#    series implies cask strength + non-chill-filtered + natural
#    colour + single-cask. These could be schema-level defaults on the
#    series declaration (saving repetition on every bottling) but
#    currently are not. Bottler v0.2 candidate: add `presentation_defaults`
#    block to the series entry, with override semantics on the bottling.
#
# 3. **production_line for IB of unpopulated distilleries.** When the
#    distillery isn't yet populated, the production_line slug is
#    necessarily a forward reference. The bottling v0.2 schema treats
#    production_line as required — could relax to "required where the
#    distillery is populated, optional otherwise" but this complicates
#    schema-validation. Defer; current forward-reference behaviour is
#    acceptable per handover §8.
#
# 4. **Series-ID validation by the resolver.** The check_references.py
#    script resolves bottler_series by splitting on "/" and confirming
#    the bottler part exists; it does NOT verify the series-id part
#    exists in the bottler's series list. Script-level gap; should be
#    addressed in a future check_references.py update.
#
# 5. **Cadenhead's-Distillery relationship semantics.** Cadenhead's is
#    owned by J&A Mitchell, the Springbank Distillery proprietor. The
#    project does not currently model bottler-distillery corporate
#    affiliations beyond per-bottling `bottled_by` references. If a
#    user wanted to query "all bottlings by Springbank-affiliated
#    entities," there's no schema support. Defer until use case
#    surfaces.


