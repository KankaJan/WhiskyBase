# --- Description ------------------------------------------------------------
description: |
  The Talisker Distillers Edition is the distillery's entry in Diageo's
  cross-distillery Distillers Edition series — the same annual,
  vintage-dated, double-matured format used for Lagavulin, Caol Ila and
  Glenkinchie. The Talisker Classic Malt (ex-bourbon American oak, ~10
  years) is given a finishing period of around six months in ex-amoroso
  sherry casks, which adds a sweeter, dried-fruit layer over the peppery
  maritime smoke [2]. Bottled at 45.8% ABV with no age statement.


