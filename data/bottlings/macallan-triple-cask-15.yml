# --- Description ------------------------------------------------------------
description: |
  The Macallan Triple Cask Matured 15 Year Old — the post-2018 rename of
  The Macallan Fine Oak 15, continuous in recipe since the 2004 Fine Oak
  launch [1]. Three cask types in the vatting: European-oak oloroso,
  American-oak oloroso, and American-oak ex-bourbon. The Fine Oak range
  was launched in 2004, introducing ex-bourbon American-oak casks
  alongside the existing European-oak and American-oak sherry casks — a
  three-cask vatting unique among the core Macallan ranges. The 2018
  rename to Triple Cask Matured signalled the three-cask construction
  explicitly while the underlying recipe was retained [1]. Of the three
  Macallan bottlings in this knowledge base, this is the only one that
  includes ex-bourbon casks — useful as a contrast point for the
  bourbon-cask path on a distillery whose default identity is
  sherry-led.


