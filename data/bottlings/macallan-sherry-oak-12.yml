# --- Description ------------------------------------------------------------
description: |
  The Macallan Sherry Oak 12 Year Old is the canonical sherry-cask
  Macallan: twelve years' maturation in oloroso-seasoned oak sherry
  casks from Jerez, bottled at 43% ABV. It is the longest-running core
  Macallan bottling and the expression that established the modern
  brand's sherry-cask identity in the 1980s and 1990s under chairman
  Allan Shiach. The label states no specific oak-species split, but the
  producer identifies oloroso-seasoned casks shipped from Jerez de la
  Frontera as the maturation vessel, sourced through partnerships with
  Spanish cooperages and, since September 2023, increasingly through
  Edrington's own Vasyma cooperage in Jerez [2]. It is the comparison
  point for the Double Cask (which adds an American-oak sherry
  component) and the Triple Cask Matured (which adds an American-oak
  ex-bourbon component) ranges of the same age.


