# --- Description ------------------------------------------------------------
description: |
  Glenfiddich 15 Year Old — marketed as "Solera Fifteen" — is the
  release built on the distillery's Solera Vat, a large marrying
  vessel installed in 1998 and inspired by the Spanish sherry
  solera [1]. Spirit matured for 15 years in a combination of
  ex-bourbon American oak, ex-oloroso European oak, and new
  American oak is emptied into the vat; the vat is never drained
  below roughly half its volume and is continually replenished,
  so each draw for bottling carries a fraction of spirit that
  has cycled through the vat over many years. The producer's
  stated intent is continuity of character across bottlings —
  the partial-draw / partial-refill cycle smooths batch-to-batch
  variation in the same way a sherry solera does. Bottled at 40%
  ABV, chill-filtered with caramel colouring per industry-typical
  practice at this tier. This is the project's first populated
  bottling exercising a solera-style continuous-marrying vatting
  stage — structurally distinct both from a discrete numbered
  batch and from the single-cask / small-batch patterns: the
  Solera Vat is a perpetual marrying vessel rather than a
  one-time vatting. The producer characterises the resulting
  profile as richer and more spice-led than the 12 Year Old,
  attributed to the higher sherry-cask and new-oak contribution
  and the marrying effect of the vat.


