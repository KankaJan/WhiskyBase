# --- Description ------------------------------------------------------------
description: |
  Laphroaig Quarter Cask is a NAS core release introduced in 2004,
  bottled at 48% ABV non-chill-filtered and natural-colour
  [1][2]. The release is built on the standard Laphroaig
  ex-bourbon-cask programme (Maker's Mark Kentucky ex-bourbon
  barrels, the same base as the 10 Year Old) with a secondary
  ~7-month finish in quarter casks — historic Scottish casks of
  approximately 125 L capacity, roughly one-quarter the volume of
  a standard American Standard Barrel. The smaller cask volume
  increases the spirit-cask interfacial surface area relative to
  the liquid volume by roughly 30%, accelerating wood-derived
  extraction during the finish period. The 48% ABV NCF natural-
  colour presentation cluster (see
  educational/scotch-presentation-conventions) reflects the
  producer's positioning of Quarter Cask as a "craft transparency"
  release at a price point above the 40% chill-filtered standard
  10 Year Old; the cluster is also seen at Bunnahabhain 12,
  Glenfarclas 15, and Highland Park Cask Strength among the
  project's populated entries. The finish-cask structure is
  notable for using the same wood category as the primary
  maturation (ex-bourbon → ex-bourbon-quarter-cask) rather than
  changing wood category for the finish — distinguishing
  Quarter Cask from wine-cask-finish releases like the Diageo
  Distillers Edition programme.


