    cooperage: Maker's Mark (Kentucky)
    notes: |
      Primary maturation in standard ex-bourbon American oak
      from Maker's Mark in Kentucky, typically for ~5-6 years
      per trade-press references [2]. The bourbon-cask base
      is the same as the 10 Year Old; the differentiating
      step is the secondary small-cask finish.

finish:
  cask_type: bourbon-barrel             # Same wood type (American
                                        # oak, ex-bourbon) but in a
                                        # quarter-cask (~125 L
                                        # capacity, also called a
                                        # "firkin") rather than the
                                        # standard 200-L bourbon
                                        # barrel. The smaller cask
                                        # volume increases the
                                        # spirit-cask interfacial
                                        # surface area relative to
                                        # the volume of liquid by
                                        # roughly 30% — accelerating
                                        # wood-derived extraction
                                        # kinetics during the finish
                                        # period.
  duration_months: 7                    # ~7 months in the quarter
                                        # cask per trade-press
                                        # references [2]. Producer
                                        # materials describe this
                                        # as the producer-distinctive
                                        # finishing step.
  duration_years: null
  cooperage: null
  notes: |
    Quarter cask is the historic Scottish term for casks of
    ~125 L capacity (roughly one-quarter of the standard
    American Standard Barrel volume of ~200 L). The
    producer-cited basis for the bottling is the accelerated
    wood-derived maturation in the smaller cask, which exposes
    the same spirit to a higher surface-area-to-volume ratio.
    See educational/cask-maturation-kinetics for the
    extraction-rate framework underlying small-cask finish
    methods. The quarter-cask finish is structurally distinct
    from the wine-cask finishes used in distillery-edition
    programmes (Lagavulin / Caol Ila / Glenkinchie DEs) — same
    wood category in the finish as the primary, but
    accelerated kinetics rather than wine-cask flavour
    overlay.


