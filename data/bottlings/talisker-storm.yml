# --- Description ------------------------------------------------------------
description: |
  Talisker Storm is the no-age-statement member of the core range,
  launched in 2013. It is built from a wider mix of American-oak casks
  than the 10 Year Old — including a higher proportion of younger and
  rejuvenated casks — to give a more intense, smoke-forward take on the
  peppery maritime house style [2]. Bottled at 45.8% ABV. Within the
  range it sits alongside the age-statement 10 Year Old and the
  sherry-finished Distillers Edition as the NAS, intensity-led option.


