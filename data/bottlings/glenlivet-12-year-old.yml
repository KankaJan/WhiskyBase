# --- Description ------------------------------------------------------------
description: |
  The Glenlivet 12 Year Old is the distillery's flagship core
  expression and the archetype of the light, floral, fruity Speyside
  style: twelve years' maturation in a combination of American-oak
  ex-bourbon and European-oak (sherry) casks, bottled at 40% ABV [1].
  It is the longest-running core Glenlivet and the reference point for
  the rest of the range — the 15 Year Old French Oak Reserve adds a new
  French-oak component, and the cask-strength Nadurra Oloroso shifts to
  first-fill oloroso sherry. In several markets the 12 was de-emphasised
  between 2015 and 2018 in favour of the no-age-statement Founder's
  Reserve, then reinstated as a core listing [1].


