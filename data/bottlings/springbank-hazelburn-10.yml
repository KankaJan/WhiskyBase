# --- Description ------------------------------------------------------------
description: |
  Core 10-year-old release of the Hazelburn line, bottled at 46%
  ABV non-chill-filtered with natural colour [1]. Unpeated and
  triple-distilled, in contrast to Springbank's lightly-peated
  2.5×-distilled core and Longrow's heavily-peated double-
  distilled core. Hazelburn was first distilled at Springbank in
  1997 reviving the name of an earlier 19th-century Campbeltown
  distillery (Hazelburn, 1825-1925). The core 10 is the reference
  expression of the Hazelburn line; older and special-cask
  Hazelburn releases sit alongside it.


