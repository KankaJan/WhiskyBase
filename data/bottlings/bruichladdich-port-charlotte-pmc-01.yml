# --- Description ------------------------------------------------------------
description: |
  Sixth release in Bruichladdich's Port Charlotte Cask Exploration
  series and the first in that series to use Pomerol casks [1][3].
  Distilled 2013 from Scottish Concerto barley peated to the line's
  40 ppm specification [1][2]. Aged 4 years in first-fill bourbon
  barrels, then re-casked in 2017 into Pomerol wine casks from
  Bordeaux's Right Bank for an additional 5 years [1][2][3]. Bottled
  at 54.5% ABV in March 2023 [4]. The release exemplifies the line's
  exploration of cask-driven flavour variation while holding the
  underlying spirit specification constant.


# --- Tasting Notes ----------------------------------------------------------
notes_official: |
  Producer-stated character notes (head distiller Adam Hannett, via
  release announcement) [3]: warm peat smoke and red fruits opening
  on the nose, moving to stewed pears, melon, and a subtle marine
  note; malt sugar and peat smoke on the palate with succulent
  blackberries, plum, and aged leather; mellow marine tones and
  citrus lemon rind on the finish, with the line's signature peat
  smoke lingering.

