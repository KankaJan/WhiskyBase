# --- Maturation -------------------------------------------------------------
# This is a re-cask (sometimes called "double-matured") release rather
# than a finish. The schema models this as two consecutive maturation
# cask types with non-trivial duration in each, rather than as a brief
# finish. The distinction matters: a 5-year second maturation in
# Pomerol casks is the dominant flavour driver, not a surface
# finishing pass.
maturation:
  - cask_type: bourbon-barrel
    fill_number: 1
    proportion: 1.0               # 100% of spirit spent the first 4 years
                                  # in first-fill bourbon barrels [1][2][3].
    duration_years: 4
    cooperage: null
    notes: |
      Initial maturation (2013-2017). All spirit then re-casked into
      Pomerol casks for the second maturation phase.

  - cask_type: pomerol-wine-cask
    fill_number: 1
    proportion: 1.0
    duration_years: 5             # 2017-2023, 5 years in Pomerol casks
                                  # [1][2][3].
    cooperage: null
    notes: |
      Second maturation in Pomerol wine casks from Bordeaux's Right
      Bank. The producer states this is the first Port Charlotte
      release matured in Pomerol casks [1][3].

finish: null                      # The Pomerol phase is a substantive
                                  # maturation (5 years), not a finish in
                                  # the conventional short-duration sense.


