# --- Description ------------------------------------------------------------
description: |
  Caol Ila's flagship core release, 12 years matured
  predominantly in ex-bourbon barrels and bottled at 43% ABV [1].
  Launched in 2002 as part of Diageo's Hidden Malts series — the
  marketing programme that introduced previously-blend-only
  Diageo malts (Caol Ila, Clynelish, Glen Elgin) to the
  single-malt category at scale — the Caol Ila 12 Year Old has
  been continuously available since. Heavily peated at the
  Port-Ellen-Maltings-supplied 30-35 ppm spec range; the spirit's
  character is conventionally described as cleaner and less
  briny than the south-coast Islay producers (Lagavulin,
  Laphroaig, Ardbeg) at similar peating levels, attributed in
  producer materials to the tall lantern stills and the
  east-coast site exposure. Chill-filtered with caramel
  colouring per industry-typical practice at this ABV tier.


