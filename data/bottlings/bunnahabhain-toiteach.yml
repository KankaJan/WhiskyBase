# --- Description ------------------------------------------------------------
description: |
  Bunnahabhain Toiteach is the producer's peated core release,
  drawn from the distillery's separate peated production runs at
  spec ppm in the 35-40 range (against the 1-2 ppm of the
  default Bunnahabhain Traditional production) [1]. Bottled at
  46.3% ABV non-chill-filtered at natural colour, the Toiteach
  matches the post-2010 Bunnahabhain core-range presentation
  convention and sits at the same price tier as the 12 Year Old
  flagship. The peated character contrasts with the south-Islay
  producers (Lagavulin, Laphroaig, Ardbeg) in being applied to a
  spirit that otherwise comes from Bunnahabhain's lighter-bodied
  house style (peat-free water source, large onion-shape stills);
  the result is positioned as a peated-Islay expression with a
  distinct profile from the south-coast cluster.


