# --- Description ------------------------------------------------------------
description: |
  Laphroaig's flagship core release, 10 years matured
  predominantly in ex-bourbon American oak from Maker's Mark in
  Kentucky and bottled at 40% ABV [1]. The 10 Year Old is the
  long-standing entry-level age-statemented core release in the
  Laphroaig range, continuously available for decades and the
  most widely-distributed heavily-peated Islay single malt at
  the modest-ABV tier. The 40% ABV chill-filtered presentation
  is consistent with the Beam Suntory / Suntory Global Spirits
  core-range pattern (parallel to other 40-43% chill-filtered
  flagships such as Caol Ila 12 and Glenkinchie 12). The Royal
  Warrant from HRH The Prince of Wales (1994, now HM King
  Charles III) applies to the Laphroaig brand overall rather
  than to a specific release. A separate Laphroaig 10 Year Old
  Cask Strength annual release at ~55-60% ABV NCF natural
  colour exists alongside the standard 10 Year Old; the cask-
  strength variant is not modelled in this entry.


