# --- Description ------------------------------------------------------------
description: |
  Auchentoshan's flagship core release: a 12-year-old triple-
  distilled Lowland single malt double-cask-matured in ex-bourbon
  American oak and Spanish oloroso sherry oak, bottled at 40% ABV
  [1]. The "double cask" terminology describes parallel primary
  maturation in both cask types vatted at bottling, not a primary-
  plus-finish arrangement. Chill-filtered with caramel colouring
  per industry-typical practice at this ABV tier. The release sits
  at the same nominal age and regional designation as Glenkinchie
  12 Year Old (the project's other populated Lowland flagship), but
  differs from it on three structural axes: the distillation regime
  (triple here, double for Glenkinchie); the cask programme
  (double cask with explicit sherry-oak component here; ex-bourbon-
  led at Glenkinchie 12); and the bottling ABV (40% here vs 43% at
  Glenkinchie 12). Auchentoshan's output is primarily directed at
  single-malt bottling rather than the blend trade — the inverse
  of Glenkinchie's ~90/10 split toward Johnnie Walker.


