# --- Description ------------------------------------------------------------
description: |
  Glenmorangie 18 Year Old, the line's long-aged core release,
  bottled at 43% ABV [1]. Maturation programme: 15 years in
  ex-bourbon American oak for the full population; a portion is
  then moved to oloroso sherry casks for the final 3 years and
  re-vatted with the ex-bourbon-only portion before bottling.
  The partial sherry exposure is a defining presentation feature
  versus the simpler ex-bourbon-only 10 Year Old.


