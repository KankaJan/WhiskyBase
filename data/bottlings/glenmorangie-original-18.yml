# --- Maturation -------------------------------------------------------------
# Glenmorangie 18 is matured 15 years in ex-bourbon, then a portion
# is moved to oloroso sherry casks for the final 3 years; the
# components are then re-vatted [1]. This is a partial-finish or
# secondary-maturation arrangement rather than a single cask
# programme. Per the project's documented convention (handover
# §10's deferred re-cask vs finish boundary discussion), the
# 3-year sherry phase is substantial enough to be modelled as a
# maturation entry rather than a finish.
maturation:
  - cask_type: bourbon-barrel
    fill_number: null
    proportion: 1.0
    duration_years: 18            # The full 18 years includes 15 yrs
                                  # in ex-bourbon for all spirit;
                                  # a portion goes to oloroso for the
                                  # last 3 years and is then re-vatted.
                                  # Maturation entry simplified here;
                                  # see notes.
    cooperage: null
    notes: |
      Primary maturation in ex-bourbon American oak. Per the
      producer's description, the full population spends 15 years
      in ex-bourbon. After that, a portion is moved to oloroso
      sherry casks for the remaining 3 years and the components
      are re-vatted before bottling.

  - cask_type: oloroso-sherry-butt
    fill_number: null
    proportion: null              # Producer-disclosed proportion not
                                  # consistently quantified; some
                                  # sources cite ~30% sherry-finished
                                  # but this varies.
    duration_years: 3
    cooperage: null
    notes: |
      Final 3-year secondary maturation in oloroso sherry casks
      for a portion of the spirit, then re-vatted with the
      ex-bourbon-only portion.

finish: null                      # The sherry-cask exposure is 3
                                  # years for a partial population —
                                  # modelled as a secondary maturation
                                  # entry rather than a finish per
                                  # the project's convention
                                  # (finishes are typically <12 months
                                  # terminal exposure).


