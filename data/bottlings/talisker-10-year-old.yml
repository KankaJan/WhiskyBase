# --- Description ------------------------------------------------------------
description: |
  Talisker 10 Year Old is the distillery's flagship and one of Diageo's
  six Classic Malts: a medium-peated (~18-22 ppm) Isle of Skye single malt
  bottled at the signature 45.8% ABV [1][2]. It is the reference Talisker —
  the expression that defines the peppery, smoky, maritime house style
  produced on the worm-tub-condensed, purifier-equipped five-still set.
  It is the comparison point for the Distillers Edition (an amoroso-sherry
  finish) and Storm (a no-age-statement, more intense expression).


